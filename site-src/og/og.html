<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@500&display=swap">
<style>
/* صورة المعاينة 1200×630 لما يُشارك رابط احجزلي في الواتساب أو تويتر */
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0B7A55;background:radial-gradient(900px 600px at 85% 15%,#139a6c 0%,#0B7A55 45%,#0A5F43 100%);color:#fff;font-family:"IBM Plex Sans Arabic",sans-serif;position:relative}
.card{position:absolute;inset:0;padding:70px 80px;display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:center}
.brand{display:flex;align-items:center;gap:16px;font-family:Tajawal,sans-serif;font-weight:900;font-size:54px;letter-spacing:-.01em}
.brand svg{width:60px;height:60px}
h1{font-family:Tajawal,sans-serif;font-weight:800;font-size:58px;line-height:1.25;margin:28px 0 18px;text-wrap:balance}
p{margin:0;font-size:26px;line-height:1.6;color:#DDF3E8;max-width:640px}
.chips{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.chips span{border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 18px;font-size:21px;font-family:Tajawal,sans-serif;font-weight:700}
.phone{width:320px;height:470px;background:#0B141A;border-radius:40px;border:8px solid #1c1c1e;padding:16px;display:grid;gap:12px;align-content:start;justify-self:end;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.b{max-width:92%;padding:12px 14px;border-radius:14px;font-size:19px;line-height:1.5;color:#E9EDEF;white-space:pre-line}
.in{background:#1F2C34;justify-self:start;border-top-right-radius:4px}
.out{background:#005C4B;justify-self:end;border-top-left-radius:4px}
.act{margin:10px -14px -12px;border-top:1px solid rgba(255,255,255,.1);padding:10px;text-align:center;color:#53BDEB;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z" fill="#F2B705"/><path d="M10.5 15.2l3.6 3.6 7.4-7.6" fill="none" stroke="#2A1F05" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>احجزلي</div>
    <h1>طلبات الواتساب تمشي لحالها بالكامل</h1>
    <p>الرد، الموقع، الموعد، التأكيد، التنبيه، الفاتورة والدفع. كلها أوتوماتيك بدون موظف، على رقمك نفسه.</p>
    <div class="chips"><span>يرد خلال ثانية</span><span>24 ساعة</span><span>بدون تطبيق للعميل</span></div>
  </div>
  <div class="phone">
    <div class="b out">السلام عليكم، ابي موعد</div>
    <div class="b in">هلا فيك 👋 نحجز لك الحين<div class="act">🗓️ احجز من هنا</div></div>
    <div class="b in">✅ تأكد طلبك · رقم 19293
📅 اليوم · من 8 م إلى 10 م</div>
  </div>
</div>
</body>
</html>
