<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4338CA">
<title>المناوب · لوحتي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%234338CA'/%3E%3Cpath d='M10.5 15.2l3.6 3.6 7.4-7.6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* لوحتي (مدير احجزلي): المنشآت، منشأة جديدة، طلبات الاشتراك، الاشتراكات، دليل التشغيل، ورابط محاكي البيع */
.biz-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.biz-row .lg{width:46px;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;overflow:hidden}
.biz-row .lg img{width:100%;height:100%;object-fit:cover;background:#fff}
/* شعار لوحتي: نفس علامة الرئيسية (فقاعة وصح) على تدرّج الأزرار */
.side .brand .lg{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
.side .brand .lg svg{width:26px;height:26px}
.prog{height:7px;border-radius:9px;background:var(--soft2);overflow:hidden;width:120px}
.prog i{display:block;height:100%;background:var(--accent)}
/* دليل التشغيل: خطوات كل منشأة بروابطها */
.ob{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:860px}
.obh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.obh select{flex:1;min-width:200px;max-width:380px}
.osteps{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;counter-reset:o}
.ost{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;counter-increment:o}
.ost.done{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.ost .t{display:flex;gap:10px;align-items:center}
.ost .t::before{content:counter(o);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft2);color:var(--muted);font-family:var(--display);font-weight:800;font-size:13px;flex:none}
.ost.done .t::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
.ost .t b{flex:1;font-family:var(--display);font-size:15.5px}
.ost p{margin:0;font-size:13.5px;color:var(--muted)}
.ost .st{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ost .copybox .btn{flex:none}
.chks{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chk{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;text-decoration:none;color:var(--muted);background:var(--card)}
.chk.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--soft)}
.ost .t .who{font-size:12px;color:var(--muted);background:var(--soft2);border-radius:99px;padding:2px 9px;white-space:nowrap}
.mk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.tpl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.form-sec{display:grid;gap:12px}
.form-sec h3{display:flex;gap:8px;align-items:center}
.form-sec h3 i{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:13px}
.rowline{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;align-items:center}
.staffline{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:start}
.citychips{display:flex;flex-wrap:wrap;gap:6px}
.citychips label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13.5px;cursor:pointer;background:var(--card)}
.citychips label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}
.citychips input{display:none}
.result{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes label{display:grid;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;background:var(--card);font-size:14px}
.modes label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.modes input{position:absolute;opacity:0;pointer-events:none}
.modes b{font-family:var(--display);font-size:14.5px} .modes span{font-size:12.5px;color:var(--muted)}
@media (max-width:620px){ .rowline{grid-template-columns:1fr 100px 36px} .staffline{grid-template-columns:1fr} .modes{grid-template-columns:1fr} }
/* العملاء المحتملين: أنشطة من البحث ورسالة لكل مجال */
.pf{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:center}
.pf .check{font-size:13.5px;white-space:nowrap}
.item.pro{min-width:0}
.item.pro .pn{font-family:var(--display);font-size:16px}
.item.pro .badge{white-space:normal}
.fit{font-size:10px;letter-spacing:2px;color:var(--accent);white-space:nowrap} .fit i{font-style:normal;color:var(--line)} .fit em{font-style:normal;font-size:12px;letter-spacing:0;color:var(--muted)}
.pnote{font-size:13.5px;padding:7px 10px}
.pains{margin:0;padding-inline-start:18px;font-size:13.5px;color:var(--muted)}
.mbox{display:grid;gap:6px;justify-items:start;min-width:0}
.mbox pre{margin:0;width:100%;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (max-width:760px){ .pf{grid-template-columns:1fr 1fr} .pf #pQ{grid-column:1/-1} }
/* بطاقات ميسر وأكواد الخصم: الجدول يتمرر داخل البطاقة بدل ما يوسّع الصفحة على الجوال */
#mysCard,#promoCard{grid-template-columns:minmax(0,1fr)} #mysCard>*,#promoCard>*{min-width:0}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script src="assets/reader.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon, money } = I;
  I.loading('نفتح لوحتك…');
  let session = null, me = null;
  try { const r = await I.boot('ihj-admin'); session = r.session; me = r.me; } catch (e) { return I.gate('الرابط غير صالح', 'الرابط ما عاد يشتغل، اطلب رابطًا جديدًا', 'err'); }
  if (!session || !me) return I.gate('افتح رابط لوحتك', 'اللوحة تنفتح من الرابط الخاص فقط، ومرة وحدة تكفي لكل جهاز', 'err');
  if (!me.admin) return I.gate('هذا مو رابط المدير', 'افتح رابط لوحتك الخاص', 'err');
  const sb = I.sb;
  async function q1(p) { const { data, error } = await p; if (error) throw error; return data; }

  const S = { tab: 'home', biz: [], set: {}, ch: {}, subs: {}, pays: [], steps: [], docs: {}, stats: {}, cfg: {}, leads: [], leadFilter: 'open', leadSearch: '', seenLeads: new Set(), prefill: null, obBiz: '', pros: null, pmsgs: {}, testi: null, meta: null, dreq: [] };
  const TABS = [['home', 'الرئيسية', 'home'], ['biz', 'المنشآت', 'store'], ['new', 'منشأة جديدة', 'plus'], ['leads', 'طلبات الاشتراك', 'bell'], ['pros', 'العملاء المحتملين', 'users'], ['testi', 'آراء العملاء', 'chat'], ['subs', 'الاشتراكات', 'money'], ['onboard', 'دليل التشغيل', 'guide'], ['deal', 'سير العمل', 'guide']];
  const PLAN = { bot: 'أتمتة الحجز', bot_pay: 'أتمتة الحجز + الدفع' };
  const BSTATUS = { setup: ['قيد التجهيز', 'b-warn'], live: ['شغّالة', 'b-ok'], paused: ['موقفة', 'b-cancelled'], ended: ['منتهية', 'b-cancelled'] };
  const LSTATUS = { new: ['جديد', 'b-gold'], contacted: ['تواصلنا', 'b-confirmed'], agreed: ['اتفقنا', 'b-arrived'], setup: ['قيد التجهيز', 'b-warn'], live: ['شغّال', 'b-ok'], lost: ['ما تم', 'b-cancelled'] };

  async function loadAll() {
    const [biz, set, ch, subs, pays, steps, stats, leads, docs, cfg, dreq] = await Promise.all([
      q1(sb.from('businesses').select('*').order('created_at', { ascending: false })),
      q1(sb.from('settings').select('business_id,pay_provider,vat_percent,capacity_mode,place_mode,pay_timing,faq,menu,tone,notify_owner,reminder_minutes')),
      q1(sb.from('channels').select('*')),
      q1(sb.from('subscriptions').select('*')),
      q1(sb.from('sub_payments').select('*').order('paid_on', { ascending: false })),
      q1(sb.from('setup_steps').select('*')),
      q1(sb.rpc('ihj_admin_stats')),
      q1(sb.from('signup_requests').select('*').order('created_at', { ascending: false }).limit(500)),
      q1(sb.from('client_docs').select('business_id,agreed_at,agreed_name,intake_at,intake_applied_at,intake,paid_claim_at')),
      sb.from('ihj_config').select('key,value').then((r) => r.data || []),
      sb.from('data_requests').select('*').order('created_at', { ascending: false }).limit(50).then((r) => r.data || []),
    ]);
    S.cfg = Object.fromEntries(cfg.map((x) => [x.key, x.value])); S.dreq = dreq;
    S.biz = biz; S.set = Object.fromEntries(set.map((x) => [x.business_id, x])); S.ch = Object.fromEntries(ch.map((x) => [x.business_id, x]));
    S.subs = Object.fromEntries(subs.map((x) => [x.business_id, x])); S.pays = pays; S.steps = steps; S.stats = Object.fromEntries(stats.map((x) => [x.business_id, x])); S.leads = leads;
    S.docs = Object.fromEntries(docs.map((x) => [x.business_id, x]));
    leads.forEach((l) => S.seenLeads.add(l.id));
  }
  try { await loadAll(); } catch (e) { console.error(e); return I.gate('ما قدرنا نفتح اللوحة', 'حدّث الصفحة', 'err'); }

  // ───── خطوات التجهيز لكل منشأة بترتيب الشغل الحقيقي: مين يسوي كل خطوة، وتتعلّم لحالها من البيانات ─────
  const PUBLIC = 'https://almunawib.com/';
  const docsOf = (b) => S.docs[b.id] || {};
  const paidSetup = (b) => S.pays.filter((p) => p.business_id === b.id && p.kind === 'setup').reduce((a, p) => a + Number(p.amount), 0);
  const AR_TPL = ['ihj_reminder', 'ihj_on_the_way', 'ihj_arrived', 'ihj_invoice', 'ihj_paid', 'ihj_update', 'ihj_new_order', 'ihj_staff_order', 'ihj_handoff'];
  const arApproved = (b) => ((S.ch[b.id] || {}).templates || []).filter((t) => t.language === 'ar' && t.status === 'APPROVED' && AR_TPL.includes(t.name)).length;
  const placeOf = (b) => (S.set[b.id] || {}).place_mode || 'visit';
  const built = (b, st) => st.services > 0 && st.hours > 0 && (placeOf(b) === 'online' || st.cities > 0);
  // [المفتاح، العنوان، مين، الوصف، الشرط]
  const STEPS = [
    ['contract', 'الدفعة الأولى', 'العميل + أنتِ', 'ترسلين له رابط الدفعة الأولى: يشوف المبلغ، يعلّم صح على «أوافق على الاتفاقية» (والاتفاقية داخلها)، وتطلع له بيانات التحويل ويضغط «حوّلت». وأنتِ تسجلين الدفعة لما توصل حسابك.', (b) => !!docsOf(b).agreed_at && paidSetup(b) > 0],
    ['docs', 'بياناته', 'العميل + أنتِ', 'يرسل لك صورة قائمة أسعاره أو رابط موقعه وتضغطين «عبّيها من صورة أو موقع»، أو يعبّي النموذج (5 دقايق). بعدها «طبّق بياناته».', (b) => !!docsOf(b).intake_applied_at],
    ['build', 'برمجة البوت', 'أنتِ', 'من لوحة المنشأة: الخدمات والأسعار، الأوقات، المدن أو الفروع، الأسئلة والأجوبة، الأزرار، الأسلوب، الموظفون.', (b, st) => built(b, st)],
    ['test', 'تجربته باسمه', 'العميل + أنتِ', 'يكلّم البوت في المحاكي كأنه عميل، وأي تعديل يطلبه تسوينه من لوحة المنشأة.', (b, st) => st.sim_orders > 0],
    ['connect', 'ربط الرقم', 'العميل (أو أنتِ معه)', 'ترسلين له رابط «اربط واتسابك»: يدخل فيسبوك ويختار رقمه ويأكّد من جواله، ورقمه يبقى على تطبيق واتساب للأعمال. ينربط بوضع الفحص، وبعدها ترفعين القوالب. (لين يجهز الربط المباشر: حساب Dualhook أو 360dialog باسم نشاطه، وتلصقين بياناته في «ربط الرقم».) تخلص لما توصل أول رسالة حقيقية.', (b, st) => (S.ch[b.id] || {}).status === 'connected' && !!st.last_real_in],
    ['templates', 'القوالب', 'أنتِ + ميتا', 'بعد الربط مباشرة ترفعينها بزر، وميتا تعتمدها (دقايق إلى يوم). حالتها تتحدث لحالها.', (b) => arApproved(b) >= AR_TPL.length],
    ['meta', 'توثيق ميتا', 'أنتِ + ميتا (موازي)', 'في اتصال الربط يضيفك مسؤول في حساب ميتا للأعمال حقه، وبعدها ترفعين الطلب بسجله. ميتا تراجع من يومين إلى 14 يوم، والبوت يشتغل قبله.', (b) => (S.ch[b.id] || {}).meta_verification === 'verified'],
    ['payment', 'الدفع الإلكتروني (ميسر)', 'أنتِ + ميسر (موازي)', 'لباقة الدفع: تفتحين حسابه بأوراقه، وبعد التفعيل تلصقين المفتاحين في إعدادات لوحته.', (b) => b.plan !== 'bot_pay' || (S.set[b.id] || {}).pay_provider === 'moyasar'],
    ['live', 'تشغيل حقيقي', 'أنتِ + العميل', 'وضع الفحص مطفي، الرد الآلي شغّال، تنبيهات المالك شغّالة، وأول طلب حقيقي من جوال أحدهم.', (b, st) => { const ch = S.ch[b.id] || {}; return ch.status === 'connected' && !ch.dry_run && b.bot_enabled && st.orders_total > 0; }],
    ['handover', 'التسليم', 'أنتِ', 'ترسلين رابط لوحته وروابط موظفينه، تستلمين الدفعة الثانية، وتغيّرين الحالة إلى «شغّالة».', (b) => b.status === 'live'],
  ];
  function stepState(b) {
    const st = S.stats[b.id] || {};
    return STEPS.map(([k, t, who, d, auto]) => {
      const row = S.steps.find((x) => x.business_id === b.id && x.step === k);
      const a = !!auto(b, st), m = !!(row && row.done_at);
      return { k, t, who, d, auto: a, manual: m, done: a || m };
    });
  }
  const progress = (b) => stepState(b).filter((x) => x.done).length;

  // ───── الهيكل ─────
  function shell() {
    const nav = TABS.map(([k, t, ic]) => `<a href="#${k}" data-tab="${k}">${icon(ic)}<span>${t}</span>${k === 'leads' ? '<span class="cnt g" id="cntLeads" hidden></span>' : ''}</a>`).join('');
    const bn = ['home', 'biz', 'pros', 'leads', 'more'];
    $('root').innerHTML = `<div class="app">
      <aside class="side"><div class="brand"><span class="lg"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z"/><path d="M10.5 15.2l3.6 3.6 7.4-7.6" fill="none" stroke="#6D28D9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><b>المناوب</b><small>لوحتي</small></div></div><nav class="nav">${nav}</nav>
        <div class="foot"><button class="btn ghost sm" id="sndBtn" type="button"></button></div></aside>
      <div class="main"><header class="top"><div class="grow"><h1 id="tTitle"></h1><div class="sub" id="tSub"></div></div><span class="live" id="live"><i></i><span>مباشر</span></span><button class="ib" id="sndIb" type="button" aria-label="الصوت"></button></header><main class="content" id="view"></main></div>
      <nav class="bnav">${bn.map((k) => k === 'more' ? `<a href="#more" data-tab="more">${icon('menu')}<span>المزيد</span></a>` : (() => { const t = TABS.find((x) => x[0] === k); return `<a href="#${k}" data-tab="${k}">${icon(t[2])}<span>${k === 'pros' ? 'المحتملين' : t[1]}</span></a>`; })()).join('')}</nav></div>`;
    document.querySelectorAll('[data-tab]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.tab); }));
    $('sndBtn').onclick = $('sndIb').onclick = () => { I.toggleAlerts(); paintSnd(); };
    paintSnd(); paintCounts();
  }
  function paintSnd() { const on = I.alertsState(); $('sndBtn').innerHTML = `${icon(on ? 'bell' : 'belloff')}${on ? 'صوت التنبيه شغّال' : 'صوت التنبيه موقف'}`; $('sndIb').innerHTML = icon(on ? 'bell' : 'belloff'); $('sndIb').classList.toggle('on', on); }
  function paintCounts() { const n = S.leads.filter((l) => l.status === 'new').length; const el = $('cntLeads'); if (el) { el.hidden = !n; el.textContent = n; } }
  function go(tab) {
    if (tab === 'deal') { location.href = 'deal.html'; return; }
    if (tab === 'more') { const m = I.modal(`<div class="mh"><h3 class="grow">المزيد</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb">${['new', 'testi', 'subs', 'onboard', 'deal'].map((k) => { const t = TABS.find((x) => x[0] === k); return `<a class="btn ghost block" href="#${k}" data-go="${k}" style="justify-content:flex-start">${icon(t[2])}${t[1]}</a>`; }).join('')}</div>`); m.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); }); return; }
    I.closeAll(); S.tab = tab; history.replaceState(null, '', '#' + tab);
    document.querySelectorAll('[data-tab]').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
    $('tTitle').textContent = (TABS.find((x) => x[0] === tab) || [])[1] || '';
    $('tSub').textContent = '';
    render(); window.scrollTo(0, 0);
  }
  function render() { ({ home: vHome, biz: vBiz, new: vNew, leads: vLeads, pros: vPros, testi: vTesti, subs: vSubs, onboard: vOnboard }[S.tab] || vHome)($('view')); }
  const simUrl = (b) => `sim.html?b=${b.slug}&k=${b.sim_key}`;
  const logo = (b) => b.logo_url ? `<span class="lg"><img src="${esc(b.logo_url)}" alt=""></span>` : `<span class="lg">${esc(I.initials(b.name))}</span>`;
  const mrr = (b) => { const s = S.subs[b.id] || {}; return Number(s.monthly_fee || 0) + Number(s.app_monthly_fee || 0); };
  const daysTo = (d) => d ? Math.round((new Date(d + 'T00:00:00+03:00') - new Date(I.today() + 'T00:00:00+03:00')) / 86400000) : null;

  // ═════ الرئيسية ═════
  function vHome(v) {
    const live = S.biz.filter((b) => b.status === 'live' && !b.is_demo), setup = S.biz.filter((b) => b.status === 'setup' && !b.is_demo);
    const monthly = live.reduce((a, b) => a + mrr(b), 0);
    const orders = Object.values(S.stats).reduce((a, s) => a + (s.orders_month || 0), 0);
    const renew = S.biz.filter((b) => { const d = daysTo((S.subs[b.id] || {}).next_renewal); return d !== null && d >= 0 && d <= 14; });
    const newLeads = S.leads.filter((l) => l.status === 'new');
    const demo = S.biz.find((b) => b.slug === 'mahalak');
    v.innerHTML = `

    $('bPlan').onchange = async (e) => { await upd({ plan: e.target.value }); try { const fees = await q1(sb.rpc('ihj_plan_fees', { p_plan: e.target.value, p_app: b.wants_app })); await q1(sb.from('subscriptions').update({ plan: e.target.value, ...fees }).eq('business_id', b.id).select('business_id')); Object.assign(S.subs[b.id], { plan: e.target.value }, fees); } catch (x) { I.fail(x); } };
    $('bApp').onchange = async (e) => { await upd({ wants_app: e.target.checked }); try { const fees = await q1(sb.rpc('ihj_plan_fees', { p_plan: b.plan, p_app: e.target.checked })); await q1(sb.from('subscriptions').update({ app_setup_fee: fees.app_setup_fee, app_monthly_fee: fees.app_monthly_fee }).eq('business_id', b.id).select('business_id')); Object.assign(S.subs[b.id], { app_setup_fee: fees.app_setup_fee, app_monthly_fee: fees.app_monthly_fee }); } catch (x) { I.fail(x); } };
    if ($('bReset')) $('bReset').onclick = async (e) => { if (!confirm('مسح كل طلبات ومحادثات المحاكي لهذه المنشأة؟')) return; e.target.disabled = true; try { await I.api('admin/demo/reset', { business_id: b.id }); I.toast('انمسحت التجارب ✓'); await refreshStats(); } catch (x) { I.fail(x); } e.target.disabled = false; };
  }

  function dSteps(el, b) { renderSteps(el, b); }

  // ───── خطوات المنشأة بروابطها (في «دليل التشغيل» وفي درج المنشأة) ─────
  // «أرسل له» يفتح واتساب العميل والرسالة جاهزة، والإرسال نفسه منك
  const ownerLinks = {};
  const intlPhone = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1); else if (/^5\d{8}$/.test(d)) d = '966' + d; return d.length >= 9 ? d : ''; };
  function stepMsgs(b) {
    const s = S.subs[b.id] || {}, first = String(b.owner_name || '').trim().split(/\s+/)[0];
    const setup = Number(s.setup_fee || 0) + Number(s.app_setup_fee || 0), half = Math.round(setup / 2);
    const p = S.cfg.pay || {}, iban = String(p.iban || '').replace(/\s+/g, '');
    const hi = first ? 'هلا ' + first : 'هلا', pay = iban ? `\n${[p.bank, p.holder].filter(Boolean).join(' · ')}\nالآيبان: ${iban}` : '';
    const agree = PUBLIC + 'agree.html?k=' + b.client_key, start = PUBLIC + 'start.html?k=' + b.client_key, sim = PUBLIC + simUrl(b), owner = ownerLinks[b.id] || '';
    return {
      contract: { url: agree, msg: `${hi}، هذا رابط الدفعة الأولى من المناوب (${money(half)} ريال، نص التأسيس). تعلّم فيه على الموافقة وتطلع لك بيانات التحويل:\n${agree}` },
      docs: { url: start, msg: `عشان نجهّز الرد الآلي باسمكم، عبّ هذا النموذج (5 دقايق):\n${start}` },
      test: { url: sim, msg: `جهّزنا الرد الآلي باسمكم 🎉 جرّبه كأنك عميل، وقل لي لو تبي تغيّر أي رد أو سعر:\n${sim}` },
      live: b.wa_number ? { url: 'https://wa.me/' + intlPhone(b.wa_number), msg: `ربطنا رقمكم ✅ جرّب الحين من جوال ثاني: أرسل «السلام عليكم» لرقمكم واحجز موعد تجريبي، وقل لي إذا وصلك الطلب.` } : null,

      connect: S.meta && S.meta.ready ? { url: PUBLIC + 'connect.html?k=' + b.client_key, msg: `باقي نربط رقمكم، وهي دقيقتين: افتح الرابط واضغط «اربط واتسابك»، وادخل بحسابك في فيسبوك، واختر رقم الواتساب وأكّد من جوالك. رقمك يبقى على تطبيق واتساب للأعمال عادي.\n${PUBLIC}connect.html?k=${b.client_key}` }
        : { url: PUBLIC + 'help.html#connect', msg: `باقي نربط رقمكم، وهذي أسهل خطوة: أتصل عليك 15 دقيقة، أنت بس تفتح حسابك في فيسبوك، وتأكّد رقم الواتساب من جوالك، وتضيفني مسؤول في حساب أعمالك عشان أكمّل التوثيق عنك. والباقي كله أسويه أنا.\nمتى يناسبك؟` },
      meta: { url: PUBLIC + 'help.html#meta', msg: `أرفع لكم طلب توثيق النشاط عند ميتا وأتابعه لين يعتمد. أحتاج منك بس صورة السجل التجاري، والاسم القانوني مثل ما هو في السجل 🙏` },
      payment: b.plan === 'bot_pay' ? { url: PUBLIC + 'help.html#moyasar', msg: `عشان الدفع الإلكتروني، أفتح لكم حساب في بوابة الدفع (ميسر) باسم المنشأة وأتابع تفعيله وأربطه. أحتاج منك: السجل التجاري، هوية المالك، وآيبان باسم المنشأة.` } : null,
      handover: owner ? { url: owner, msg: `كل شي جاهز 🎉 هذي لوحتكم، افتحوها مرة وحدة من الجوال والكمبيوتر:\n${owner}\nومن «الموظفون» ترسلون لكل موظف رابطه. الشرح: ${PUBLIC}help.html#dashboard\n\nوالدفعة الثانية: ${money(setup - half)} ريال، والاشتراك الشهري يبدأ من اليوم.${pay}` } : null,
    };
  }
  function renderSteps(el, b) {
    const refresh = () => { const nb = S.biz.find((x) => x.id === b.id) || b; if (S.tab === 'onboard' && el.closest('#view')) render(); else renderSteps(el, nb); };
    if (ownerLinks[b.id] === undefined) {
      ownerLinks[b.id] = '';
      I.api('admin/link/list', { business_id: b.id }).then((r) => { const o = (r.links || []).find((x) => x.kind === 'owner' && !x.revoked_at && x.url); if (o) { ownerLinks[b.id] = o.url; if (el.isConnected) renderSteps(el, b); } }).catch(() => { /* */ });
    }
    const ss = stepState(b), M = stepMsgs(b), d = docsOf(b), st = S.stats[b.id] || {}, ch = S.ch[b.id] || {}, s = S.subs[b.id] || {};
    const phone = intlPhone(b.owner_phone || b.wa_number);
    const setup = Number(s.setup_fee || 0) + Number(s.app_setup_fee || 0), paid = paidSetup(b);
    const ok = (t) => `<span class="badge b-ok plain">${t}</span>`, wait = (t) => `<span class="badge plain">${t}</span>`;
    const approved = arApproved(b), set = S.set[b.id] || {}, intake = d.intake || {};
    const tick = (on, t, href) => `<a class="chk ${on ? 'on' : ''}" href="${href}" target="_blank" rel="noopener">${on ? '✓' : '○'} ${t}</a>`;
    const bz = (tab) => `biz.html?b=${b.id}#${tab}`;
    const MO = { yes: 'عنده حساب ميسر', no: 'يبينا نفتح له ميسر', later: 'ميسر بعدين' };
    const extra = {
      contract: (d.agreed_at ? ok(`وافق ${esc(d.agreed_name || '')} ${esc(I.ago(d.agreed_at))}`) : wait('ما فتح الرابط ووافق بعد')) + (paid > 0 ? ok(`استلمت ${money(paid)} من ${money(setup)}`) : (d.paid_claim_at ? `<span class="badge b-gold plain">قال إنه حوّل ${esc(I.ago(d.paid_claim_at))}، تأكدي من حسابك</span>` : '') + `<button class="btn sm${d.paid_claim_at ? '' : ' ghost'}" type="button" data-act="pay">${icon('plus')}سجّل الدفعة الأولى</button>`) + (S.cfg.pay && S.cfg.pay.iban ? '' : `<span class="badge b-warn plain">حطي بيانات التحويل من الرئيسية عشان تطلع له</span>`),
      build: `<div class="chks">${tick(st.services > 0, `الخدمات والأسعار (${st.services || 0})`, bz('catalog'))}${tick(st.hours > 0, 'الأوقات والعطل', bz('hours'))}${tick(placeOf(b) === 'online' || st.cities > 0, placeOf(b) === 'shop' ? `الفروع (${st.cities || 0})` : placeOf(b) === 'online' ? 'أونلاين' : `المدن (${st.cities || 0})`, bz('catalog'))}${tick((set.faq || []).length > 0, `الأسئلة والأجوبة (${(set.faq || []).length})`, bz('texts'))}${tick(!!(set.menu && set.menu.main && set.menu.main.length), 'الأزرار الأولى', bz('texts'))}${tick(true, 'الأسلوب: ' + ({ friendly: 'ودّي', formal: 'رسمي', short: 'مختصر' }[set.tone] || 'ودّي'), bz('settings'))}${tick(st.staff > 0, `الموظفون (${st.staff || 0})`, bz('staff'))}${tick(true, 'الدفع: ' + ({ after: 'بعد الخدمة', before: 'قبل الحجز', none: 'في المحل' }[set.pay_timing] || 'بعد الخدمة'), bz('settings'))}</div><a class="btn sm" href="biz.html?b=${b.id}" target="_blank" rel="noopener">${icon('store')}افتح لوحة المنشأة</a>`,
      docs: (intake.notes || intake.has_moyasar ? `<div class="hint" style="width:100%">${intake.has_moyasar ? '<b>' + MO[intake.has_moyasar] + '</b>' : ''}${intake.notes ? (intake.has_moyasar ? ' · ' : '') + 'ملاحظته: ' + esc(intake.notes) : ''}</div>` : '') + (d.intake_at ? `${d.intake_applied_at ? ok('انطبقت بياناته') : '<span class="badge b-gold plain">عبّى النموذج</span>'}<button class="btn sm${d.intake_applied_at ? ' ghost' : ''}" type="button" data-act="apply">${icon('check')}${d.intake_applied_at ? 'طبّقها مرة ثانية' : 'طبّق بياناته'}</button>` : wait('ما عبّى النموذج بعد')) + `<button class="btn sm${d.intake_at ? ' ghost' : ''}" type="button" data-act="import">${icon('file')}عبّيها من صورة أو موقع</button>`,
      test: `${st.sim_orders ? ok(`${st.sim_orders} حجز تجريبي`) : wait('ما جرّب بعد')}<a class="btn sm ghost" href="biz.html?b=${b.id}" target="_blank" rel="noopener">${icon('edit')}عدّل الردود والأسعار</a>`,
      connect: `${ch.status === 'connected' ? ok('المفتاح شغّال') : ch.status === 'error' ? '<span class="badge b-bad plain">خطأ بالربط</span>' : wait('الرقم غير مربوط')}${st.last_real_in ? ok('آخر رسالة حقيقية ' + esc(I.ago(st.last_real_in))) : wait('ما وصلت رسالة حقيقية بعد')}${ch.dry_run ? '<span class="badge b-gold plain">وضع الفحص</span>' : ''}<button class="btn sm ghost" type="button" data-act="connect">${icon('wa')}ربط الرقم</button>`,
      meta: `${ch.meta_verification === 'verified' ? ok('موثّق') : wait({ pending: 'قيد المراجعة', rejected: 'مرفوض' }[ch.meta_verification] || 'ما بدأ')}<button class="btn sm ghost" type="button" data-act="templates">${icon('edit')}حدّث الحالة</button>`,
      templates: `${approved >= AR_TPL.length ? ok('كلها معتمدة') : wait(`${approved} من ${AR_TPL.length} معتمدة`)}<button class="btn sm ghost" type="button" data-act="templates">${icon('send')}القوالب</button>`,
      payment: b.plan !== 'bot_pay' ? wait('باقته بدون دفع إلكتروني') : (S.set[b.id] || {}).pay_provider === 'moyasar' ? ok('ميسر مربوط') : wait('ميسر غير مربوط'),
      live: `<div class="chks">${tick(ch.status === 'connected', 'الرقم مربوط', '#')}${tick(!ch.dry_run, 'وضع الفحص مطفي', '#')}${tick(!!b.bot_enabled, 'الرد الآلي شغّال', bz('settings'))}${tick(!!set.notify_owner, 'تنبيهات المالك', bz('settings'))}${tick(st.orders_total > 0, 'أول طلب حقيقي', bz('orders'))}</div>${st.failed_week ? `<span class="badge b-bad plain">${st.failed_week} رسالة ما وصلت هالأسبوع</span>` : ''}`,
      handover: `${M.handover ? '' : `<button class="btn sm" type="button" data-act="owner">${icon('plus')}أنشئ رابط لوحته</button>`}${b.status === 'live' ? ok('شغّالة') : `<button class="btn sm ghost" type="button" data-act="live">${icon('check')}صارت شغّالة</button>`}`,
    };
    const send = (x) => x ? `<div class="copybox"><code>${esc(x.url)}</code><button class="btn sm ghost" type="button" data-cp="${esc(x.url)}">${icon('copy')}نسخ</button>${phone ? `<a class="btn sm" href="https://wa.me/${phone}?text=${encodeURIComponent(x.msg)}" target="_blank" rel="noopener">${icon('wa')}أرسل له</a>` : ''}</div>` : '';
    const done = ss.filter((x) => x.done).length;
    el.innerHTML = `<div class="stack">
      <div class="row"><b>${done} من ${STEPS.length}</b><span class="prog" style="width:160px"><i style="width:${done / STEPS.length * 100}%"></i></span></div>
      ${phone ? '' : `<label class="f" style="max-width:260px"><span>جوال العميل للإرسال بالواتساب</span><input id="stPhone" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx"></label>`}
      <div class="osteps">${ss.map((x) => `<div class="ost ${x.done ? 'done' : ''}"><div class="t"><b>${x.t}</b><span class="who">${x.who}</span>${x.auto ? '' : `<label class="mk"><input type="checkbox" data-step="${x.k}" ${x.manual ? 'checked' : ''}>تمت</label>`}</div>
        <p>${x.d}</p>${send(M[x.k])}<div class="st">${extra[x.k]}</div></div>`).join('')}</div></div>`;
    el.querySelectorAll('[data-cp]').forEach((x) => x.onclick = () => I.copy(x.dataset.cp));
    el.querySelectorAll('.chk[href="#"]').forEach((x) => x.onclick = (e) => { e.preventDefault(); openBiz(b.id, 'connect'); });
    const ph = el.querySelector('#stPhone');
    if (ph) ph.onchange = async () => { const p = intlPhone(ph.value); if (!p) return I.toast('اكتب جوال صحيح', true); try { await q1(sb.from('businesses').update({ owner_phone: p }).eq('id', b.id).select('id')); b.owner_phone = p; I.toast('انحفظ ✓'); refresh(); } catch (e) { I.fail(e); } };
    el.querySelectorAll('[data-step]').forEach((cb) => cb.onchange = async () => {
      const row = { business_id: b.id, step: cb.dataset.step, done_at: cb.checked ? new Date().toISOString() : null };
      try {
        await q1(sb.from('setup_steps').upsert(row, { onConflict: 'business_id,step' }).select('step'));
        const i = S.steps.findIndex((x) => x.business_id === b.id && x.step === row.step);
        if (i >= 0) S.steps[i] = row; else S.steps.push(row);
        refresh();
      } catch (e) { I.fail(e); cb.checked = !cb.checked; }
    });
    el.querySelectorAll('[data-act]').forEach((x) => x.onclick = async () => {
      const a = x.dataset.act;
      if (a === 'pay') return payModal(b, refresh, { kind: 'setup', amount: Math.round(setup / 2) });
      if (a === 'connect' || a === 'templates') return openBiz(b.id, a);
      if (a === 'import') return importFor(b, refresh);
      x.disabled = true;
      try {
        if (a === 'apply') {
          if (d.intake_applied_at && !confirm('تطبيق بياناته مرة ثانية؟ الخدمات والمدن والأوقات ترجع مثل النموذج')) { x.disabled = false; return; }
          await q1(sb.rpc('ihj_apply_intake', { p_business: b.id })); await loadAll(); I.toast('انطبقت بياناته ✓');
        } else if (a === 'owner') {
          const r = await I.api('admin/link/create', { kind: 'owner', business_id: b.id, label: b.owner_name || 'المالك' }); ownerLinks[b.id] = r.url; I.toast('انشأ رابط لوحته ✓');
        } else if (a === 'live') {
          if (!confirm('تغيير حالة المنشأة إلى «شغّالة»؟')) { x.disabled = false; return; }
          await q1(sb.from('businesses').update({ status: 'live' }).eq('id', b.id).select('id')); b.status = 'live'; I.toast('صارت شغّالة ✓');
        }
        refresh();
      } catch (e) { I.fail(e); x.disabled = false; }
    });
  }

  // صورة قائمة أسعاره أو موقعه ← تراجعينها ← تنضاف لبياناته وتنطبق على منشأته (نفس «طبّق بياناته»)
  async function importFor(b, refresh) {
    const r = await I.reader({ send: (p) => I.api('biz/extract', { business_id: b.id, ...p }), adminHint: 'admin.html?ai=1#home', intro: 'صورة قائمة أسعاره أو المنيو، أو رابط موقعه، أو الأسعار اللي أرسلها كرسالة. نقرأها، تراجعينها، وتنطبق على منشأته.' });
    if (!r) return;
    const place = (S.set[b.id] || {}).place_mode || r.data.place_mode || 'visit';
    const [svcs, hrs] = await Promise.all([
      q1(sb.from('services').select('name, active').eq('business_id', b.id)),
      q1(sb.from('hours').select('weekday, open_time, close_time').eq('business_id', b.id).is('city_id', null)),
    ]).catch(() => [[], []]);
    const current = { services: svcs.filter((s) => s.active), hours: hrs.map((h) => ({ weekday: h.weekday, open: String(h.open_time).slice(0, 5), close: String(h.close_time).slice(0, 5) })) };
    await I.review(r.data, {
      current, place, applyLabel: 'طبّقها على منشأته',
      note: current.services.length ? 'خدماته الحالية اللي مو في القائمة تتوقف (ما تنحذف)، وتقدرين ترجعينها من لوحة المنشأة.' : '',
      apply: async (sel) => {
        const data = { services: sel.services, faq: sel.faq, name: sel.name, name_en: sel.name_en, activity: sel.activity, place_mode: sel.place_mode, notes: sel.notes };
        if (sel.hours) data.hours = sel.hours;
        const cities = place === 'visit' ? sel.cities : place === 'shop' ? sel.branches.filter((x) => x.maps).map((x) => ({ name: x.name, maps: x.maps })) : [];
        if (cities.length) data.cities = cities;
        const m = await I.api('admin/intake/merge', { business_id: b.id, data });
        if (m.bad_locations && m.bad_locations.length) throw new Error(`ما قدرنا نقرأ موقع «${m.bad_locations.join('، ')}». صححيه من لوحة المنشأة`);
        await q1(sb.rpc('ihj_apply_intake', { p_business: b.id }));
        await loadAll(); refresh();
        return 'انطبقت على منشأته ✓ افتحي لوحة المنشأة وراجعيها';
      },
    });
  }

  function payModal(b, after, pre) {
    const s = S.subs[b.id] || {}; pre = pre || {};
    const K = [['monthly', 'شهري'], ['setup', 'تأسيس'], ['app', 'تطبيق'], ['other', 'أخرى']];
    const m = I.modal(`<div class="mh"><h3 class="grow">دفعة من ${esc(b.name)}</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb">
      <div class="g2"><label class="f"><span>النوع</span><select id="pK">${K.map(([k, l]) => `<option value="${k}" ${(pre.kind || 'monthly') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label><label class="f"><span>المبلغ</span><input id="pA" type="number" min="1" value="${pre.amount != null ? pre.amount : (s.monthly_fee || '')}"></label>

      <label class="f"><span>ملاحظة</span><input id="pN" maxlength="120"></label><label class="check"><input type="checkbox" id="pR" checked>حدّث تاريخ التجديد القادم لنهاية الفترة</label></div>
      <div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="pGo">${icon('check')}سجّل</button></div>`);
    $('pK').onchange = (e) => { const k = e.target.value; $('pA').value = k === 'monthly' ? (s.monthly_fee || '') : k === 'setup' ? (s.setup_fee || '') : k === 'app' ? (s.app_setup_fee || '') : ''; };
    m.querySelector('#pGo').onclick = async (e) => {
      const amount = Number($('pA').value); if (!(amount > 0)) return I.toast('اكتب المبلغ', true);
      e.target.disabled = true;
      try {
        const kind = $('pK').value, covers = kind === 'monthly' ? ($('pC').value || null) : null;

        const patch = {};

        if (!s.started_on && kind !== 'other') patch.started_on = $('pD').value || I.today();
        if (Object.keys(patch).length) { await q1(sb.from('subscriptions').update(patch).eq('business_id', b.id).select('business_id')); Object.assign(S.subs[b.id], patch); }
        I.closeAll(); I.toast('انسجلت الدفعة ✓'); after && after();
      } catch (x) { I.fail(x); e.target.disabled = false; }
    };

          <div class="row"><button class="btn" type="button" id="nSteps">${icon('guide')}خطواته وروابطه</button><a class="btn ghost" href="${simAbs}" target="_blank" rel="noopener">${icon('wa')}افتح المحاكي</a><a class="btn ghost" href="biz.html?b=${r.business.id}" target="_blank" rel="noopener">${icon('store')}لوحة المنشأة</a><label class="btn ghost">${icon('plus')}ارفع الشعار<input type="file" id="nLogo" accept="image/*" hidden></label><button class="btn ghost" type="button" id="nMore">${icon('plus')}منشأة ثانية</button></div></div>`;
        $('nRes').querySelectorAll('[data-cp]').forEach((x) => x.onclick = () => I.copy(x.dataset.cp));
        $('nSteps').onclick = () => { S.obBiz = r.business.id; ownerLinks[r.business.id] = r.owner_url; go('onboard'); };
        $('nMore').onclick = () => vNew(v);

  function uploadLogo(bizId, file) {
    if (!file) return;
    const img = new Image();
    img.onload = async () => { const s = Math.min(1, 512 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s) || 256; c.height = Math.round(img.height * s) || 256; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); try { const r = await I.api('biz/logo', { business_id: bizId, data_url: c.toDataURL('image/png') }); const b = S.biz.find((x) => x.id === bizId); if (b) b.logo_url = r.logo_url; I.toast('انرفع الشعار ✓'); } catch (e) { I.fail(e); } };
    img.src = URL.createObjectURL(file);
  }

  // ═════ طلبات الاشتراك ═════
  function leadRow(l) {

  }
  function vLeads(v) {

    const match = (l, k) => k === 'all' ? true : k === 'open' ? !['live', 'lost'].includes(l.status) : l.status === k;
    let list = S.leads.filter((l) => match(l, S.leadFilter));

    v.innerHTML = `<div class="row">${F.map(([k, l]) => `<button class="chip ${S.leadFilter === k ? 'on' : ''}" data-f="${k}" type="button">${l}<span class="n">${S.leads.filter((x) => match(x, k)).length}</span></button>`).join('')}<span class="sp"></span><input id="lS" placeholder="بحث" value="${esc(S.leadSearch)}" style="max-width:220px"></div>
      <div class="list">${list.map(leadRow).join('') || `<div class="empty">${icon('bell')}<b>ما فيه طلبات هنا</b><span class="tiny">طلبات الاشتراك من الموقع توصل هنا لحظيًا بصوت</span></div>`}</div>`;

      <div class="card flat stack s"><div class="row"><span class="avatar">${esc(I.initials(l.contact_name || l.business_name))}</span><div class="grow"><b>${esc(l.contact_name || 'بدون اسم')}</b><div class="tiny ltr" style="text-align:right">${esc(I.phone(l.phone))}</div></div><a class="btn sm" href="https://wa.me/${esc(l.phone)}?text=${waMsg}" target="_blank" rel="noopener">${icon('wa')}واتساب</a><button class="btn sm ghost" id="lCp">${icon('copy')}نسخ</button></div>
        <div class="g2 small"><div><span class="tiny">النشاط</span><div>${esc(l.activity || 'غير محدد')}</div></div><div><span class="tiny">المدينة</span><div>${esc(l.city || 'غير محدد')}</div></div><div><span class="tiny">الطلبات يوميًا</span><div>${esc(l.orders_per_day || 'غير محدد')}</div></div><div><span class="tiny">وصل</span><div>${esc(I.ago(l.created_at))}</div></div></div>

  // ═════ العملاء المحتملين: أنشطة من البحث، ترسلين لكل واحد رسالة مجاله وتتابعين حالته ═════
  const PST = [['new', 'جديد', 'b-gold'], ['sent', 'أرسلت', 'b-confirmed'], ['replied', 'ردّ', 'b-arrived'], ['hot', 'مهتم', 'b-ok'], ['no', 'ما يبي', 'b-cancelled']];
  const PF = { q: '', seg: '', city: '', s: '', wa: false, sort: 'fit', shown: 60, view: 'list' };
  const enDigits = (s) => String(s || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const waOf = (p) => { const m = /(?:\+?966|00966|0)?(5\d{8})/.exec(enDigits(p).replace(/[\s\-()]/g, '')); return m ? '966' + m[1] : ''; };
  const pLink = (v, kind) => { v = String(v || '').trim(); if (!v) return ''; if (/^https?:\/\//i.test(v)) return v; const h = v.replace(/^@/, ''); return { ig: 'https://www.instagram.com/' + h, tt: 'https://www.tiktok.com/@' + h, sc: 'https://www.snapchat.com/add/' + h, web: 'https://' + h }[kind] || ''; };
  const pMsg = (l, field) => { const m = S.pmsgs[l.seg_key] || S.pmsgs.general; return m ? String(m[field] || '').split('{اسم_النشاط}').join(l.name).split('{رابط_التجربة}').join(m.demo || '') : ''; };
  async function loadPros() {
    const all = [];
    for (let from = 0; ; from += 1000) { const rows = await q1(sb.from('prospects').select('*').order('id').range(from, from + 999)); all.push(...rows); if (rows.length < 1000) break; }
    const msgs = await q1(sb.from('prospect_msgs').select('*').order('sort'));
    S.pmsgs = Object.fromEntries(msgs.map((m) => [m.key, m])); S.pros = all;
  }
  function vPros(v) {

      <div class="tbl"><table class="t"><thead><tr><th>المنشأة</th><th>الباقة</th><th>الشهري</th><th>البداية</th><th>التجديد القادم</th><th>آخر دفعة</th><th></th></tr></thead><tbody>
      ${rows.map((b) => { const s = S.subs[b.id] || {}; const last = S.pays.find((p) => p.business_id === b.id); const d = daysTo(s.next_renewal);
        return `<tr><td><b>${esc(b.name)}</b><div class="tiny">${(BSTATUS[b.status] || [''])[0]}</div></td><td class="small">${PLAN[b.plan]}${b.wants_app ? ' + تطبيق' : ''}</td><td class="num">${money(mrr(b))}</td><td class="small">${s.started_on ? esc(I.dayName(s.started_on)) : '<span class="tiny">لم يبدأ</span>'}</td><td class="small">${s.next_renewal ? `${esc(I.dayName(s.next_renewal))}${d !== null && d >= 0 && d <= 7 ? ` <span class="badge b-gold plain">بعد ${d} ${d === 1 ? 'يوم' : 'أيام'}</span>` : ''}` : '<span class="tiny">غير محدد</span>'}</td><td class="small">${last ? `${money(last.amount)} · ${esc(I.dayName(last.paid_on))}` : '<span class="tiny">ما فيه</span>'}</td><td><div class="row nw"><button class="btn sm ghost" data-pay="${b.id}">${icon('plus')}دفعة</button><button class="btn sm ghost" data-plink="${b.id}">${icon('link')}رابط دفع</button></div></td></tr>`; }).join('') || '<tr><td colspan="7" class="tiny">ما فيه منشآت</td></tr>'}
      </tbody></table></div>
      <div class="card stack s" id="mysCard"><div class="row"><h3 class="grow">الدفع بالبطاقة للاشتراكات (ميسر)</h3><span class="badge" id="mysSt">نتأكد…</span></div>
        <p class="tiny">من لوحة ميسر ← الإعدادات ← مفاتيح API: انسخي المفتاح السري (يبدأ بـ sk_) والعام (يبدأ بـ pk_) والصقيهم هنا. ابدئي بمفاتيح التجربة (test) وجرّبي، وبعدين الحقيقية (live). المفتاح ينحفظ في الخادم وما يطلع لأحد.</p>
        <form class="row" id="mysForm" autocomplete="off" style="align-items:flex-end"><label class="f" style="flex:2;min-width:200px"><span>المفتاح السري</span><input name="sk" type="password" class="ltr" autocomplete="new-password" placeholder="sk_test_..."></label><label class="f" style="flex:2;min-width:200px"><span>المفتاح العام (اختياري)</span><input name="pk" class="ltr" autocomplete="off" placeholder="pk_test_..."></label><button class="btn" type="submit">${icon('check')}احفظ</button><button class="btn ghost bad" type="button" id="mysClear">احذف</button></form><div id="mysList"></div></div>
      <div class="card stack s" id="promoCard"><div class="row"><h3 class="grow">أكواد الخصم</h3><span class="tiny">اللي يكتب الكود في الموقع أو صفحة الدفعة الأولى، يصير اشتراكه بسعر الكود</span></div><div id="promoList"><div class="tiny">نحمّل…</div></div>
        <form class="row" id="promoAdd" style="align-items:flex-end"><label class="f" style="flex:1;min-width:140px"><span>الكود</span><input name="code" class="ltr" maxlength="24" required placeholder="99" style="text-transform:uppercase"></label><label class="f" style="width:110px"><span>الشهري</span><input name="monthly" type="number" min="0" value="99" required></label><label class="f" style="width:110px"><span>التأسيس</span><input name="setup" type="number" min="0" value="0" required></label><label class="f" style="width:110px"><span>كم مرة</span><input name="max" type="number" min="1" placeholder="بلا حد"></label><label class="f" style="flex:1;min-width:140px"><span>ملاحظة</span><input name="label" maxlength="80" placeholder="لمين الكود؟"></label><button class="btn" type="submit">${icon('plus')}أضف</button></form></div>`;
    v.querySelectorAll('[data-pay]').forEach((x) => x.onclick = () => payModal(S.biz.find((b) => b.id === x.dataset.pay), () => render()));
    paintPromos(); paintMys();
    v.querySelectorAll('[data-plink]').forEach((x) => x.onclick = () => payLinkModal(S.biz.find((b) => b.id === x.dataset.plink)));
    $('mysForm').onsubmit = async (e) => {
      e.preventDefault(); const f = new FormData(e.target), sk = String(f.get('sk') || '').trim(), pk = String(f.get('pk') || '').trim();
      if (!sk) return I.toast('الصقي المفتاح السري', true);
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      try { const r = await I.api('admin/platform-moyasar', { sk, pk }); e.target.reset(); paintMys(r); I.toast(r.test_mode ? 'انحفظ ✓ (مفاتيح تجربة)' : 'انحفظ ✓'); }
      catch (x) { I.toast({ sk: 'المفتاح السري لازم يبدأ بـ sk_live_ أو sk_test_', pk: 'المفتاح العام لازم يبدأ بـ pk_live_ أو pk_test_', sk_rejected: 'ميسر رفض المفتاح، تأكدي إنك نسختيه كامل' }[x.code] || 'ما انحفظ، جرّبي مرة ثانية', true); }
      btn.disabled = false;
    };
    $('mysClear').onclick = async () => { if (!confirm('حذف مفاتيح ميسر؟ الدفع بالبطاقة يوقف لين تحطينها من جديد')) return; try { paintMys(await I.api('admin/platform-moyasar', { clear: true })); I.toast('انحذفت المفاتيح'); } catch (x) { I.fail(x); } };
    $('promoAdd').onsubmit = async (e) => {
      e.preventDefault(); const f = new FormData(e.target);
      const code = String(f.get('code') || '').trim().toUpperCase();
      if (!/^[A-Z0-9]{2,24}$/.test(code)) return I.toast('الكود حروف إنجليزية وأرقام بس (2 إلى 24)', true);
      try { await q1(sb.from('promo_codes').insert({ code, monthly_fee: Number(f.get('monthly')) || 0, setup_fee: Number(f.get('setup')) || 0, max_uses: Number(f.get('max')) || null, label: String(f.get('label') || '').trim() }).select('code')); I.toast('انضاف الكود ✓'); e.target.reset(); paintPromos(); }
      catch (x) { I.fail(x); }
    };
  }
  async function paintMys(r) {
    const el = $('mysSt'); if (!el) return;
    try { r = r || await I.api('admin/platform-moyasar', {}); } catch (e) { el.textContent = 'ما قدرنا نتأكد'; return; }
    S.mys = r;
    el.className = 'badge ' + (r.moyasar ? (r.test_mode ? 'b-warn' : 'b-ok') : 'b-cancelled');
    el.textContent = r.moyasar ? (r.test_mode ? 'مربوط · تجربة ' + r.moyasar : 'مربوط · حقيقي ' + r.moyasar) : 'غير مربوط';
    paintSubLinks();
  }
  const SUBK = { setup: 'التأسيس', monthly: 'الشهري', app: 'التطبيق', other: 'دفعة' };
  async function paintSubLinks() {
    const box = $('mysList'); if (!box) return;
    let rows = [];
    try { rows = await q1(sb.from('sub_invoices').select('id,business_id,kind,amount,status,test,created_at,paid_at,method').order('created_at', { ascending: false }).limit(8)); } catch (e) { return; }
    if (!rows.length) { box.innerHTML = ''; return; }
    const st = (x) => x.status === 'paid' ? (x.test ? ['انْدفع · تجربة', 'b-warn'] : ['انْدفع ✓', 'b-ok']) : x.status === 'issued' ? ['مفتوح', 'b-confirmed'] : ['ملغي', 'b-cancelled'];
    box.innerHTML = `<div class="tiny" style="margin:4px 0">آخر روابط البطاقة${rows.some((x) => x.test) ? ' (التجربة ما تنسجل دفعة)' : ''}</div><div class="tbl"><table class="t"><thead><tr><th>المنشأة</th><th>عن وش</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${rows.map((x) => { const b = S.biz.find((y) => y.id === x.business_id); const [l, c] = st(x);
      return `<tr><td>${esc(b ? b.name : '')}</td><td class="small">${SUBK[x.kind] || ''}</td><td class="num">${money(x.amount)}</td><td><span class="badge ${c}">${l}</span>${x.method ? ` <span class="tiny">${esc(x.method)}</span>` : ''}</td><td class="small">${esc(I.dayName(String(x.paid_at || x.created_at).slice(0, 10)))}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  function payLinkModal(b) {
    if (!b) return;
    if (S.mys && !S.mys.moyasar) return I.toast('اربطي ميسر أول من بطاقة «الدفع بالبطاقة»', true);
    const sub = S.subs[b.id] || {};
    const K = [['monthly', 'الاشتراك الشهري'], ['setup', 'التأسيس'], ['app', 'التطبيق'], ['other', 'دفعة ثانية']];
    const setupAll = Number(sub.setup_fee || 0) + Number(sub.app_setup_fee || 0), half = Math.round(setupAll / 2);
    const setupPaid = S.pays.filter((p) => p.business_id === b.id && (p.kind === 'setup' || p.kind === 'app')).reduce((a, p) => a + Number(p.amount || 0), 0);
    const def = (k) => k === 'monthly' ? Number(sub.monthly_fee || 0) + Number(sub.app_monthly_fee || 0) : k === 'setup' ? (setupPaid < half ? half - setupPaid : Math.max(0, setupAll - setupPaid)) || '' : k === 'app' ? Number(sub.app_setup_fee || 0) || '' : '';
    const m = I.modal(`<div class="mh"><h3 class="grow">رابط دفع · ${esc(b.name)}</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb">
      <div class="g2"><label class="f"><span>عن وش؟</span><select id="lkK">${K.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label><label class="f"><span>المبلغ</span><input id="lkA" type="number" min="1" value="${def('monthly')}"></label></div>
      <div id="lkOut"></div></div>
      <div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="lkGo">${icon('link')}سوّ الرابط</button></div>`);
    $('lkK').onchange = (e) => { $('lkA').value = def(e.target.value); };
    m.querySelector('#lkGo').onclick = async (e) => {
      const amount = Number($('lkA').value); if (!(amount >= 1)) return I.toast('اكتبي المبلغ', true);
      e.target.disabled = true;
      try {
        const r = await I.api('admin/sub-pay-link', { business_id: b.id, kind: $('lkK').value, amount });
        const msg = `هلا ${b.owner_name || ''}، هذا رابط دفع ${K.find((x) => x[0] === $('lkK').value)[1]} للمناوب (${amount} ريال): ${r.url}`;
        $('lkOut').innerHTML = `<div class="copybox"><code class="ltr">${esc(r.url)}</code><button class="btn sm" type="button" id="lkCp">${icon('copy')}نسخ</button></div>${r.test ? '<div class="hint">رابط تجربة: ادفعي ببطاقة تجربة ميسر، وما تنخصم فلوس حقيقية</div>' : ''}${b.owner_phone ? `<a class="btn ghost block" target="_blank" rel="noopener" href="https://wa.me/${esc(b.owner_phone)}?text=${encodeURIComponent(msg)}">${icon('wa')}أرسليه له بالواتساب</a>` : '<div class="tiny">ما فيه جوال للمالك، انسخي الرابط وأرسليه</div>'}`;
        $('lkCp').onclick = () => I.copy(r.url, 'انسخ الرابط ✓');
      } catch (x) { I.toast(x.code === 'no_card' ? 'اربطي ميسر أول' : 'ما قدرنا نسوي الرابط', true); }
      e.target.disabled = false;
    };
  }
  async function paintPromos() {
    const box = $('promoList'); if (!box) return;
    let rows = [];
    try { rows = await q1(sb.from('promo_codes').select('*').order('created_at', { ascending: false })); } catch (e) { box.innerHTML = '<div class="tiny">ما قدرنا نحمّل الأكواد</div>'; return; }
    box.innerHTML = rows.length ? `<div class="tbl"><table class="t"><thead><tr><th>الكود</th><th>الشهري</th><th>التأسيس</th><th>الاستخدام</th><th>لمين</th><th>شغّال</th><th></th></tr></thead><tbody>${rows.map((c) => `<tr><td><b class="ltr">${esc(c.code)}</b></td><td class="num">${money(c.monthly_fee)}</td><td class="num">${money(c.setup_fee)}</td><td class="small">${c.uses}${c.max_uses ? ' من ' + c.max_uses : ''}</td><td class="small">${esc(c.label || '')}</td><td><label class="sw"><input type="checkbox" data-pa="${esc(c.code)}" ${c.active ? 'checked' : ''}><i></i></label></td><td><button class="btn sm ghost" type="button" data-pl="${esc(c.code)}">${icon('copy')}رابط</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="tiny">ما فيه أكواد بعد</div>';
    box.querySelectorAll('[data-pa]').forEach((x) => x.onchange = async () => { try { await q1(sb.from('promo_codes').update({ active: x.checked }).eq('code', x.dataset.pa).select('code')); I.toast(x.checked ? 'الكود شغّال ✓' : 'الكود موقف'); } catch (e) { I.fail(e); x.checked = !x.checked; } });
    box.querySelectorAll('[data-pl]').forEach((x) => x.onclick = () => I.copy(PUBLIC + '?code=' + encodeURIComponent(x.dataset.pl) + '#signup', 'انسخ رابط الكود ✓ أرسله'));
  }

  // ═════ دليل التشغيل: خطوات كل منشأة بروابطها ═════
  function vOnboard(v) {
    const real = S.biz.filter((b) => !b.is_demo), demos = S.biz.filter((b) => b.is_demo), all = [...real, ...demos];
    if (!all.length) {
      v.innerHTML = `<div class="empty">${icon('guide')}<b>ما فيه منشآت بعد</b><a class="btn" href="#new" data-go="new">${icon('plus')}منشأة جديدة</a></div>`;
      v.querySelector('[data-go]').onclick = (e) => { e.preventDefault(); go('new'); };
      return;
    }
    const b = all.find((x) => x.id === S.obBiz) || real.find((x) => x.status === 'setup') || real[0] || all.find((x) => x.slug === 'mahalak') || all[0];
    S.obBiz = b.id;
    const opt = (x) => `<option value="${x.id}" ${x.id === b.id ? 'selected' : ''}>${esc(x.name)} · ${progress(x)}/${STEPS.length}</option>`;
    v.innerHTML = `<div class="ob">
      <div class="obh"><select id="obSel" aria-label="المنشأة">${real.length ? `<optgroup label="المنشآت">${real.map(opt).join('')}</optgroup>` : ''}${demos.length ? `<optgroup label="تجريبية">${demos.map(opt).join('')}</optgroup>` : ''}</select>
        <button class="btn sm ghost" type="button" id="obOpen">${icon('store')}المنشأة</button><a class="btn sm ghost" href="deal.html?b=${b.id}">${icon('guide')}سير العمل</a></div>
      <div id="obSteps"></div></div>`;
    $('obSel').onchange = (e) => { S.obBiz = e.target.value; render(); };
    $('obOpen').onclick = () => openBiz(b.id);
    renderSteps($('obSteps'), b);
  }

  // ═════ البث المباشر ═════
  async function refreshStats() { try { const st = await q1(sb.rpc('ihj_admin_stats')); S.stats = Object.fromEntries(st.map((x) => [x.business_id, x])); } catch (e) { /* */ } }
  sb.channel('admin').on('postgres_changes', { event: '*', schema: 'public', table: 'signup_requests' }, (p) => {
    if (p.eventType === 'INSERT' && p.new && !S.seenLeads.has(p.new.id)) { S.seenLeads.add(p.new.id); S.leads.unshift(p.new); I.alertNew('طلب اشتراك جديد', `${p.new.business_name}${p.new.city ? ' · ' + p.new.city : ''}`); }
    else if (p.eventType === 'UPDATE' && p.new) { const i = S.leads.findIndex((x) => x.id === p.new.id); if (i >= 0) { if (p.new.paid_claim_at && !S.leads[i].paid_claim_at && !p.new.business_id) I.alertNew('قال إنه حوّل الدفعة الأولى 💸', p.new.business_name); else if (p.new.agreed_at && !S.leads[i].agreed_at && !p.new.business_id) I.alertNew('وافق على الاتفاقية ✍️', p.new.business_name); S.leads[i] = p.new; } }
    else if (p.eventType === 'DELETE' && p.old) S.leads = S.leads.filter((x) => x.id !== p.old.id);
    paintCounts(); if (S.tab === 'leads' || S.tab === 'home') render();
  }).on('postgres_changes', { event: '*', schema: 'public', table: 'client_docs' }, (p) => {
    const n = p.new; if (!n || !n.business_id) return;
    const old = S.docs[n.business_id] || {};
    S.docs[n.business_id] = { ...old, ...n };
    const b = S.biz.find((x) => x.id === n.business_id);
    if (b && n.paid_claim_at && !old.paid_claim_at) I.alertNew('العميل يقول إنه حوّل الدفعة الأولى 💸', b.name);
    else if (b && n.agreed_at && !old.agreed_at) I.alertNew('وافق على الاتفاقية ✍️', b.name);
    else if (b && n.intake_at && n.intake_at !== old.intake_at) I.alertNew('عبّى نموذج البيانات 📋', b.name);
    if (S.tab === 'onboard' || S.tab === 'home') render();
  }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sub_payments' }, async (p) => {
    const n = p.new; if (!n || !n.sub_invoice_id || S.pays.some((x) => x.id === n.id)) return;
    S.pays.unshift(n);
    const b = S.biz.find((x) => x.id === n.business_id);
    I.alertNew('دفعة بالبطاقة وصلت 💳', `${b ? b.name : ''} · ${money(n.amount)} ريال`);
    try { const r = await q1(sb.from('subscriptions').select('*').eq('business_id', n.business_id)); if (r[0]) S.subs[n.business_id] = r[0]; } catch (e) { /* */ }
    if (S.tab === 'subs' || S.tab === 'home') render();
  }).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'channels' }, (p) => {
    const n = p.new; if (!n || !n.business_id) return;
    const old = S.ch[n.business_id] || {};
    S.ch[n.business_id] = { ...old, ...n };
    const b = S.biz.find((x) => x.id === n.business_id);
    if (b && n.onboarded_via === 'es' && n.connected_at && n.connected_at !== old.connected_at) I.alertNew('انربط رقم واتساب ✅', `${b.name}${n.display_phone ? ' · ' + n.display_phone : ''}`);
    else if (b && n.status === 'error' && old.status === 'connected') I.alertNew('انفصل ربط واتساب ⚠️', b.name);
  }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'data_requests' }, (p) => {
    const n = p.new; if (!n || S.dreq.some((x) => x.id === n.id)) return;
    S.dreq.unshift(n); I.alertNew(n.kind === 'delete' ? 'طلب حذف بيانات' : 'سؤال عن الخصوصية', n.name || '');
    if (S.tab === 'home') paintDreq();
  }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => { refreshStats(); })
    .subscribe((st) => { const el = $('live'); if (el) el.classList.toggle('on', st === 'SUBSCRIBED'); });

  loadMeta();
  shell();
  const h0 = location.hash.slice(1).split('/');
  if (h0[0] === 'onboard' && h0[1]) S.obBiz = h0[1];
  go(TABS.some((t) => t[0] === h0[0] && t[0] !== 'deal') ? h0[0] : 'home');
  window.__admin = { S, go, openBiz };
})();
</script>
</body>
</html>
