<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B7A55">
<title>احجزلي · لوحتي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%230B7A55'/%3E%3Cpath d='M10.5 15.2l3.6 3.6 7.4-7.6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* لوحتي (مدير احجزلي): المنشآت، منشأة جديدة، طلبات الاشتراك، الاشتراكات، دليل التشغيل، دليل البيع */
.biz-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.biz-row .lg{width:46px;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;overflow:hidden}
.biz-row .lg img{width:100%;height:100%;object-fit:cover;background:#fff}
.prog{height:7px;border-radius:9px;background:var(--soft2);overflow:hidden;width:120px}
.prog i{display:block;height:100%;background:var(--accent)}
.steps10{display:grid;gap:8px;counter-reset:s}
.st10{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;counter-increment:s}
.st10::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft2);color:var(--muted);font-family:var(--display);font-weight:800;font-size:13px}
.st10.done::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
.st10 b{display:block;font-size:14.5px} .st10 span{font-size:12.5px;color:var(--muted)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.tpl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.form-sec{display:grid;gap:12px}
.form-sec h3{display:flex;gap:8px;align-items:center}
.form-sec h3 i{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:13px}
.rowline{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;align-items:center}
.staffline{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:start}
.citychips{display:flex;flex-wrap:wrap;gap:6px}
.citychips label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13.5px;cursor:pointer;background:var(--card)}
.citychips label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}
.citychips input{display:none}
.result{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--card))}
/* دليل البيع والتشغيل */
.guide{display:grid;gap:14px;max-width:880px;counter-reset:g}
.guide h2{font-size:23px} .guide .intro{color:var(--muted);font-size:15px;margin:0}
.gpath{display:flex;flex-wrap:wrap;gap:6px;font-size:13px} .gpath span{background:var(--soft);border-radius:999px;padding:4px 10px;font-weight:600}
.gs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:9px;counter-increment:g;box-shadow:var(--shadow)}
.gs h3{display:flex;align-items:center;gap:10px;font-size:17px}
.gs h3::before{content:counter(g);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none;font-family:var(--display)}
.gs p{margin:0;font-size:14.5px} .gs .m{color:var(--muted)}
.gs ul,.gs ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14.5px}
.tagz{display:flex;gap:6px;flex-wrap:wrap} .tg{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--fg);font-weight:600} .tg.you{background:var(--gold);color:var(--gold-ink)} .tg.cl{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)} .tg.sys{background:color-mix(in srgb,var(--info) 15%,var(--card));color:var(--info)}
.scr{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px 10px 60px;font-size:14px;white-space:pre-wrap;position:relative;line-height:1.7}
.scr b{display:block;margin-bottom:4px;color:var(--muted);font-size:12.5px}
.scr button{position:absolute;top:8px;left:8px;font-size:12px;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.req{display:grid;gap:8px} .req div{display:grid;gap:2px;font-size:14.5px;border-bottom:1px dashed var(--line);padding-bottom:6px} .req b{font-family:var(--display)} .req span{color:var(--muted);font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px} .two>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px} .two b{display:block;font-family:var(--display);margin-bottom:4px}
.gs .go{justify-self:start}
@media (max-width:620px){ .two{grid-template-columns:1fr} .rowline{grid-template-columns:1fr 100px 36px} .staffline{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="root"></div>
<template id="tplSales"><!--SALES_GUIDE--></template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon, money } = I;
  I.loading('نفتح لوحتك…');
  let session = null, me = null;
  try { const r = await I.boot('ihj-admin'); session = r.session; me = r.me; } catch (e) { return I.gate('الرابط غير صالح', 'الرابط ما عاد يشتغل، اطلب رابطًا جديدًا', 'err'); }
  if (!session || !me) return I.gate('افتح رابط لوحتك', 'اللوحة تنفتح من الرابط الخاص فقط، ومرة وحدة تكفي لكل جهاز', 'err');
  if (!me.admin) return I.gate('هذا مو رابط المدير', 'افتح رابط لوحتك الخاص', 'err');
  const sb = I.sb;
  async function q1(p) { const { data, error } = await p; if (error) throw error; return data; }

  const S = { tab: 'home', biz: [], set: {}, ch: {}, subs: {}, pays: [], steps: [], stats: {}, leads: [], leadFilter: 'open', leadSearch: '', seenLeads: new Set(), prefill: null };
  const TABS = [['home', 'الرئيسية', 'home'], ['biz', 'المنشآت', 'store'], ['new', 'منشأة جديدة', 'plus'], ['leads', 'طلبات الاشتراك', 'bell'], ['subs', 'الاشتراكات', 'money'], ['onboard', 'دليل التشغيل', 'guide'], ['sales', 'دليل البيع', 'sale']];
  const PLAN = { bot: 'أتمتة الحجز', bot_pay: 'أتمتة الحجز + الدفع' };
  const BSTATUS = { setup: ['قيد التجهيز', 'b-warn'], live: ['شغّالة', 'b-ok'], paused: ['موقفة', 'b-cancelled'], ended: ['منتهية', 'b-cancelled'] };
  const LSTATUS = { new: ['جديد', 'b-gold'], contacted: ['تواصلنا', 'b-confirmed'], agreed: ['اتفقنا', 'b-arrived'], setup: ['قيد التجهيز', 'b-warn'], live: ['شغّال', 'b-ok'], lost: ['ما تم', 'b-cancelled'] };

  async function loadAll() {
    const [biz, set, ch, subs, pays, steps, stats, leads] = await Promise.all([
      q1(sb.from('businesses').select('*').order('created_at', { ascending: false })),
      q1(sb.from('settings').select('business_id,pay_provider,vat_percent,capacity_mode')),
      q1(sb.from('channels').select('*')),
      q1(sb.from('subscriptions').select('*')),
      q1(sb.from('sub_payments').select('*').order('paid_on', { ascending: false })),
      q1(sb.from('setup_steps').select('*')),
      q1(sb.rpc('ihj_admin_stats')),
      q1(sb.from('signup_requests').select('*').order('created_at', { ascending: false }).limit(500)),
    ]);
    S.biz = biz; S.set = Object.fromEntries(set.map((x) => [x.business_id, x])); S.ch = Object.fromEntries(ch.map((x) => [x.business_id, x]));
    S.subs = Object.fromEntries(subs.map((x) => [x.business_id, x])); S.pays = pays; S.steps = steps; S.stats = Object.fromEntries(stats.map((x) => [x.business_id, x])); S.leads = leads;
    leads.forEach((l) => S.seenLeads.add(l.id));
  }
  try { await loadAll(); } catch (e) { console.error(e); return I.gate('ما قدرنا نفتح اللوحة', 'حدّث الصفحة', 'err'); }

  // ───── قائمة التجهيز العشرية لكل منشأة ─────
  const STEPS = [
    ['contract', 'التوقيع والدفعة الأولى', 'اتفاقية من صفحة، والنص الأول من التأسيس', null],
    ['docs', 'المتطلبات من العميل', 'السجل التجاري، الشعار، الخدمات والأوقات والمدن', (b, st) => !!b.logo_url && st.services > 0],
    ['setup', 'إعداد المنشأة', 'الخدمات والمدن والأوقات والموظفون', (b, st) => st.services > 0 && st.cities > 0 && st.hours > 0 && (st.staff > 0 || (S.set[b.id] || {}).capacity_mode === 'fixed')],
    ['test', 'تجربة كاملة في المحاكي', 'حجز من المحاكي يوصل اللوحة بالصوت', (b, st) => st.sim_orders > 0],
    ['number', 'رقم واتساب للنشاط', 'شريحة مخصصة أو رقمه الحالي (Coexistence)', null],
    ['connect', 'ربط الرقم بمزوّد الربط', 'معرّف الرقم والمفتاح والويبهوك', (b) => (S.ch[b.id] || {}).status === 'connected'],
    ['meta', 'توثيق النشاط عند ميتا', 'من مركز الأمان في حساب ميتا للأعمال', (b) => (S.ch[b.id] || {}).meta_verification === 'verified'],
    ['templates', 'اعتماد القوالب', 'التذكير والفاتورة ووصلنا دفعك', (b) => ((S.ch[b.id] || {}).templates || []).filter((t) => t.status === 'APPROVED').length >= 8],
    ['payment', 'بوابة الدفع (ميسر)', 'لباقة الحجز والدفع فقط', (b) => b.plan !== 'bot_pay' || (S.set[b.id] || {}).pay_provider === 'moyasar'],
    ['handover', 'التسليم والتدريب', 'رابط المالك والموظفين، وتجربة من جوال حقيقي', (b) => b.status === 'live'],
  ];
  function stepState(b) {
    const st = S.stats[b.id] || {};
    return STEPS.map(([k, t, d, auto]) => {
      const row = S.steps.find((x) => x.business_id === b.id && x.step === k);
      const a = auto ? auto(b, st) : false;
      return { k, t, d, auto: !!auto, done: a || !!(row && row.done_at), manual: !!(row && row.done_at) };
    });
  }
  const progress = (b) => stepState(b).filter((x) => x.done).length;

  // ───── الهيكل ─────
  function shell() {
    const nav = TABS.map(([k, t, ic]) => `<a href="#${k}" data-tab="${k}">${icon(ic)}<span>${t}</span>${k === 'leads' ? '<span class="cnt g" id="cntLeads" hidden></span>' : ''}</a>`).join('');
    const bn = ['home', 'biz', 'new', 'leads', 'more'];
    $('root').innerHTML = `<div class="app">
      <aside class="side"><div class="brand"><span class="lg">${icon('check')}</span><div><b>احجزلي</b><small>لوحتي</small></div></div><nav class="nav">${nav}</nav>
        <div class="foot"><button class="btn ghost sm" id="sndBtn" type="button"></button></div></aside>
      <div class="main"><header class="top"><div class="grow"><h1 id="tTitle"></h1><div class="sub" id="tSub"></div></div><span class="live" id="live"><i></i><span>مباشر</span></span><button class="ib" id="sndIb" type="button" aria-label="الصوت"></button></header><main class="content" id="view"></main></div>
      <nav class="bnav">${bn.map((k) => k === 'more' ? `<a href="#more" data-tab="more">${icon('menu')}<span>المزيد</span></a>` : (() => { const t = TABS.find((x) => x[0] === k); return `<a href="#${k}" data-tab="${k}">${icon(t[2])}<span>${t[1]}</span></a>`; })()).join('')}</nav></div>`;
    document.querySelectorAll('[data-tab]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.tab); }));
    $('sndBtn').onclick = $('sndIb').onclick = () => { I.toggleAlerts(); paintSnd(); };
    paintSnd(); paintCounts();
  }
  function paintSnd() { const on = I.alertsState(); $('sndBtn').innerHTML = `${icon(on ? 'bell' : 'belloff')}${on ? 'صوت التنبيه شغّال' : 'صوت التنبيه موقف'}`; $('sndIb').innerHTML = icon(on ? 'bell' : 'belloff'); $('sndIb').classList.toggle('on', on); }
  function paintCounts() { const n = S.leads.filter((l) => l.status === 'new').length; const el = $('cntLeads'); if (el) { el.hidden = !n; el.textContent = n; } }
  function go(tab) {
    if (tab === 'more') { const m = I.modal(`<div class="mh"><h3 class="grow">المزيد</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb">${['subs', 'onboard', 'sales'].map((k) => { const t = TABS.find((x) => x[0] === k); return `<a class="btn ghost block" href="#${k}" data-go="${k}" style="justify-content:flex-start">${icon(t[2])}${t[1]}</a>`; }).join('')}</div>`); m.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); }); return; }
    I.closeAll(); S.tab = tab; history.replaceState(null, '', '#' + tab);
    document.querySelectorAll('[data-tab]').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
    $('tTitle').textContent = (TABS.find((x) => x[0] === tab) || [])[1] || '';
    $('tSub').textContent = '';
    render(); window.scrollTo(0, 0);
  }
  function render() { ({ home: vHome, biz: vBiz, new: vNew, leads: vLeads, subs: vSubs, onboard: vOnboard, sales: vSales }[S.tab] || vHome)($('view')); }
  const simUrl = (b) => `sim.html?b=${b.slug}&k=${b.sim_key}`;
  const logo = (b) => b.logo_url ? `<span class="lg"><img src="${esc(b.logo_url)}" alt=""></span>` : `<span class="lg">${esc(I.initials(b.name))}</span>`;
  const mrr = (b) => { const s = S.subs[b.id] || {}; return Number(s.monthly_fee || 0) + Number(s.app_monthly_fee || 0); };
  const daysTo = (d) => d ? Math.round((new Date(d + 'T00:00:00+03:00') - new Date(I.today() + 'T00:00:00+03:00')) / 86400000) : null;

  // ═════ الرئيسية ═════
  function vHome(v) {
    const live = S.biz.filter((b) => b.status === 'live' && !b.is_demo), setup = S.biz.filter((b) => b.status === 'setup' && !b.is_demo);
    const monthly = live.reduce((a, b) => a + mrr(b), 0);
    const orders = Object.values(S.stats).reduce((a, s) => a + (s.orders_month || 0), 0);
    const renew = S.biz.filter((b) => { const d = daysTo((S.subs[b.id] || {}).next_renewal); return d !== null && d >= 0 && d <= 14; });
    const newLeads = S.leads.filter((l) => l.status === 'new');
    const demo = S.biz.find((b) => b.slug === 'mahalak');
    v.innerHTML = `
      <div class="kpis"><div class="kpi accent"><b>${live.length}</b><span>منشآت شغّالة</span></div><div class="kpi"><b>${setup.length}</b><span>قيد التجهيز</span></div><div class="kpi"><b>${money(monthly)}</b><span>الاشتراكات الشهرية (ر.س)</span></div><div class="kpi"><b>${newLeads.length}</b><span>طلبات اشتراك جديدة</span></div></div>
      <div class="g2">
        <div class="card stack"><div class="sec-h"><h3>ابدأ من هنا</h3></div>
          <a class="btn lg block" href="#new" data-go="new">${icon('plus')}منشأة جديدة</a>
          ${demo ? `<a class="btn ghost block" href="${simUrl(demo)}" target="_blank" rel="noopener">${icon('wa')}محاكي «محلك» للعرض</a><a class="btn ghost block" href="biz.html?b=${demo.id}" target="_blank" rel="noopener">${icon('store')}لوحة «محلك»</a>` : ''}
        </div>
        <div class="card stack"><div class="sec-h"><h3>هذا الشهر</h3></div>
          <div class="row"><span class="grow">الطلبات عبر كل المنشآت</span><b>${orders}</b></div>
          <div class="row"><span class="grow">التجديدات خلال 14 يوم</span><b>${renew.length}</b></div>
          ${renew.map((b) => `<div class="row small"><span class="grow">${esc(b.name)}</span><span class="tiny">${esc(I.dayName((S.subs[b.id] || {}).next_renewal))}</span></div>`).join('')}
          <div class="row"><span class="grow">عملاء يحتاجون رد (كل المنشآت)</span><b>${Object.values(S.stats).reduce((a, s) => a + (s.open_handoffs || 0), 0)}</b></div>
        </div>
      </div>
      <div class="card stack"><div class="sec-h"><h3>المنشآت قيد التجهيز</h3></div>${setup.length ? setup.map((b) => `<div class="biz-row item click" data-b="${b.id}">${logo(b)}<div><b>${esc(b.name)}</b><div class="tiny">${PLAN[b.plan]} · ${progress(b)} من 10 خطوات</div></div><span class="prog"><i style="width:${progress(b) * 10}%"></i></span></div>`).join('') : '<div class="tiny">ما فيه منشآت قيد التجهيز</div>'}</div>
      <div class="card stack"><div class="sec-h"><h3>آخر طلبات الاشتراك</h3><a class="btn sm ghost" href="#leads" data-go="leads">الكل</a></div>${S.leads.slice(0, 5).map(leadRow).join('') || '<div class="tiny">ما فيه طلبات</div>'}</div>`;
    v.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); });
    v.querySelectorAll('[data-b]').forEach((el) => el.onclick = () => openBiz(el.dataset.b));
    v.querySelectorAll('[data-lead]').forEach((el) => el.onclick = () => openLead(el.dataset.lead));
  }

  // ═════ المنشآت ═════
  function vBiz(v) {
    v.innerHTML = `<div class="row"><a class="btn" href="#new" data-go="new">${icon('plus')}منشأة جديدة</a><span class="sp"></span><span class="tiny">${S.biz.length} منشأة</span></div>
      <div class="list">${S.biz.map((b) => { const ch = S.ch[b.id] || {}, st = S.stats[b.id] || {}, bs = BSTATUS[b.status]; const p = progress(b);
        return `<div class="item click" data-b="${b.id}"><div class="biz-row">${logo(b)}<div style="min-width:0"><div class="row"><b style="font-family:var(--display);font-size:16.5px">${esc(b.name)}</b><span class="badge ${bs[1]}">${bs[0]}</span>${b.is_demo ? '<span class="badge b-test plain">تجريبية</span>' : ''}</div>
          <div class="meta"><span>${PLAN[b.plan]}${b.wants_app ? ' + تطبيق' : ''}</span><span><span class="dot ${ch.status === 'connected' ? 'ok' : ch.status === 'error' ? 'bad' : ''}"></span>${ch.status === 'connected' ? 'الرقم مربوط' : ch.status === 'error' ? 'خطأ بالربط' : 'الرقم غير مربوط'}</span><span>${st.orders_month || 0} طلب هذا الشهر</span>${st.open_handoffs ? `<span style="color:var(--warn)">${st.open_handoffs} يحتاج رد</span>` : ''}</div></div>
          <div style="display:grid;gap:4px;justify-items:end"><span class="tiny">${p}/10</span><span class="prog"><i style="width:${p * 10}%"></i></span></div></div></div>`; }).join('') || `<div class="empty">${icon('store')}<b>ما فيه منشآت</b></div>`}</div>`;
    v.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); });
    v.querySelectorAll('[data-b]').forEach((el) => el.onclick = () => openBiz(el.dataset.b));
  }

  let dtab = 'overview';
  async function openBiz(id, tab) {
    const b = S.biz.find((x) => x.id === id); if (!b) return;
    dtab = tab || dtab || 'overview';
    const DT = [['overview', 'نظرة'], ['steps', 'التجهيز'], ['connect', 'ربط الرقم'], ['templates', 'القوالب والتوثيق'], ['links', 'الروابط'], ['sub', 'الاشتراك']];
    const d = I.openDrawer(`<div class="dh">${logo(b).replace('class="lg"', 'class="avatar" style="overflow:hidden"')}<h2 class="grow">${esc(b.name)}</h2><button class="ib" data-close aria-label="إغلاق">${icon('x')}</button></div>
      <div class="db"><div class="dtabs">${DT.map(([k, l]) => `<button class="chip ${dtab === k ? 'on' : ''}" data-dt="${k}" type="button">${l}</button>`).join('')}</div><div id="dBody"></div></div>`);

  function dSteps(el, b) {
    const ss = stepState(b);
    el.innerHTML = `<div class="stack"><div class="row"><b>${ss.filter((x) => x.done).length} من 10</b><span class="prog" style="width:160px"><i style="width:${ss.filter((x) => x.done).length * 10}%"></i></span><span class="sp"></span><a class="btn sm ghost" href="#onboard" data-go="onboard">${icon('guide')}دليل التشغيل</a></div>
      <div class="steps10">${ss.map((s) => `<div class="st10 ${s.done ? 'done' : ''}"><div><b>${s.t}</b><span>${s.d}${s.auto ? ' · يتعلّم تلقائيًا' : ''}</span></div>${s.auto ? (s.done ? '<span class="badge b-ok plain">تم</span>' : '<span class="tiny">ينتظر</span>') : `<label class="sw"><input type="checkbox" data-step="${s.k}" ${s.manual ? 'checked' : ''}><i></i></label>`}</div>`).join('')}</div></div>`;
    el.querySelector('[data-go]').onclick = (e) => { e.preventDefault(); go('onboard'); };
    el.querySelectorAll('[data-step]').forEach((cb) => cb.onchange = async () => {
      try {
        await q1(sb.from('setup_steps').upsert({ business_id: b.id, step: cb.dataset.step, done_at: cb.checked ? new Date().toISOString() : null }, { onConflict: 'business_id,step' }).select('step'));
        const i = S.steps.findIndex((x) => x.business_id === b.id && x.step === cb.dataset.step);
        const row = { business_id: b.id, step: cb.dataset.step, done_at: cb.checked ? new Date().toISOString() : null };
        if (i >= 0) S.steps[i] = row; else S.steps.push(row);
        dSteps(el, b);
      } catch (e) { I.fail(e); cb.checked = !cb.checked; }
    });
  }

  function uploadLogo(bizId, file) {

    img.src = URL.createObjectURL(file);
  }

    v.querySelectorAll('[data-pay]').forEach((x) => x.onclick = () => payModal(S.biz.find((b) => b.id === x.dataset.pay), () => render()));
  }

  // ═════ دليل البيع ═════
  function vSales(v) {
    v.innerHTML = document.getElementById('tplSales').innerHTML;
    v.querySelectorAll('.scr button').forEach((b) => b.onclick = () => { const t = b.parentElement.querySelector('.tx'); I.copy(t ? t.textContent : ''); });

  // ═════ البث المباشر ═════
  async function refreshStats() { try { const st = await q1(sb.rpc('ihj_admin_stats')); S.stats = Object.fromEntries(st.map((x) => [x.business_id, x])); } catch (e) { /* */ } }
  sb.channel('admin').on('postgres_changes', { event: '*', schema: 'public', table: 'signup_requests' }, (p) => {
    if (p.eventType === 'INSERT' && p.new && !S.seenLeads.has(p.new.id)) { S.seenLeads.add(p.new.id); S.leads.unshift(p.new); I.alertNew('طلب اشتراك جديد', `${p.new.business_name}${p.new.city ? ' · ' + p.new.city : ''}`); }
    else if (p.eventType === 'UPDATE' && p.new) { const i = S.leads.findIndex((x) => x.id === p.new.id); if (i >= 0) S.leads[i] = p.new; }
    else if (p.eventType === 'DELETE' && p.old) S.leads = S.leads.filter((x) => x.id !== p.old.id);
    paintCounts(); if (S.tab === 'leads' || S.tab === 'home') render();
  }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => { refreshStats(); })
    .subscribe((st) => { const el = $('live'); if (el) el.classList.toggle('on', st === 'SUBSCRIBED'); });

  shell();
  go(TABS.some((t) => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'home');
  window.__admin = { S, go, openBiz };
})();
