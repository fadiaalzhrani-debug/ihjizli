<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4338CA">
<title>طلباتي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%234338CA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* لوحة الموظف: الطلب، وصلت، الفاتورة (للجوال أولًا) */
body{max-width:560px;margin:0 auto}
.shead{position:sticky;top:0;z-index:10;background:var(--accent);color:var(--accent-ink);padding:14px 16px calc(14px);display:flex;gap:12px;align-items:center}
.shead .lg{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--display);font-weight:800;overflow:hidden;flex:none}
.shead .lg img{width:100%;height:100%;object-fit:cover;background:#fff}
.shead b{font-family:var(--display);font-size:18px;display:block;line-height:1.2} .shead small{opacity:.85}
.tabs{display:flex;gap:6px;padding:12px 16px 4px;position:sticky;top:72px;background:var(--bg);z-index:9}
.wrap{padding:8px 16px 40px;display:grid;gap:12px}
.job{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.job.new{animation:flashIn 2.4s ease-out}
.job .top2{display:flex;align-items:center;gap:8px}
.job .t{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.job .cust{display:flex;align-items:center;gap:10px}
.job .cust b{font-family:var(--display);font-size:16px}
.job .ln{display:flex;gap:8px;flex-wrap:wrap}
.job .ln a,.job .ln button{flex:1;min-width:120px}
.big{display:grid;gap:8px}
.big .btn{padding:15px;font-size:17px;border-radius:14px}
.step{display:flex;gap:4px;align-items:center}
.step i{height:5px;flex:1;border-radius:9px;background:var(--line)} .step i.on{background:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon, money, badge } = I;
  I.loading('نفتح طلباتك…');
  let session = null, me = null;
  try { const r = await I.boot('ihj-staff'); session = r.session; me = r.me; } catch (e) { return I.gate('الرابط غير صالح', 'اطلب رابطك الجديد من صاحب المحل', 'err'); }
  if (!session || !me) return I.gate('افتح رابطك', 'لوحة الموظف تنفتح من الرابط الخاص اللي وصلك', 'err');
  const mem = me.members.find((m) => m.role === 'staff');
  if (!mem) return I.gate('هذا مو رابط موظف', 'افتح الرابط الخاص بالموظف', 'err');
  const sb = I.sb, BIZ = mem.business_id, SID = mem.staff_id;
  const S = { biz: mem.business || {}, me: null, set: null, services: [], cities: [], orders: [], tab: 'today', seen: new Set(), fresh: new Set() };
  async function q1(p) { const { data, error } = await p; if (error) throw error; return data; }
  async function load() {
    const since = new Date(Date.now() - 30 * 86400000).toISOString();
    const [meRow, set, services, cities, orders] = await Promise.all([
      q1(sb.from('staff').select('*').eq('id', SID).single()),
      q1(sb.from('settings').select('vat_percent, pay_provider, place_mode').eq('business_id', BIZ).single()),
      q1(sb.from('services').select('id,name,price,place_mode').eq('business_id', BIZ)),
      q1(sb.from('cities').select('id,name').eq('business_id', BIZ)),
      q1(sb.from('orders').select('*, customer:customers(id,name,wa_id,is_sim)').eq('staff_id', SID).gte('slot_start', since).order('slot_start')),
    ]);
    Object.assign(S, { me: meRow, set, services, cities, orders });
    orders.forEach((o) => { if (o.status !== 'pending_payment') S.seen.add(o.id); });
  }
  try { await load(); } catch (e) { return I.gate('ما قدرنا نفتح الطلبات', 'حدّث الصفحة', 'err'); }
  I.setTitle(`طلباتي · ${S.biz.name || ''}`);
  const custName = (c) => c ? (c.name || (c.is_sim ? 'عميل المحاكي' : I.phone(c.wa_id))) : '';
  const cityName = (id) => (S.cities.find((c) => c.id === id) || {}).name || '';
  const svc = (id) => S.services.find((s) => s.id === id);
  const open = (o) => ['confirmed', 'on_the_way', 'arrived', 'invoiced'].includes(o.status);
  const modeOf = (o) => (svc(o.service_id) || {}).place_mode || S.set.place_mode || 'visit';

  function shell() {
    $('root').innerHTML = `<header class="shead">${I.logoHtml(S.biz)}<div class="grow"><b>${esc(S.me.name)}</b><small>${esc(S.biz.name || '')}</small></div><span class="live" id="live" style="color:inherit"><i></i></span><button class="ib" id="snd" type="button" style="background:rgba(255,255,255,.15);border:0;color:inherit" aria-label="الصوت"></button></header>
      <div class="tabs" id="tabs"></div><main class="wrap" id="list"></main>`;
    $('snd').onclick = () => { I.toggleAlerts(); paintSnd(); }; paintSnd();
  }
  function paintSnd() { $('snd').innerHTML = icon(I.alertsState() ? 'bell' : 'belloff'); }
  function render() {
    const t = I.today();
    const groups = { today: (o) => I.parts(o.slot_start).ymd === t && o.status !== 'cancelled' && o.status !== 'pending_payment', next: (o) => I.parts(o.slot_start).ymd > t && open(o), late: (o) => I.parts(o.slot_start).ymd < t && open(o), done: (o) => o.status === 'done' };
    const labels = { today: 'اليوم', next: 'القادمة', late: 'متأخرة', done: 'المكتملة' };
    $('tabs').innerHTML = Object.keys(groups).filter((k) => k !== 'late' || S.orders.some(groups.late)).map((k) => `<button class="chip ${S.tab === k ? 'on' : ''}" data-t="${k}" type="button">${labels[k]}<span class="n">${S.orders.filter(groups[k]).length}</span></button>`).join('');
    $('tabs').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; render(); });
    const list = S.orders.filter(groups[S.tab] || groups.today);
    if (S.tab === 'done') list.reverse();
    $('list').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${icon('orders')}<b>ما فيه طلبات هنا</b><span class="tiny">الطلبات الجديدة توصلك هنا بصوت</span></div>`;
    $('list').querySelectorAll('[data-a]').forEach((b) => b.onclick = () => act(b.dataset.o, b.dataset.a, b));
  }
  function card(o) {
    const c = o.customer || {}, sv = svc(o.service_id);
    const steps = ['confirmed', 'on_the_way', 'arrived', 'invoiced', 'done'];
    const at = Math.max(0, steps.indexOf(o.status));
    const maps = o.maps_url || (o.lat ? `https://maps.google.com/?q=${o.lat},${o.lng}` : '');
    const nav = o.lat ? `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}` : maps;
    const visit = modeOf(o) === 'visit';
    const finish = o.prepaid ? `<button class="btn lg block" data-a="done" data-o="${o.id}">${icon('check')}تم الطلب</button><button class="btn ghost block" data-a="invoice" data-o="${o.id}">${icon('file')}فاتورة إضافية</button>`
      : `<button class="btn lg block gold" data-a="invoice" data-o="${o.id}">${icon('file')}الفاتورة</button>${visit ? '' : `<button class="btn ghost block" data-a="done" data-o="${o.id}">${icon('check')}تم بدون فاتورة</button>`}`;
    let main = '';
    if (visit && o.status === 'confirmed') main = `<button class="btn lg block" data-a="on_the_way" data-o="${o.id}">${icon('car')}أنا في الطريق</button>`;
    else if (visit && o.status === 'on_the_way') main = `<button class="btn lg block" data-a="arrived" data-o="${o.id}">${icon('pin')}وصلت</button>`;
    else if (['confirmed', 'on_the_way', 'arrived'].includes(o.status)) main = finish;
    else if (o.status === 'invoiced') main = `<div class="hint">انرسلت الفاتورة للعميل${S.set.pay_provider !== 'none' ? ' مع رابط الدفع، وأول ما يدفع ينقفل الطلب لحاله' : ''}</div><div class="row"><button class="btn soft grow" data-a="cash" data-o="${o.id}">${icon('money')}استلمت نقدًا أو شبكة</button><button class="btn ghost" data-a="pdf" data-o="${o.id}">${icon('file')}الفاتورة</button></div>`;
    else if (o.status === 'done') main = `<div class="row"><span class="badge b-done">مكتمل ${o.paid_at ? '· مدفوع' : ''}</span><span class="sp"></span><button class="btn sm ghost" data-a="pdf" data-o="${o.id}">${icon('file')}الفاتورة</button></div>`;
    return `<article class="job ${S.fresh.has(o.id) ? 'new' : ''}">
      <div class="top2"><span class="t">${I.time(o.slot_start)}</span><span class="tiny">${esc(I.relDay(I.parts(o.slot_start).ymd))}</span><span class="sp"></span><b class="tiny">رقم ${o.number}</b>${badge(o.status)}</div>
      ${visit && o.status !== 'cancelled' && o.status !== 'done' ? `<div class="step">${steps.slice(0, 4).map((s, i) => `<i class="${i <= at ? 'on' : ''}"></i>`).join('')}</div>` : ''}
      <div class="cust"><span class="avatar">${esc(I.initials(custName(c)))}</span><div class="grow"><b>${esc(custName(c))}</b><div class="tiny">${modeOf(o) === 'online' ? 'أونلاين' : esc(cityName(o.city_id))}${sv ? ' · ' + esc(sv.name) : ''}${o.price != null ? ' · ' + money(o.price) + ' ر.س' : ''}${o.prepaid ? ' · مدفوع مقدمًا' : ''}</div></div></div>
      ${o.notes ? `<div class="hint">${esc(o.notes)}</div>` : ''}
      <div class="ln">${nav && visit ? `<a class="btn ghost" href="${esc(nav)}" target="_blank" rel="noopener">${icon('pin')}الموقع</a>` : ''}${c.is_sim ? '' : `<a class="btn ghost" href="tel:+${esc(c.wa_id)}">${icon('phone')}اتصال</a><a class="btn ghost" href="${I.waLink(c.wa_id)}" target="_blank" rel="noopener">${icon('wa')}واتساب</a>`}</div>
      ${o.status === 'cancelled' ? '' : `<div class="big">${main}</div>`}
    </article>`;
  }
  async function refresh(id) {
    const o = (await q1(sb.from('orders').select('*, customer:customers(id,name,wa_id,is_sim)').eq('id', id).limit(1)))[0];
    const i = S.orders.findIndex((x) => x.id === id);
    if (!o) { if (i >= 0) S.orders.splice(i, 1); return; }
    if (i >= 0) S.orders[i] = o; else { S.orders.push(o); S.orders.sort((a, b) => new Date(a.slot_start) - new Date(b.slot_start)); }
  }
  async function act(id, a, btn) {
    const o = S.orders.find((x) => x.id === id);
    if (a === 'invoice') return invoice(o);
    if (a === 'cash') return cash(o);
    if (a === 'pdf') { try { const r = await I.api('order/pdf', { order_id: id }); window.open(r.url, '_blank', 'noopener'); } catch (e) { I.fail(e); } return; }
    btn.disabled = true;
    try { await I.api('order/' + a, { order_id: id }); I.toast(a === 'on_the_way' ? 'انرسل للعميل إنك في الطريق ✓' : a === 'done' ? 'اكتمل الطلب ✓' : 'تم ✓'); await refresh(id); render(); }
    catch (e) { I.fail(e); btn.disabled = false; }
  }
  function invoice(o) {
    const sv = svc(o.service_id);
    const items = [{ name: sv ? sv.name : 'الخدمة', qty: 1, price: o.price != null ? o.price : (sv && sv.price != null ? sv.price : '') }];
    const vp = Number(S.set.vat_percent || 0);
    const m = I.modal(`<div class="mh"><h3 class="grow">فاتورة الطلب رقم ${o.number}</h3><button class="ib" data-close>${icon('x')}</button></div>
      <div class="mb"><div class="stack s" id="its"></div><button class="btn sm ghost" id="add" type="button" style="justify-self:start">${icon('plus')}بند</button>
      <div class="card flat row"><span class="grow">الإجمالي${vp ? ` شامل الضريبة` : ''}</span><b id="tot" style="font-family:var(--display);font-size:22px"></b></div></div>
      <div class="mf"><button class="btn lg block" id="send">${icon('send')}أرسل الفاتورة للعميل</button></div>`);
    const paint = () => {
      $('its').innerHTML = items.map((it, i) => `<div class="card flat stack s"><input data-i="${i}" data-k="name" value="${esc(it.name)}" placeholder="البند" maxlength="60"><div class="row nw"><label class="f grow"><span>الكمية</span><input data-i="${i}" data-k="qty" type="number" min="1" value="${it.qty}" inputmode="numeric"></label><label class="f grow"><span>السعر</span><input data-i="${i}" data-k="price" type="number" min="0" step="0.01" value="${it.price}" inputmode="decimal"></label>${items.length > 1 ? `<button class="ib" data-del="${i}" type="button" style="align-self:end">${icon('trash')}</button>` : ''}</div></div>`).join('');
      $('its').querySelectorAll('input').forEach((x) => x.oninput = () => { items[+x.dataset.i][x.dataset.k] = x.value; tot(); });
      $('its').querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { items.splice(+b.dataset.del, 1); paint(); });
      tot();
    };
    const tot = () => { const s = items.reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.price) || 0), 0); $('tot').textContent = money(Math.round((s + s * vp / 100) * 100) / 100) + ' ر.س'; };
    $('add').onclick = () => { items.push({ name: '', qty: 1, price: '' }); paint(); };
    paint();
    $('send').onclick = async (e) => {
      const clean = items.map((it) => ({ name: String(it.name).trim(), qty: Number(it.qty), price: Number(it.price) })).filter((it) => it.name);
      if (!clean.length || clean.some((it) => !(it.qty >= 1) || !(it.price >= 0))) return I.toast('اكتب البنود والأسعار', true);
      e.target.disabled = true;
      try { const r = await I.api('order/invoice', { order_id: o.id, items: clean }); I.closeAll(); I.toast(r.pay_link ? 'انرسلت الفاتورة ورابط الدفع ✓' : 'انرسلت الفاتورة ✓'); await refresh(o.id); render(); }
      catch (x) { I.fail(x); e.target.disabled = false; }
    };
  }
  function cash(o) {
    const m = I.modal(`<div class="mh"><h3 class="grow">استلام الدفع · الطلب رقم ${o.number}</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb"><div class="seg" id="pm"><button class="on" data-m="cash">نقدًا</button><button data-m="card">شبكة</button><button data-m="transfer">تحويل</button></div></div><div class="mf"><button class="btn lg block" id="ok">${icon('check')}تأكيد الاستلام</button></div>`);
    let method = 'cash';
    m.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { method = b.dataset.m; m.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); });
    $('ok').onclick = async (e) => { e.target.disabled = true; try { await I.api('order/cash', { order_id: o.id, method }); I.closeAll(); I.toast('انقفل الطلب ✓'); await refresh(o.id); render(); } catch (x) { I.fail(x); e.target.disabled = false; } };
  }
  shell(); render();
  sb.channel('staff-' + SID).on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `staff_id=eq.${SID}` }, async (p) => {
    const id = p.new && p.new.id; if (!id) return;
    const prev = (S.orders.find((x) => x.id === id) || {}).status;
    const isNew = !S.seen.has(id) || (prev === 'pending_payment' && p.new.status === 'confirmed');
    if (p.new.status === 'pending_payment') { await refresh(id).catch(() => {}); return render(); }
    S.seen.add(id);
    await refresh(id).catch(() => {});
    if (isNew) { const o = S.orders.find((x) => x.id === id); if (o) { S.fresh.add(id); setTimeout(() => S.fresh.delete(id), 4000); I.alertNew(`طلب جديد رقم ${o.number}`, I.when(o.slot_start)); } }
    render();
  }).subscribe((st) => { const el = $('live'); if (el) el.classList.toggle('on', st === 'SUBSCRIBED'); });
  setInterval(async () => { if (document.visibilityState !== 'visible') return; try { await load(); render(); } catch (e) { /* */ } }, 90000);
  window.__staff = { S, render };
})();
</script>
</body>
</html>
