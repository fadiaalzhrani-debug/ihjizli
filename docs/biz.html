<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4338CA">
<title>لوحة المنشأة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%234338CA'/%3E%3Cpath d='M10.5 15.2l3.6 3.6 7.4-7.6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
.asadmin{background:var(--gold);color:var(--gold-ink);padding:7px 16px;font-size:13.5px;font-weight:700;display:flex;gap:10px;align-items:center}
.asadmin a{color:inherit}
.ord .acts{display:flex;gap:6px;flex-wrap:wrap}
.ord .who{display:flex;gap:10px;align-items:center;min-width:0}
.ord .who b{font-family:var(--display);font-size:15.5px}
.ord .when{font-family:var(--display);font-weight:800;font-size:15px}
.ord.cancelled{opacity:.62}
.slotgrid{display:flex;flex-wrap:wrap;gap:6px}
.slotgrid button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font-size:13.5px;cursor:pointer}
.slotgrid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.conv{display:grid;gap:6px;background:var(--soft2);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:52vh;overflow:auto}
.conv .m{max-width:82%;padding:7px 11px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.conv .m.c{background:var(--card);align-self:flex-start;justify-self:start;border:1px solid var(--line)}
.conv .m.b{background:var(--soft);justify-self:end}
.conv .m.o{background:color-mix(in srgb,var(--gold) 30%,var(--card));justify-self:end}
.conv .m small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.hrow{display:grid;grid-template-columns:110px auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .ranges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hrow .rg{display:flex;gap:4px;align-items:center;background:var(--soft2);border-radius:10px;padding:4px 6px}
.hrow input[type=time]{width:auto;padding:5px 7px;font-size:14px}
@media (max-width:640px){ .hrow{grid-template-columns:1fr auto} .hrow .ranges{grid-column:1/-1} }
.city-map{height:280px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.txt-row{display:grid;gap:6px}
.txt-row .lbl{display:flex;gap:8px;align-items:center}
.chline{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);line-height:1.4;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--card);max-width:46vw}
@media (max-width:700px){ .chline{max-width:40vw;font-size:11.5px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block} .chline .dot{margin-inline-end:4px} }
.chline .dot{flex:none}
.mpick{display:flex;flex-wrap:wrap;gap:7px}
.mpick button{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.mpick button.on{border-color:var(--accent);background:var(--soft)}
.mpick button .n{width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;display:none;place-items:center}
.mpick button.on .n{display:grid}
.mprev{background:var(--soft2);border-radius:12px;padding:10px;display:grid;gap:5px;font-size:13.5px;max-width:360px}
.mprev .b{background:var(--card);border-radius:9px;padding:7px 9px;white-space:pre-wrap;border:1px solid var(--line)}
.mprev .bt{background:var(--card);border-radius:9px;padding:6px;text-align:center;color:var(--info);font-weight:600;border:1px solid var(--line)}
.more-sheet a{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);font-weight:600}
.more-sheet a svg{width:21px;height:21px;color:var(--accent)}
.inv-items{display:grid;gap:8px}
.inv-item{display:grid;grid-template-columns:1fr 70px 100px 36px;gap:6px;align-items:center}
@media (max-width:480px){ .inv-item{grid-template-columns:1fr 56px 84px 34px} }
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes label{position:relative;display:grid;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;background:var(--card);font-size:14px}
.modes label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.modes label.off{opacity:.5;cursor:not-allowed}
.modes input{position:absolute;opacity:0;pointer-events:none}
.modes b{font-family:var(--display);font-size:14.5px} .modes span{font-size:12.5px;color:var(--muted)}
.faq-row{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.faq-row:last-child{border-bottom:0}
@media (max-width:640px){ .modes{grid-template-columns:1fr} .faq-row{grid-template-columns:1fr 36px} .faq-row textarea{grid-column:1} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/ihj.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon, money, badge } = I;
  const q = new URLSearchParams(location.search);
  I.loading('نفتح لوحة المنشأة…');

  // ───── الدخول ─────
  let session = null, asAdmin = false, me = null;
  try {
    if (q.get('b') && !location.hash.includes('k=')) { const r = await I.boot('ihj-admin'); session = r.session; me = r.me; }
    if (!session || !me || !me.admin) { const r = await I.boot('ihj-owner'); session = r.session; me = r.me; }
  } catch (e) { return I.gate('الرابط غير صالح', 'اطلب رابط لوحتك الجديد من احجزلي', 'err'); }
  if (!session || !me) return I.gate('افتح رابط لوحتك', 'لوحة المنشأة تنفتح من الرابط الخاص اللي وصلك', 'err');
  const ownerOf = me.members.find((m) => m.role === 'owner');
  const BIZ = (me.admin && q.get('b')) ? q.get('b') : ownerOf && ownerOf.business_id;
  if (!BIZ) return I.gate('ما فيه منشأة', 'هذا الرابط ما هو لوحة منشأة', 'err');
  asAdmin = me.admin && !ownerOf;
  const sb = I.sb;

  // ───── الحالة ─────
  const S = { biz: null, set: null, cities: [], services: [], staff: [], hours: [], holidays: [], orders: [], handoffs: [], customers: {}, tab: 'orders', filter: 'upcoming', search: '', seen: new Set(), ready: false, links: [] };
  const TABS = [
    ['orders', 'الطلبات', 'orders'], ['chats', 'المحادثات', 'chat'], ['staff', 'الموظفون', 'users'], ['catalog', 'الخدمات والمدن', 'box'],
    ['hours', 'الأوقات والعطل', 'clock'], ['texts', 'نصوص الرد', 'text'], ['report', 'التقرير', 'chart'], ['settings', 'الإعدادات', 'gear'],
  ];
  const BNAV = ['orders', 'chats', 'staff', 'report', 'more'];

  async function q1(p) { const { data, error } = await p; if (error) throw error; return data; }
  async function loadAll() {
    const since = new Date(Date.now() - 62 * 86400000).toISOString();
    const [biz, set, cities, services, staff, hours, holidays, orders, handoffs, chRow, pausedRows] = await Promise.all([
      q1(sb.from('businesses').select('*').eq('id', BIZ).single()),
      q1(sb.from('settings').select('*').eq('business_id', BIZ).single()),
      q1(sb.from('cities').select('*').eq('business_id', BIZ).order('sort').order('created_at')),
      q1(sb.from('services').select('*').eq('business_id', BIZ).order('sort').order('created_at')),
      q1(sb.from('staff').select('*').eq('business_id', BIZ).order('created_at')),
      q1(sb.from('hours').select('*').eq('business_id', BIZ).order('weekday').order('open_time')),
      q1(sb.from('holidays').select('*').eq('business_id', BIZ).gte('day', I.today()).order('day')),
      q1(sb.from('orders').select('*, customer:customers(id,name,wa_id,is_sim,bot_paused)').eq('business_id', BIZ).gte('slot_start', since).order('slot_start', { ascending: false }).limit(600)),
      q1(sb.from('handoffs').select('*, customer:customers(id,name,wa_id,is_sim,bot_paused,paused_reason)').eq('business_id', BIZ).is('resolved_at', null).order('created_at', { ascending: false })),
      sb.from('channels').select('provider,status,display_phone,verified_name,dry_run,last_check_at').eq('business_id', BIZ).maybeSingle().then((r) => r.data || {}),
      sb.from('customers').select('id,name,wa_id,is_sim,bot_paused,paused_reason,paused_at').eq('business_id', BIZ).eq('bot_paused', true).order('paused_at', { ascending: false }).limit(100).then((r) => r.data || []),
    ]);
    Object.assign(S, { biz, set, cities, services, staff, hours, holidays, orders, handoffs, ch: chRow || {}, paused: pausedRows || [] });
    orders.forEach((o) => S.seen.add(o.id));
  }
  try { await loadAll(); } catch (e) { console.error(e); return I.gate('ما قدرنا نفتح اللوحة', 'جرّب تحدّث الصفحة', 'err'); }
  I.setTitle(`${S.biz.name} · لوحة المنشأة`);

  const staffName = (id) => (S.staff.find((s) => s.id === id) || {}).name || '';
  const cityName = (id) => (S.cities.find((s) => s.id === id) || {}).name || '';
  const svcName = (id) => (S.services.find((s) => s.id === id) || {}).name || '';
  const custName = (c) => c ? (c.name || (c.is_sim ? 'عميل المحاكي' : I.phone(c.wa_id))) : '';
  const isOpen = (o) => ['confirmed', 'on_the_way', 'arrived', 'invoiced'].includes(o.status);
  const modeOf = (o) => (S.services.find((x) => x.id === o.service_id) || {}).place_mode || S.set.place_mode || 'visit';

  // ───── الهيكل ─────
  function shell() {
    const nav = TABS.map(([k, t, ic]) => `<a href="#${k}" data-tab="${k}">${icon(ic)}<span>${t}</span>${k === 'chats' ? '<span class="cnt" id="cntChats" hidden></span>' : k === 'orders' ? '<span class="cnt g" id="cntOrders" hidden></span>' : ''}</a>`).join('');
    const bnav = BNAV.map((k) => { const t = TABS.find((x) => x[0] === k); return k === 'more' ? `<a href="#more" data-tab="more">${icon('menu')}<span>المزيد</span></a>` : `<a href="#${k}" data-tab="${k}">${icon(t[2])}<span>${t[1]}</span>${k === 'chats' ? '<span class="cnt" id="cntChats2" hidden></span>' : ''}</a>`; }).join('');
    $('root').innerHTML = `
    ${asAdmin ? `<div class="asadmin">${icon('shield')}<span>تشوف لوحة «${esc(S.biz.name)}» كمدير</span><span class="sp"></span><a href="admin.html">رجوع للوحتي</a></div>` : ''}
    <div class="app">
      <aside class="side">
        <div class="brand">${I.logoHtml(S.biz)}<div><b>${esc(S.biz.name)}</b><small>لوحة المنشأة</small></div></div>
        <nav class="nav">${nav}</nav>
        <div class="foot">
          <label class="sw" title="الرد الآلي على الواتساب"><input type="checkbox" id="botSw" ${S.biz.bot_enabled ? 'checked' : ''}><i></i><span id="botLbl"></span></label>
          <button class="btn ghost sm" id="soundBtn" type="button"></button>
        </div>
      </aside>
      <div class="main">
        <header class="top"><div class="grow"><h1 id="tTitle"></h1><div class="sub" id="tSub"></div></div>
          <span class="chline" id="chLine"></span>
          <span class="live" id="live"><i></i><span>مباشر</span></span>
          <button class="ib" id="soundIb" type="button" aria-label="صوت التنبيه"></button>
        </header>
        <main class="content" id="view"></main>
      </div>
      <nav class="bnav">${bnav}</nav>
    </div>`;
    document.querySelectorAll('[data-tab]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.tab); }));
    $('botSw').addEventListener('change', toggleBot);
    $('soundBtn').onclick = $('soundIb').onclick = () => { I.toggleAlerts(); paintSound(); };
    paintSound(); paintBot(); paintCounts(); paintCh();
  }
  function paintSound() { const on = I.alertsState(); $('soundBtn').innerHTML = `${icon(on ? 'bell' : 'belloff')}${on ? 'صوت التنبيه شغّال' : 'صوت التنبيه موقف'}`; $('soundIb').innerHTML = icon(on ? 'bell' : 'belloff'); $('soundIb').classList.toggle('on', on); }
  function paintCh() {
    const el = $('chLine'); if (!el) return;
    const c = S.ch || {};
    el.innerHTML = c.status === 'connected' && !c.dry_run ? `<span class="dot ok"></span>واتساب مربوط${c.display_phone ? ' <span class="ltr">' + esc(c.display_phone) + '</span>' : ''}`
      : c.status === 'connected' ? '<span class="dot warn"></span>واتساب: وضع الفحص'
      : c.status === 'error' ? '<span class="dot bad"></span>واتساب: فيه مشكلة بالربط'
      : '<span class="dot"></span>واتساب: لسا ما تربط';
  }
  function paintBot() { $('botLbl').textContent = S.biz.bot_enabled ? 'الرد الآلي شغّال' : 'الرد الآلي موقف'; $('botSw').checked = !!S.biz.bot_enabled; }
  function paintCounts() {
    const n = S.handoffs.length;
    ['cntChats', 'cntChats2'].forEach((id) => { const el = $(id); if (el) { el.hidden = !n; el.textContent = n; } });
    const today = S.orders.filter((o) => I.parts(o.slot_start).ymd === I.today() && isOpen(o)).length;
    const el = $('cntOrders'); if (el) { el.hidden = !today; el.textContent = today; }
  }
  async function toggleBot() {
    const on = $('botSw').checked;
    try { await q1(sb.from('businesses').update({ bot_enabled: on }).eq('id', BIZ).select('id')); S.biz.bot_enabled = on; paintBot(); I.toast(on ? 'الرد الآلي شغّال ✓' : 'الرد الآلي موقف'); }
    catch (e) { $('botSw').checked = !on; I.fail(e); }
  }

  function go(tab) {
    if (tab === 'more') return moreSheet();
    I.closeAll();
    S.tab = tab; history.replaceState(null, '', '#' + tab);
    document.querySelectorAll('[data-tab]').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
    const t = TABS.find((x) => x[0] === tab);
    $('tTitle').textContent = t ? t[1] : '';
    $('tSub').textContent = tab === 'orders' ? `${S.biz.name}` : '';
    render();
    window.scrollTo(0, 0);
  }
  function moreSheet() {
    const m = I.modal(`<div class="mh"><h3 class="grow">المزيد</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb more-sheet">${['catalog', 'hours', 'texts', 'settings'].map((k) => { const t = TABS.find((x) => x[0] === k); return `<a href="#${k}" data-go="${k}">${icon(t[2])}${t[1]}</a>`; }).join('')}</div>`);
    m.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.go); }));
  }
  function render() {
    const v = $('view');
    if (['settings', 'report', 'staff'].includes(S.tab) && v.dataset.tab !== S.tab) v.innerHTML = '<div class="card" style="display:grid;place-items:center;padding:40px"><div class="spin"></div></div>';
    v.dataset.tab = S.tab;
    ({ orders: vOrders, chats: vChats, staff: vStaff, catalog: vCatalog, hours: vHours, texts: vTexts, report: vReport, settings: vSettings }[S.tab] || vOrders)(v);
  }

  // ═════ الطلبات ═════
  function vOrders(v) {
    const t = I.today(), monthStart = t.slice(0, 8) + '01';
    const todayN = S.orders.filter((o) => I.parts(o.slot_start).ymd === t && o.status !== 'cancelled').length;
    const upcoming = S.orders.filter((o) => isOpen(o) && new Date(o.slot_end) > Date.now()).length;
    const unpaid = S.orders.filter((o) => o.status === 'invoiced').length;
    const monthDone = S.orders.filter((o) => o.status === 'done' && I.parts(o.slot_start).ymd >= monthStart);
    const F = [['upcoming', 'القادمة'], ['today', 'اليوم'], ['action', 'تحتاج إجراء'], ['done', 'المكتملة'], ['cancelled', 'الملغية'], ['all', 'الكل']];
    const list = filtered();
    v.innerHTML = `
      <div class="kpis">
        <div class="kpi accent"><b>${todayN}</b><span>طلبات اليوم</span></div>
        <div class="kpi"><b>${upcoming}</b><span>طلبات قادمة</span></div>
        <div class="kpi"><b>${unpaid}</b><span>بانتظار الدفع</span></div>
        <div class="kpi"><b>${monthDone.length}</b><span>مكتملة هذا الشهر</span></div>
      </div>
      <div class="row">
        ${F.map(([k, l]) => `<button class="chip ${S.filter === k ? 'on' : ''}" data-f="${k}" type="button">${l}<span class="n">${count(k)}</span></button>`).join('')}
        <span class="sp"></span>
        <input id="oSearch" placeholder="بحث برقم الطلب أو الاسم أو الجوال" value="${esc(S.search)}" style="max-width:280px">
        <button class="btn sm" type="button" id="manualBtn">${icon('plus')}حجز يدوي</button>
      </div>
      <div class="list" id="oList">${list.length ? list.map(orderCard).join('') : `<div class="empty">${icon('orders')}<b>ما فيه طلبات هنا</b><span class="tiny">الطلبات توصل من الواتساب لحالها، وتطلع هنا مع صوت التنبيه</span></div>`}</div>`;
    v.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => { S.filter = b.dataset.f; render(); }));
    $('manualBtn').onclick = manualBook;
    $('oSearch').addEventListener('input', I.debounce((e) => { S.search = e.target.value.trim(); const l = filtered(); $('oList').innerHTML = l.length ? l.map(orderCard).join('') : `<div class="empty">${icon('search')}<b>ما لقينا شي</b></div>`; bindCards(); }, 200));
    bindCards();
  }
  function count(k) { return S.orders.filter((o) => match(o, k)).length; }
  function match(o, k) {
    const t = I.today();
    switch (k) {
      case 'today': return I.parts(o.slot_start).ymd === t && o.status !== 'cancelled';
      case 'upcoming': return (isOpen(o) || o.status === 'pending_payment') && new Date(o.slot_end).getTime() > Date.now() - 3 * 3600000;
      case 'action': return (isOpen(o) && !o.staff_id && !o.is_test) || o.status === 'invoiced' || (isOpen(o) && new Date(o.slot_end).getTime() < Date.now() - 3 * 3600000);
      case 'done': return o.status === 'done';
      case 'cancelled': return o.status === 'cancelled';
      default: return true;
    }
  }
  function filtered() {
    let l = S.orders.filter((o) => match(o, S.filter));
    if (S.search) { const s = S.search.replace(/^#/, ''); l = l.filter((o) => String(o.number).includes(s) || (o.customer && ((o.customer.name || '').includes(s) || I.phone(o.customer.wa_id).includes(s.replace(/\D/g, '') || '¤')))); }
    const asc = S.filter === 'upcoming' || S.filter === 'today' || S.filter === 'action';
    return l.sort((a, b) => asc ? new Date(a.slot_start) - new Date(b.slot_start) : new Date(b.slot_start) - new Date(a.slot_start));
  }
  function orderCard(o) {
    const c = o.customer || {};
    const staffSel = isOpen(o) ? `<select data-assign="${o.id}" aria-label="الموظف" style="width:auto;padding:5px 8px;font-size:13.5px"><option value="">بدون موظف</option>${S.staff.filter((s) => s.active || s.id === o.staff_id).map((s) => `<option value="${s.id}" ${s.id === o.staff_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>` : (o.staff_id ? `<span>${icon('users')}${esc(staffName(o.staff_id))}</span>` : '');
    return `<div class="item ord click ${o.status} ${S.fresh && S.fresh.has(o.id) ? 'new' : ''}" data-oid="${o.id}">
      <div class="h"><span class="no">#${o.number}</span>${badge(o.status)}${o.is_test ? '<span class="badge b-test plain">تجربة</span>' : ''}${o.prepaid ? '<span class="badge b-ok plain">مدفوع مقدمًا</span>' : ''}${isOpen(o) && !o.staff_id && !o.is_test ? '<span class="badge b-warn plain">بدون موظف</span>' : ''}<span class="sp"></span><span class="when">${I.when(o.slot_start)}</span></div>
      <div class="who"><span class="avatar">${esc(I.initials(custName(c)))}</span><div class="grow"><b>${esc(custName(c))}</b><div class="tiny">${c.is_sim ? 'من المحاكي' : `<span class="ltr">${esc(I.phone(c.wa_id))}</span>`}${c.bot_paused ? ' · <span style="color:var(--warn)">البوت موقف معه</span>' : ''}</div></div></div>
      <div class="meta">${o.city_id ? `<span>${icon('pin')}${esc(cityName(o.city_id))}</span>` : ''}${o.service_id ? `<span>${icon('box')}${esc(svcName(o.service_id))}</span>` : ''}${o.price != null ? `<span>${icon('money')}${money(o.price)} ر.س</span>` : ''}${staffSel}</div>

  }

      try { await I.api('order/assign', { order_id: s.dataset.assign, staff_id: s.value || null }); const o = S.orders.find((x) => x.id === s.dataset.assign); if (o) o.staff_id = s.value || null; I.toast('انسند الطلب ✓'); render(); }
      catch (e) { I.fail(e); render(); }
    }));
  }

      <div class="card flat stack s">
        <div class="row"><span class="avatar">${esc(I.initials(custName(c)))}</span><div class="grow"><b style="font-family:var(--display);font-size:16px">${esc(custName(c))}</b><div class="tiny">${c.is_sim ? 'من المحاكي' : `<span class="ltr">${esc(I.phone(c.wa_id))}</span>`}</div></div>
          ${c.is_sim ? '' : `<a class="btn sm ghost" href="${I.waLink(c.wa_id)}" target="_blank" rel="noopener">${icon('wa')}واتساب</a><a class="btn sm ghost" href="tel:+${esc(c.wa_id)}">${icon('phone')}اتصال</a>`}</div>
        <div class="g2 small">
          <div><span class="tiny">الموعد</span><div><b>${esc(I.day(o.slot_start))}</b> · ${I.time(o.slot_start)}</div></div>
          <div><span class="tiny">${modeOf(o) === 'shop' ? 'الفرع' : modeOf(o) === 'online' ? 'المكان' : 'المدينة'}</span><div>${modeOf(o) === 'online' ? 'أونلاين' : esc(cityName(o.city_id) || 'غير محدد')}</div></div>
          <div><span class="tiny">الخدمة</span><div>${esc(svcName(o.service_id) || 'غير محدد')}</div></div>
          <div><span class="tiny">السعر</span><div>${o.price != null ? money(o.price) + ' ر.س' : 'بعد الزيارة'}${o.prepaid ? ' · مدفوع مقدمًا' : ''}</div></div>
        </div>
        ${maps ? `<a class="btn ghost sm" href="${esc(maps)}" target="_blank" rel="noopener" style="justify-self:start">${icon('pin')}افتح الموقع في الخرائط</a>` : ''}
      </div>
      ${o.status === 'pending_payment' ? `<div class="card flat stack s"><h3>ينتظر دفع الحجز</h3>${o.hold_until ? `<p class="tiny">المهلة لين ${esc(I.time(o.hold_until))}، وبعدها ينلغى ويرجع الموعد متاح</p>` : ''}<div class="row"><button class="btn sm soft" data-act="cash">${icon('money')}وصل الدفع يدويًا</button><button class="btn sm bad ghost" data-act="cancel">${icon('x')}إلغاء الطلب</button></div></div>` : ''}
      ${isOpen(o) ? `<div class="card flat stack s"><h3>تحريك الطلب</h3>
        <div class="row">
          ${modeOf(o) === 'visit' && ['confirmed'].includes(o.status) ? `<button class="btn sm" data-act="on_the_way">${icon('car')}في الطريق</button>` : ''}
          ${modeOf(o) === 'visit' && ['confirmed', 'on_the_way'].includes(o.status) ? `<button class="btn sm soft" data-act="arrived">${icon('pin')}وصل الموظف</button>` : ''}
          ${['confirmed', 'on_the_way', 'arrived', 'invoiced'].includes(o.status) ? `<button class="btn sm gold" data-act="invoice">${icon('file')}${o.prepaid ? 'فاتورة إضافية' : o.status === 'invoiced' ? 'فاتورة جديدة' : 'الفاتورة'}</button>` : ''}
          ${o.status === 'invoiced' ? `<button class="btn sm soft" data-act="cash">${icon('money')}وصل الدفع يدويًا</button>` : ''}
          ${['confirmed', 'on_the_way', 'arrived'].includes(o.status) ? `<button class="btn sm ${o.prepaid ? '' : 'ghost'}" data-act="done">${icon('check')}${o.prepaid ? 'إكمال الطلب' : 'إكمال بدون فاتورة'}</button>` : ''}
        </div>

      </div>` : ''}
      ${inv ? `<div class="card flat row"><span class="grow">فاتورة رقم <b>${inv.number}</b> · ${money(inv.total)} ر.س · ${inv.status === 'paid' ? `<span class="badge b-done">مدفوعة ${esc(inv.paid_method || '')}</span>` : '<span class="badge b-invoiced">غير مدفوعة</span>'}</span><button class="btn sm ghost" data-act="pdf">${icon('file')}عرض الفاتورة</button></div>` : ''}
      <div class="card flat stack s"><h3>ملاحظات داخلية</h3><textarea id="oNotes" rows="2" placeholder="تظهر لكم فقط">${esc(o.notes || '')}</textarea><button class="btn sm ghost" data-act="notes" style="justify-self:start">حفظ الملاحظة</button></div>

    d.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => orderAct(o, b.dataset.act, b)));

  // نتيجة الإرسال للعميل: انرسل، أو انحفظ بدون إرسال (والسبب)
  function sentToast(r, okMsg) {
    const sd = r && (r.send || r);
    if (!sd || sd.ok !== false && sd.mode !== 'logged') return I.toast(okMsg);
    const e = String(sd.error || '');
    const why = sd.mode === 'logged' ? 'رقم الواتساب لسا ما تربط' : e.startsWith('template_not_approved') ? 'العميل ما راسلكم آخر 24 ساعة، والرسالة تحتاج قالب معتمد من ميتا' : e === 'window_closed' ? 'العميل ما راسلكم آخر 24 ساعة' : 'تعذّر الإرسال';
    I.toast('انحفظ، بس العميل ما وصلته رسالة: ' + why, true);
  }
  async function orderAct(o, act, btn) {
    const run = async (path, body, okMsg) => {
      btn.disabled = true;
      try { const r = await I.api(path, { order_id: o.id, ...(body || {}) }); sentToast(r, okMsg); await refreshOrder(o.id); openOrder(o.id); return r; }
      catch (e) { I.fail(e); btn.disabled = false; }
    };
    if (act === 'on_the_way') return run('order/on_the_way', {}, 'انرسل للعميل إن الموظف في الطريق ✓');
    if (act === 'arrived') return run('order/arrived', {}, 'تم ✓');
    if (act === 'done') return run('order/done', {}, 'اكتمل الطلب ✓');
    if (act === 'cash') return payManual(o);
    if (act === 'invoice') return invoiceForm(o);
    if (act === 'pdf') { try { const r = await I.api('order/pdf', { order_id: o.id }); window.open(r.url, '_blank', 'noopener'); } catch (e) { I.fail(e); } return; }
    if (act === 'notes') { try { await q1(sb.from('orders').update({ notes: $('oNotes').value.slice(0, 1000) }).eq('id', o.id).select('id')); o.notes = $('oNotes').value; I.toast('انحفظت ✓'); } catch (e) { I.fail(e); } return; }
    if (act === 'cancel') {
      const m = I.modal(`<div class="mh"><h3 class="grow">إلغاء الطلب رقم ${o.number}</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb"><label class="f"><span>السبب (يوصل للعميل)</span><input id="cxR" maxlength="200" placeholder="اختياري"></label><label class="check"><input type="checkbox" id="cxN" checked>أرسل للعميل رسالة الإلغاء</label>${o.prepaid ? '<p class="tiny">العميل دافع مقدمًا: المبلغ يرجع له من لوحة ميسر.</p>' : ''}</div><div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn bad" id="cxGo">ألغِ الطلب</button></div>`);
      m.querySelector('#cxGo').onclick = async (e) => { e.target.disabled = true; try { await I.api('order/cancel', { order_id: o.id, reason: $('cxR').value, notify: $('cxN').checked }); I.toast('انلغى الطلب'); await refreshOrder(o.id); I.closeAll(); render(); } catch (x) { I.fail(x); e.target.disabled = false; } };
      return;
    }
    if (act === 'resched') return reschedule(o);
  }

  // حجز يدوي: عميل اتصل بالجوال. نفس المواعيد المتاحة للواتساب، وينسند لموظف، ويوصل العميل تأكيد
  async function manualBook() {
    const svcs = S.services.filter((x) => x.active), cts = S.cities.filter((x) => x.active);
    const place = S.set.place_mode || 'visit';
    const m = I.modal(`<div class="mh"><h3 class="grow">حجز يدوي</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb">
      <div class="g2"><label class="f"><span>اسم العميل</span><input id="mbN" maxlength="60" autocomplete="off"></label><label class="f"><span>جواله (واتساب)</span><input id="mbP" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx"></label>
      ${svcs.length > 1 ? `<label class="f"><span>الخدمة</span><select id="mbS">${svcs.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>` : ''}
      ${place !== 'online' && cts.length > 1 ? `<label class="f"><span>${place === 'shop' ? 'الفرع' : 'المدينة'}</span><select id="mbC">${cts.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>` : ''}</div>
      ${place === 'visit' ? '<label class="f"><span>العنوان أو رابط الموقع (اختياري)</span><input id="mbA" maxlength="200"></label>' : ''}
      <div id="mbSlots"><div class="spin"></div></div>
      <label class="check"><input type="checkbox" id="mbW" checked>أرسل للعميل تأكيد بالواتساب</label></div>
      <div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="mbGo" disabled>${icon('check')}احجز</button></div>`);
    let pick = null, byDay = {}, day = null;
    const load = async () => {
      $('mbSlots').innerHTML = '<div class="spin"></div>'; pick = null; $('mbGo').disabled = true;
      let slots = [];
      try { slots = (await I.api('slots', { business_id: BIZ, city_id: $('mbC') ? $('mbC').value : (cts[0] || {}).id || null, service_id: $('mbS') ? $('mbS').value : (svcs[0] || {}).id || null, days: 10 })).slots; } catch (e) { I.fail(e); }
      byDay = {}; slots.forEach((s) => { const d = I.parts(s.slot_start).ymd; (byDay[d] = byDay[d] || []).push(s); });
      day = Object.keys(byDay)[0]; paint();
    };
    const paint = () => {
      $('mbSlots').innerHTML = Object.keys(byDay).length ? `<div class="slotgrid">${Object.keys(byDay).map((d) => `<button type="button" class="${d === day ? 'on' : ''}" data-d="${d}">${esc(I.relDay(d))}</button>`).join('')}</div><hr class="s"><div class="slotgrid">${(byDay[day] || []).map((s) => `<button type="button" class="${pick === s.slot_start ? 'on' : ''}" data-s="${s.slot_start}">${I.time(s.slot_start)}</button>`).join('')}</div>` : '<div class="empty">ما فيه مواعيد متاحة</div>';
      $('mbSlots').querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { day = b.dataset.d; pick = null; $('mbGo').disabled = true; paint(); });
      $('mbSlots').querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { pick = b.dataset.s; $('mbGo').disabled = false; paint(); });
    };
    if ($('mbS')) $('mbS').onchange = load; if ($('mbC')) $('mbC').onchange = load;
    await load();
    m.querySelector('#mbGo').onclick = async (e) => {
      const ph = String($('mbP').value).replace(/\D/g, '');
      if (!/^(9665|05|5)\d{8}$/.test(ph)) return I.toast('اكتب جوال العميل', true);
      e.target.disabled = true;
      try {
        const r = await I.api('biz/book', { business_id: BIZ, name: $('mbN').value, phone: $('mbP').value, service_id: $('mbS') ? $('mbS').value : (svcs[0] || {}).id || null, city_id: $('mbC') ? $('mbC').value : (place === 'online' ? null : (cts[0] || {}).id || null), address: $('mbA') ? $('mbA').value : '', start: pick, notify: $('mbW').checked });
        I.closeAll();
        if ($('mbW').checked) sentToast(r, `انحجز رقم ${r.order.number} ✓ ووصل العميل التأكيد`); else I.toast(`انحجز رقم ${r.order.number} ✓`);
        await refreshOrder(r.order.id); S.seen.add(r.order.id); render();
      } catch (x) { I.toast(x.code === 'slot_taken' ? 'الموعد انحجز للتو، اختر غيره' : (x.message || 'ما انحجز'), true); e.target.disabled = false; if (x.code === 'slot_taken') load(); }
    };
  }

  async function reschedule(o) {
    const m = I.modal(`<div class="mh"><h3 class="grow">تغيير موعد الطلب رقم ${o.number}</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb" id="rsB"><div class="spin"></div></div><div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="rsGo" disabled>اعتمد الموعد</button></div>`);
    let slots = [];
    try { slots = (await I.api('slots', { business_id: BIZ, city_id: o.city_id, service_id: o.service_id, days: 10, exclude: o.id })).slots; } catch (e) { I.fail(e); }
    const byDay = {}; slots.forEach((s) => { const d = I.parts(s.slot_start).ymd; (byDay[d] = byDay[d] || []).push(s); });
    let day = Object.keys(byDay)[0], pick = null;
    const paint = () => {
      $('rsB').innerHTML = Object.keys(byDay).length ? `<div class="slotgrid">${Object.keys(byDay).map((d) => `<button type="button" class="${d === day ? 'on' : ''}" data-d="${d}">${esc(I.relDay(d))}</button>`).join('')}</div><hr class="s"><div class="slotgrid">${(byDay[day] || []).map((s) => `<button type="button" class="${pick === s.slot_start ? 'on' : ''}" data-s="${s.slot_start}">${I.time(s.slot_start)}</button>`).join('')}</div><p class="tiny">يوصل للعميل رسالة بالموعد الجديد</p>` : '<div class="empty">ما فيه مواعيد متاحة</div>';
      $('rsB').querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { day = b.dataset.d; pick = null; $('rsGo').disabled = true; paint(); });
      $('rsB').querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { pick = b.dataset.s; $('rsGo').disabled = false; paint(); });
    };
    paint();
    m.querySelector('#rsGo').onclick = async (e) => { e.target.disabled = true; try { await I.api('order/reschedule', { order_id: o.id, start: pick }); I.toast('تغيّر الموعد وانرسل للعميل ✓'); await refreshOrder(o.id); I.closeAll(); render(); } catch (x) { I.fail(x); e.target.disabled = false; } };
  }

  function invoiceForm(o) {
    const svc = S.services.find((s) => s.id === o.service_id);
    const items = [{ name: svc ? svc.name : 'الخدمة', qty: 1, price: o.price != null ? o.price : (svc && svc.price != null ? svc.price : '') }];
    const vp = Number(S.set.vat_percent || 0);
    const m = I.modal(`<div class="mh"><h3 class="grow">فاتورة الطلب رقم ${o.number}</h3><button class="ib" data-close>${icon('x')}</button></div>
      <div class="mb"><div class="inv-items" id="invItems"></div><button class="btn sm ghost" id="invAdd" type="button" style="justify-self:start">${icon('plus')}بند</button>
      <div class="card flat row"><span class="grow">الإجمالي${vp ? ` شامل الضريبة ${vp}%` : ''}</span><b id="invTot" style="font-family:var(--display);font-size:20px">0</b></div></div>
      <div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="invGo">${icon('send')}أرسل الفاتورة للعميل</button></div>`);
    const paint = () => {
      $('invItems').innerHTML = `<div class="inv-item tiny"><span>البند</span><span>الكمية</span><span>السعر</span><span></span></div>` + items.map((it, i) => `<div class="inv-item"><input data-i="${i}" data-k="name" value="${esc(it.name)}" maxlength="60"><input data-i="${i}" data-k="qty" type="number" min="1" value="${it.qty}" inputmode="numeric"><input data-i="${i}" data-k="price" type="number" min="0" step="0.01" value="${it.price}" inputmode="decimal" placeholder="0"><button class="ib" type="button" data-del="${i}" aria-label="حذف">${icon('trash')}</button></div>`).join('');
      $('invItems').querySelectorAll('input').forEach((x) => x.addEventListener('input', () => { const it = items[+x.dataset.i]; it[x.dataset.k] = x.dataset.k === 'name' ? x.value : x.value; total(); }));
      $('invItems').querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { if (items.length > 1) { items.splice(+b.dataset.del, 1); paint(); } });
      total();
    };
    const total = () => { const sub = items.reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.price) || 0), 0); $('invTot').textContent = money(Math.round((sub + sub * vp / 100) * 100) / 100) + ' ر.س'; };
    $('invAdd').onclick = () => { items.push({ name: '', qty: 1, price: '' }); paint(); };
    paint();
    m.querySelector('#invGo').onclick = async (e) => {
      const clean = items.map((it) => ({ name: String(it.name).trim(), qty: Number(it.qty), price: Number(it.price) })).filter((it) => it.name);
      if (!clean.length || clean.some((it) => !(it.qty >= 1) || !(it.price >= 0) || it.price === '')) return I.toast('اكتب البنود والأسعار', true);
      e.target.disabled = true;
      try { const r = await I.api('order/invoice', { order_id: o.id, items: clean }); sentToast(r, r.pay_link ? 'انرسلت الفاتورة ورابط الدفع للعميل ✓' : 'انرسلت الفاتورة للعميل ✓'); await refreshOrder(o.id); I.closeAll(); openOrder(o.id); }
      catch (x) { I.fail(x); e.target.disabled = false; }
    };
  }

  function payManual(o) {
    const m = I.modal(`<div class="mh"><h3 class="grow">وصل الدفع · الطلب رقم ${o.number}</h3><button class="ib" data-close>${icon('x')}</button></div><div class="mb"><div class="seg" id="pmSeg"><button class="on" data-m="cash">نقدًا</button><button data-m="card">شبكة</button><button data-m="transfer">تحويل</button></div><p class="tiny">يوصل للعميل «وصلنا دفعك» وينقفل الطلب</p></div><div class="mf"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="pmGo">${icon('check')}تأكيد</button></div>`);
    let method = 'cash';
    m.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { method = b.dataset.m; m.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); });
    m.querySelector('#pmGo').onclick = async (e) => { e.target.disabled = true; try { await I.api('order/cash', { order_id: o.id, method }); I.toast('وصل الدفع وانقفل الطلب ✓'); await refreshOrder(o.id); I.closeAll(); render(); } catch (x) { I.fail(x); e.target.disabled = false; } };
  }

  async function refreshOrder(id) {
    try {
      const o = (await q1(sb.from('orders').select('*, customer:customers(id,name,wa_id,is_sim,bot_paused)').eq('id', id).limit(1)))[0];
      if (!o) return;

  function cityMap(c) {

    setTimeout(() => {
      if (!window.L) return;
      const map = L.map('cmap').setView([lat, lng], 10);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
      const circ = L.circle([lat, lng], { radius: rad * 1000, color: '#4338CA' }).addTo(map);

      map.on('click', (e) => { lat = e.latlng.lat; lng = e.latlng.lng; circ.setLatLng(e.latlng); });
      $('crad').oninput = (e) => { rad = +e.target.value; circ.setRadius(rad * 1000); };

      const [y, m] = repMonth.split('-').map(Number);
      const from = new Date(Date.UTC(y, m - 1, 1) - 3 * 3600000).toISOString(), to = new Date(Date.UTC(y, m, 1) - 3 * 3600000).toISOString();
      const rows = await q1(sb.from('orders').select('number,status,slot_start,price,channel,is_test,city_id,service_id,staff_id,maps_url,created_at,paid_at, customer:customers(name,wa_id,is_sim)').eq('business_id', BIZ).gte('slot_start', from).lt('slot_start', to).order('slot_start'));
      const out = [['رقم الطلب', 'الحالة', 'اليوم', 'الوقت', 'العميل', 'الجوال', 'المدينة', 'الخدمة', 'الموظف', 'السعر', 'الموقع', 'تجربة']].concat(rows.map((o) => [o.number, I.STATUS[o.status], I.day(o.slot_start), I.time(o.slot_start), custName(o.customer), o.customer && !o.customer.is_sim ? I.phone(o.customer.wa_id) : '', cityName(o.city_id), svcName(o.service_id), staffName(o.staff_id), o.price ?? '', o.maps_url, o.is_test ? 'نعم' : '']));
      I.download(`orders-${repMonth}.csv`, I.csv(out));
    } catch (e) { I.fail(e); }
  }

  // ═════ الإعدادات ═════
  async function vSettings(v) {
    const b = S.biz, s = S.set;
    let pay = S.payStatus || { provider: s.pay_provider, moyasar: '' };
    if (!S.payStatus) I.api('biz/payment-status', { business_id: BIZ }).then((p) => { S.payStatus = p; if (S.tab === 'settings') vSettings($('view')); }).catch(() => {});
    const payPlan = b.plan === 'bot_pay' || b.is_demo;
    const radios = (name, opts, cur, off = []) => opts.map(([k, l, d]) => `<label class="${off.includes(k) ? 'off' : ''}"><input type="radio" name="${name}" value="${k}" ${cur === k ? 'checked' : ''} ${off.includes(k) ? 'disabled' : ''}><b>${l}</b><span>${d}</span></label>`).join('');
    const PLACE_O = [['visit', 'عند العميل', 'يرسل موقعه والموظف يروح له'], ['shop', 'في المحل', 'يختار الفرع ويوصله موقعه'], ['online', 'أونلاين', 'جلسة برابط']];
    const PAY_O = [['after', 'بعد الخدمة', 'فاتورة بعد الخدمة'], ['before', 'قبل الحجز', 'الحجز يتأكد بعد الدفع'], ['none', 'في المحل', 'بدون دفع بالواتساب']];
    const TONE_O = [['friendly', 'ودّي', 'هلا وسهلا 👋'], ['formal', 'رسمي', 'مرحبًا بكم، يسعدنا خدمتكم'], ['short', 'مختصر', 'ردود قصيرة ومباشرة']];
    v.innerHTML = `
      <div class="card stack"><h3>طريقة الشغل</h3>
        <span class="tiny">وين الخدمة</span><div class="modes">${radios('place_mode', PLACE_O, s.place_mode || 'visit')}</div>
        <label class="f" id="onBox" ${s.place_mode === 'online' ? '' : 'hidden'}><span>سطر الجلسة في رسالة التأكيد</span><input id="onNote" value="${esc(s.online_note || '')}" maxlength="300" placeholder="أونلاين، ويوصلك رابط الجلسة قبل الموعد"></label>
        <span class="tiny">الدفع</span><div class="modes">${radios('pay_timing', PAY_O, s.pay_timing || 'after', payPlan ? [] : ['before'])}</div>
        ${payPlan ? '' : '<p class="tiny">الدفع قبل الحجز ضمن باقة «أتمتة الحجز والدفع».</p>'}
        <div class="g2" id="preBox" ${s.pay_timing === 'before' ? '' : 'hidden'}>
          <label class="f"><span>مبلغ الحجز للخدمات اللي بدون سعر</span><input id="preAmt" type="number" min="0" max="100000" value="${Number(s.prepay_amount) || ''}" placeholder="الخدمة اللي لها سعر تندفع كاملة"></label>
          <label class="f"><span>مهلة الدفع قبل ما ينلغى الحجز</span><select id="holdM">${[[15, 'ربع ساعة'], [30, 'نص ساعة'], [60, 'ساعة'], [180, '3 ساعات'], [720, '12 ساعة'], [1440, 'يوم']].map(([x, l]) => `<option value="${x}" ${+s.hold_minutes === x ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          ${pay.provider === 'moyasar' || pay.provider === 'demo' ? '' : '<p class="tiny">رابط الدفع يطلع بعد ربط ميسر تحت.</p>'}
        </div>
        <span class="tiny">أسلوب الردود</span><div class="modes">${radios('tone', TONE_O, s.tone || 'friendly')}</div></div>
      <div class="card stack"><h3>الشعار وبيانات الفاتورة</h3>
        <div class="row">${I.logoHtml(b, 'avatar" style="width:64px;height:64px;border-radius:16px;overflow:hidden')}<label class="btn ghost sm">${icon('plus')}تغيير الشعار<input type="file" id="logoF" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></label></div>
        <div class="g2">
          <label class="f"><span>اسم المنشأة</span><input data-b="name" value="${esc(b.name)}" maxlength="80"></label>
          <label class="f"><span>الاسم بالإنجليزي</span><input data-b="name_en" value="${esc(b.name_en)}" maxlength="80" dir="ltr"></label>
          <label class="f"><span>السجل التجاري</span><input data-b="cr_number" value="${esc(b.cr_number)}" maxlength="20" dir="ltr"></label>
          <label class="f"><span>الرقم الضريبي</span><input data-b="vat_number" value="${esc(b.vat_number)}" maxlength="20" dir="ltr" placeholder="لو مسجلين بالضريبة"></label>
          <label class="f"><span>العنوان في الفاتورة</span><input data-b="address" value="${esc(b.address)}" maxlength="120"></label>
          <label class="f"><span>لون المنشأة</span><input data-b="brand_color" type="color" value="${esc(b.brand_color)}"></label>
          <label class="f"><span>نسبة الضريبة على الفاتورة</span><select id="vatP"><option value="0" ${+s.vat_percent === 0 ? 'selected' : ''}>بدون ضريبة</option><option value="15" ${+s.vat_percent === 15 ? 'selected' : ''}>15%</option></select></label>
        </div></div>
      <div class="card stack"><h3>الدفع الإلكتروني (ميسر)</h3>
        ${payPlan ? `<div class="row"><span class="dot ${pay.provider === 'moyasar' ? 'ok' : pay.provider === 'demo' ? 'warn' : ''}"></span><b>${pay.provider === 'moyasar' ? 'مربوط بحسابكم في ميسر' + (pay.test_mode ? ' (وضع تجريبي)' : '') : pay.provider === 'demo' ? 'وضع تجريبي بدون فلوس' : 'غير مربوط'}</b>${pay.moyasar ? `<span class="tiny ltr">${esc(pay.moyasar)}</span>` : ''}</div>
          <p class="tiny">من لوحة ميسر: الإعدادات ← مفاتيح API. العميل يدفع بمدى أو أبل باي أو البطاقة، والمبلغ يدخل حسابكم مباشرة.</p>
          <div class="g2"><label class="f"><span>المفتاح السري</span><input id="sk" dir="ltr" placeholder="sk_live_…" autocomplete="off"></label><label class="f"><span>المفتاح العام</span><input id="pk" dir="ltr" placeholder="pk_live_…" autocomplete="off"></label></div>
          <div class="row"><button class="btn" id="paySave">${icon('check')}ربط ميسر</button>${pay.provider === 'moyasar' ? '<button class="btn ghost bad" id="payOff">فك الربط</button>' : ''}</div>`
        : '<p class="muted">الفاتورة PDF توصل للعميل، والدفع الإلكتروني متاح في باقة «أتمتة الحجز والدفع».</p>'}
      </div>
      <div class="card stack"><h3>التذكير والتحويل والتنبيه</h3><div class="g3">
        <label class="f"><span>التذكير قبل الموعد</span><select data-s="reminder_minutes">${[[0, 'بدون تذكير'], [60, 'ساعة'], [120, 'ساعتين'], [180, '3 ساعات'], [360, '6 ساعات'], [720, '12 ساعة'], [1440, 'يوم']].map(([x, l]) => `<option value="${x}" ${s.reminder_minutes === x ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="f"><span>يرجع البوت للعميل المحوّل بعد</span><select data-s="resume_hours">${[[0, 'يدويًا فقط'], [2, 'ساعتين'], [6, '6 ساعات'], [12, '12 ساعة'], [24, 'يوم'], [48, 'يومين']].map(([x, l]) => `<option value="${x}" ${s.resume_hours === x ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="f"><span>جوال المالك للتنبيهات</span><input data-b="owner_phone" value="${esc(I.phone(b.owner_phone))}" dir="ltr" placeholder="05xxxxxxxx"></label>
      </div><label class="check"><input type="checkbox" id="notifyStaff" ${s.notify_staff ? 'checked' : ''}>إشعار واتساب للموظف المسؤول مع كل طلب ينسند له</label><label class="check"><input type="checkbox" id="notifyOwner" ${s.notify_owner ? 'checked' : ''}>تنبيه واتساب على جوال المالك مع كل طلب جديد ومع كل عميل يحتاج رد</label></div>
      <div class="card stack"><h3>التصدير لجدول قوقل أو Webhook</h3>
        <div class="seg" id="exSeg">${[['none', 'بدون'], ['sheet', 'جدول قوقل'], ['webhook', 'Webhook']].map(([k, l]) => `<button data-x="${k}" class="${s.export_kind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div id="exBody"></div></div>`;
    // البيانات
    v.querySelectorAll('[data-b]').forEach((inp) => inp.addEventListener('change', async () => {
      const k = inp.dataset.b; let val = inp.value.trim();
      if (k === 'owner_phone') { const d = val.replace(/\D/g, '').replace(/^00/, '').replace(/^966/, '').replace(/^0/, ''); val = /^5\d{8}$/.test(d) ? '966' + d : ''; }
      try { await q1(sb.from('businesses').update({ [k]: val }).eq('id', BIZ).select('id')); S.biz[k] = val; I.toast('انحفظ ✓'); if (k === 'name') shell(), go('settings'); } catch (e) { I.fail(e); }
    }));
    const setS = async (patch, msg) => { try { await q1(sb.from('settings').update(patch).eq('business_id', BIZ).select('business_id')); Object.assign(S.set, patch); I.toast(msg || 'انحفظ ✓'); return true; } catch (e) { I.fail(e); return false; } };
    v.querySelectorAll('input[name=place_mode]').forEach((x) => x.onchange = async () => { if (await setS({ place_mode: x.value })) $('onBox').hidden = x.value !== 'online'; });
    v.querySelectorAll('input[name=pay_timing]').forEach((x) => x.onchange = async () => { if (await setS({ pay_timing: x.value })) $('preBox').hidden = x.value !== 'before'; });
    v.querySelectorAll('input[name=tone]').forEach((x) => x.onchange = () => setS({ tone: x.value }, 'انحفظ ✓ والبوت يرد بالأسلوب الجديد'));
    $('onNote').onchange = (e) => setS({ online_note: e.target.value.trim().slice(0, 300) });
    $('preAmt').onchange = (e) => setS({ prepay_amount: Math.max(0, Math.min(100000, Number(e.target.value) || 0)) });
    $('holdM').onchange = (e) => setS({ hold_minutes: +e.target.value });
    $('vatP').onchange = async (e) => { try { await q1(sb.from('settings').update({ vat_percent: +e.target.value }).eq('business_id', BIZ).select('business_id')); S.set.vat_percent = +e.target.value; I.toast('انحفظ ✓'); } catch (x) { I.fail(x); } };
    v.querySelectorAll('[data-s]').forEach((sel) => sel.onchange = async () => { try { await q1(sb.from('settings').update({ [sel.dataset.s]: +sel.value }).eq('business_id', BIZ).select('business_id')); S.set[sel.dataset.s] = +sel.value; I.toast('انحفظ ✓'); } catch (e) { I.fail(e); } });
    $('notifyStaff').onchange = async (e) => { try { await q1(sb.from('settings').update({ notify_staff: e.target.checked }).eq('business_id', BIZ).select('business_id')); S.set.notify_staff = e.target.checked; I.toast('انحفظ ✓'); } catch (x) { I.fail(x); } };
    $('notifyOwner').onchange = async (e) => { try { await q1(sb.from('settings').update({ notify_owner: e.target.checked }).eq('business_id', BIZ).select('business_id')); S.set.notify_owner = e.target.checked; I.toast('انحفظ ✓'); } catch (x) { I.fail(x); } };
    $('logoF').onchange = (e) => uploadLogo(e.target.files[0]);
    if ($('paySave')) $('paySave').onclick = async (e) => { e.target.disabled = true; try { await I.api('biz/payment-keys', { business_id: BIZ, sk: $('sk').value, pk: $('pk').value }); I.toast('انربط ميسر ✓'); S.set.pay_provider = 'moyasar'; S.payStatus = null; vSettings(v); } catch (x) { I.fail(x); e.target.disabled = false; } };
    if ($('payOff')) $('payOff').onclick = async () => { if (!confirm('فك ربط ميسر؟ الفواتير بتوصل بدون رابط دفع')) return; try { await I.api('biz/payment-keys', { business_id: BIZ, clear: true }); I.toast('انفك الربط'); S.payStatus = null; vSettings(v); } catch (x) { I.fail(x); } };
    const paintEx = async () => {
      const k = S.set.export_kind, el = $('exBody');
      if (k === 'none') { el.innerHTML = '<p class="tiny">فعّل التصدير عشان كل طلب جديد وكل تحديث ينضاف لجدولكم أو نظامكم تلقائيًا.</p>'; return; }
      let secret = ''; try { secret = (await I.api('biz/export-info', { business_id: BIZ })).secret; } catch (e) { /* */ }
      el.innerHTML = `${k === 'sheet' ? `<ol class="small" style="margin:0;padding-inline-start:20px;display:grid;gap:4px"><li>افتح جدول قوقل جديد</li><li>من القائمة: الإضافات ← Apps Script، وامسح الموجود والصق الكود تحت</li><li>اضغط نشر ← نشر جديد ← تطبيق ويب، والوصول «أي شخص»</li><li>انسخ رابط تطبيق الويب والصقه هنا، ثم اضغط «جرّب»</li></ol>
        <pre class="code" id="gsCode">${esc(GS_CODE)}</pre><button class="btn sm ghost" id="gsCopy" style="justify-self:start">${icon('copy')}نسخ الكود</button>` : `<p class="tiny">نرسل POST بصيغة JSON مع كل حدث (طلب جديد، تغيير موعد، إلغاء، فاتورة، دفع). التوقيع في الترويسة x-ihj-signature (HMAC-SHA256 بالمفتاح تحت).</p><div class="copybox"><code>${esc(secret)}</code><button class="btn sm" id="secCopy" type="button">${icon('copy')}نسخ المفتاح</button></div>`}
        <label class="f"><span>${k === 'sheet' ? 'رابط تطبيق الويب' : 'رابط الـWebhook'}</span><input id="exUrl" dir="ltr" value="${esc(S.set.export_url)}" placeholder="https://"></label>
        <div class="row"><button class="btn" id="exSave">${icon('check')}حفظ</button><button class="btn ghost" id="exTest">${icon('send')}جرّب</button><span class="tiny" id="exMsg"></span></div>`;
      if ($('gsCopy')) $('gsCopy').onclick = () => I.copy(GS_CODE, 'انسخ الكود ✓');
      if ($('secCopy')) $('secCopy').onclick = () => I.copy(secret);
      $('exSave').onclick = async () => { const url = $('exUrl').value.trim(); if (url && !/^https:\/\//.test(url)) return I.toast('الرابط لازم يبدأ بـ https://', true); try { await q1(sb.from('settings').update({ export_url: url }).eq('business_id', BIZ).select('business_id')); S.set.export_url = url; I.toast('انحفظ ✓'); } catch (e) { I.fail(e); } };
      $('exTest').onclick = async (e) => { e.target.disabled = true; $('exMsg').textContent = '…'; try { const r = await I.api('biz/export-test', { business_id: BIZ }); $('exMsg').textContent = r.ok ? 'وصل ✓' : `ما وصل (${r.status || r.error || ''})`; } catch (x) { $('exMsg').textContent = I.errText(x); } e.target.disabled = false; };
    };
    v.querySelectorAll('[data-x]').forEach((btn) => btn.onclick = async () => { try { await q1(sb.from('settings').update({ export_kind: btn.dataset.x }).eq('business_id', BIZ).select('business_id')); S.set.export_kind = btn.dataset.x; v.querySelectorAll('[data-x]').forEach((x) => x.classList.toggle('on', x === btn)); paintEx(); } catch (e) { I.fail(e); } });
    paintEx();
  }
  const GS_CODE = `function doPost(e) {
  var d = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName('الطلبات') || ss.insertSheet('الطلبات');
  if (sh.getLastRow() === 0) sh.appendRow(['الحدث','رقم الطلب','الحالة','اليوم','الوقت','العميل','الجوال','المدينة','الخدمة','الموظف','السعر','الموقع','وقت الإرسال']);
  var o = d.order || {};
  sh.appendRow([d.event, o.number, o.status, o.day, o.time, o.customer_name, o.customer_phone, o.city, o.service, o.staff, o.price, o.maps_url, d.sent_at]);
  return ContentService.createTextOutput('ok');
}`;
  function uploadLogo(file) {
    if (!file) return;
    const img = new Image();
    img.onload = async () => {
      const max = 512, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s) || 256; c.height = Math.round(img.height * s) || 256;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { const r = await I.api('biz/logo', { business_id: BIZ, data_url: c.toDataURL('image/png') }); S.biz.logo_url = r.logo_url; I.toast('تغيّر الشعار ✓'); shell(); go('settings'); } catch (e) { I.fail(e); }
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => I.toast('ما قدرت أقرأ الصورة', true);
    img.src = URL.createObjectURL(file);
  }

  // ═════ البث المباشر ═════
  S.fresh = new Set();
  function live() {
    const ch = sb.channel('biz-' + BIZ)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `business_id=eq.${BIZ}` }, async (p) => {
        const o = p.new; if (!o || !o.id) return;
        const prev = (S.orders.find((y) => y.id === o.id) || {}).status;
        const isNew = p.eventType === 'INSERT' && !S.seen.has(o.id);
        S.seen.add(o.id);
        await refreshOrder(o.id);
        const x = S.orders.find((y) => y.id === o.id) || o;
        const paidNow = !isNew && prev === 'pending_payment' && x.status === 'confirmed';
        if ((isNew && x.status !== 'pending_payment') || paidNow) {
          S.fresh.add(o.id); setTimeout(() => S.fresh.delete(o.id), 4000);
          I.alertNew(`${paidNow ? 'حجز جديد مدفوع' : 'طلب جديد'} رقم ${x.number}`, `${I.when(x.slot_start)}${x.city_id ? ' · ' + cityName(x.city_id) : ''}`);
        }
        if (S.tab === 'orders') render();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'handoffs', filter: `business_id=eq.${BIZ}` }, async (p) => {
        try { S.handoffs = await q1(sb.from('handoffs').select('*, customer:customers(id,name,wa_id,is_sim,bot_paused,paused_reason)').eq('business_id', BIZ).is('resolved_at', null).order('created_at', { ascending: false })); } catch (e) { /* */ }
        paintCounts();
        if (p.eventType === 'INSERT') { const h = S.handoffs.find((x) => x.id === p.new.id); I.alertNew('عميل يحتاج رد 💬', h ? custName(h.customer) : ''); }
        if (S.tab === 'chats') render();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wa_log', filter: `business_id=eq.${BIZ}` }, (p) => { if (chatCid && p.new && p.new.customer_id === chatCid) paintConv(chatCid); })
      .subscribe((status) => { const el = $('live'); if (el) el.classList.toggle('on', status === 'SUBSCRIBED'); window.__live = status; });
    return ch;
  }

  shell();
  go(TABS.some((t) => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'orders');
  live();
  // احتياط لو انقطع البث: تحديث هادئ كل دقيقة
  setInterval(async () => { if (document.visibilityState !== 'visible') return; try { const since = new Date(Date.now() - 62 * 86400000).toISOString(); const fresh = await q1(sb.from('orders').select('*, customer:customers(id,name,wa_id,is_sim,bot_paused)').eq('business_id', BIZ).gte('slot_start', since).order('slot_start', { ascending: false }).limit(600)); const was = new Map(S.orders.map((o) => [o.id, o.status])); const added = fresh.filter((o) => (!S.seen.has(o.id) && o.status !== 'pending_payment') || (was.get(o.id) === 'pending_payment' && o.status === 'confirmed')); S.orders = fresh; fresh.forEach((o) => S.seen.add(o.id)); if (added.length) { added.forEach((o) => S.fresh.add(o.id)); I.alertNew(`طلب جديد رقم ${added[0].number}`, I.when(added[0].slot_start)); } paintCounts(); if (S.tab === 'orders') render(); } catch (e) { /* */ } }, 60000);
  window.__biz = { S, go, render };
})();
</script>
