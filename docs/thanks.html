<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6FAF8">
<title>المناوب · الدفع</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23008C62'/%3E%3Cpath d='M11.2 24.4A9 9 0 1 0 7.6 20.8L6 26z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='m12.5 16 2.5 2.5 5-5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* صفحة بعد الدفع بالبطاقة (اشتراك المحل للمناوب): تمت، أو قيد التأكيد، أو رجوع بدون دفع */
:root{--bg:#F6FAF8;--ink:#102F27;--muted:#6A8178;--green:#008C62;--line:#CFE4D9;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.8}
.box{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 26px;text-align:center;box-shadow:0 18px 44px -26px rgba(10,108,66,.35);display:grid;gap:12px;justify-items:center}
.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#E9F7EF;color:var(--green)}
.ic.wait{background:#FFF7E6;color:#B45309}
.ic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:24px;line-height:1.4}
p{margin:0;color:var(--muted);font-size:15.5px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;font-weight:600;margin-top:6px}
a:focus-visible{outline:3px solid #05AA71;outline-offset:3px}
</style>
</head>
<body>
<main class="box" id="box"></main>
<script>
(function () {
  var q = new URLSearchParams(location.search), box = document.getElementById('box');
  var OK = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>';
  var WAIT = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></svg>';
  var v = q.get('paid') ? ['', OK, 'استلمنا دفعتك ✅', 'شكرًا لك. وصلنا المبلغ وانسجل في اشتراكك.']
    : q.get('pending') ? ['wait', WAIT, 'نتأكد من الدفع', 'لو انخصم المبلغ، يتأكد خلال دقايق وينسجل لحاله.']
    : q.get('back') ? ['wait', WAIT, 'ما كمّلت الدفع', 'تقدر ترجع وتدفع متى ما تبي، الرابط صالح 3 أيام.']
    : q.get('e') === '2' ? ['wait', WAIT, 'الرابط انتهى', 'اطلب رابط جديد من المناوب.']
    : ['wait', WAIT, 'الرابط غير صالح', 'اطلب رابط جديد من المناوب.'];
  var t = q.get('t'), again = /^[0-9a-f]{32}$/.test(t || '') && (q.get('back') || q.get('pending'));
  box.innerHTML = '<span class="ic ' + v[0] + '">' + v[1] + '</span><h1>' + v[2] + '</h1><p>' + v[3] + '</p>'
    + (again ? '<a href="https://kvreqxdgjeietzsfamei.supabase.co/functions/v1/pay/sub/' + t + '">' + (q.get('back') ? 'ارجع للدفع' : 'افتح الدفع مرة ثانية') + '</a>' : '<a href="./">المناوب</a>');
})();
</script>
</body>
</html>
