<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>سير العمل · احجزلي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%234338CA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* سير العمل: المسار الحقيقي من أول تواصل لين النشاط يشتغل لحاله. خط زمني بالأيام، محاكاة يوم بيوم (أنتِ، العميل، النظام)،
   وش نبرمج في البوت ومتى، ولكل منشأة حقيقية: وين وصلت ووش الخطوة الجاية. */
body{padding:18px 16px 60px}
.wrapw{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.hd1{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hd1 h1{font-size:26px} .hd1 .sp{flex:1}
.lede{color:var(--muted);font-size:15px;max-width:70ch;margin:0}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.w-you{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.w-client{background:color-mix(in srgb,var(--gold) 28%,var(--card));color:var(--gold-ink)}
.w-system{background:color-mix(in srgb,var(--teal) 15%,var(--card));color:var(--teal)}
.w-meta{background:color-mix(in srgb,var(--info) 14%,var(--card));color:var(--info)}
.w-moyasar{background:color-mix(in srgb,var(--violet) 14%,var(--card));color:var(--violet)}
/* الخط الزمني */
.gwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;overflow-x:auto}
.gantt{display:grid;grid-template-columns:150px repeat(15,minmax(34px,1fr));gap:4px 0;min-width:720px;position:relative}
.gantt .dh{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line)}
.gantt .dh.on{color:var(--accent);font-weight:800}
.gantt .lb{font-size:13px;font-weight:600;padding:6px 6px 6px 8px;display:flex;align-items:center;gap:6px;min-width:0}
.gantt .lb i{width:9px;height:9px;border-radius:50%;flex:none}
.gantt .bar{height:26px;align-self:center;border-radius:8px;margin:0 2px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;transition:filter .15s,box-shadow .15s}
.gantt .bar.par{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.gantt .bar.now{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 70%,transparent)}
.gantt .bar.done{filter:saturate(.35) opacity(.6)}
.gantt .cur{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;transition:inset-inline-start .35s}
/* المحاكاة */
.sim{display:grid;gap:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl input[type=range]{flex:1;min-width:180px;accent-color:var(--accent)}
.daybig{font-family:var(--display);font-weight:900;font-size:22px;min-width:110px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.tcol h3{display:flex;gap:8px;align-items:center;font-size:15px}
.tcol ul{margin:0;padding-inline-start:18px;display:grid;gap:5px;font-size:14px;line-height:1.6}
.tcol .none{color:var(--muted);font-size:13.5px}
.stat{display:flex;flex-wrap:wrap;gap:6px}
.stat span{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card)}
.stat span.ok{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:var(--soft)}
.stat span.wait{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));background:color-mix(in srgb,var(--gold) 12%,var(--card))}
/* الخطوات بالتفصيل */
.steps{display:grid;gap:10px;counter-reset:s}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;counter-increment:s;scroll-margin-top:12px}
.st.now{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.st.done{opacity:.7}
.st .sthd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st .sthd::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--soft2);color:var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;flex:none}
.st.done .sthd::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
.st.now .sthd::before{background:var(--gold);color:var(--gold-ink)}
.st .sthd b{font-family:var(--display);font-size:16.5px}
.st .when{font-size:12.5px;color:var(--muted);margin-inline-start:auto;white-space:nowrap}
.st p{margin:0;font-size:14.5px;line-height:1.75}
.st .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st .g3 > div{background:var(--soft2);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.65}
.st .g3 b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.st .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.st .meta b{color:var(--fg)}
.st .risk{font-size:13.5px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:10px;padding:8px 10px}
.st .act{display:flex;flex-wrap:wrap;gap:6px}
/* برمجة البوت */
.prog{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.prog > div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.prog b{font-family:var(--display);font-size:15px} .prog span{font-size:13.5px;color:var(--muted);line-height:1.65}
.prog .tab{font-size:12px;color:var(--accent);font-weight:700}
.now-bar{background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1.5px solid var(--gold);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.now-bar b{font-family:var(--display);font-size:17px}
@media (max-width:860px){ .trio,.st .g3,.prog{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon } = I;
  I.loading('نفتح سير العمل…');
  let r;
  try { r = await I.boot('ihj-admin'); } catch (e) { return I.gate('الرابط غير صالح', 'افتح لوحتك من الرابط الخاص أول', 'err'); }
  if (!r.session || !r.me || !r.me.admin) return I.gate('افتح لوحتك أول', 'سير العمل يفتح بعد الدخول للوحتك من الرابط الخاص', 'err');
  const sb = I.sb;
  async function q1(p) { const { data, error } = await p; if (error) throw error; return data; }

  // ───── المسار الحقيقي: كل مرحلة، مين يسويها، ومتى (أيام تقريبية)، ووش يصير لحاله، ومتى تخلص ─────
  const WHO = { you: ['أنتِ', 'w-you'], client: ['العميل', 'w-client'], system: ['النظام', 'w-system'], meta: ['ميتا', 'w-meta'], moyasar: ['ميسر', 'w-moyasar'] };
  const COL = { you: 'var(--accent)', client: '#C98A00', system: 'var(--teal)', meta: 'var(--info)', moyasar: 'var(--violet)' };
  const P = [
    { k: 'lead', t: 'أول تواصل وتجربة', d: [0, 0], who: ['you', 'client'], c: 'client',
      what: 'العميل يتواصل (من الموقع أو منك)، يجرّب البوت على مجاله كأنه عميل، ويسمع العرض.',
      you: ['ترسلين له رابط «جرّبه بنفسك» على أقرب مجال لنشاطه', 'تعرفين منه: كم طلب باليوم، وين الخدمة، مين يرد الحين، والدفع كيف'],
      client: ['يجرّب المحاكي ويسأل أي سؤال'], system: ['طلب الاشتراك من الموقع يوصلك في لوحتك بصوت'],
      where: 'لوحتي ← طلبات الاشتراك', done: 'يقول «نبدأ»', risk: 'ما رد؟ تابعيه بعد يومين برسالة قصيرة، ولا تنزّلين السعر.' },
    { k: 'contract', t: 'الاتفاق والدفعة الأولى', d: [0, 1], who: ['client', 'you'], c: 'client',
      what: 'يوافق على الاتفاقية من رابطها ويحوّل نص التأسيس.',
      you: ['تحوّلين طلبه لمنشأة بضغطة (أو «منشأة جديدة»)', 'ترسلين له رابط الاتفاقية من دليل التشغيل', 'تسجلين الدفعة الأولى لما توصل'],
      client: ['يوافق من الرابط (دقيقة)', 'يحوّل نص التأسيس'], system: ['موافقته تتسجل بالاسم والجوال والوقت، وتوصلك بتنبيه'],
      where: 'لوحتي ← دليل التشغيل ← الخطوة 1', done: 'وافق + الدفعة مسجلة', risk: 'وافق وما حوّل؟ ذكّريه بلطف، والتجهيز ما يبدأ قبل الدفعة.' },
    { k: 'docs', t: 'بياناته', d: [1, 1], who: ['client', 'you'], c: 'client',
      what: 'نموذج واحد (5 دقايق): الخدمات والأسعار، الأوقات، المدن أو الفروع، الموظفين، والشعار.',
      you: ['ترسلين رابط النموذج', 'لو ما يحب النماذج: تتصلين وتعبّينه معه', 'تضغطين «طبّق بياناته» فتنبني المنشأة منها'],
      client: ['يعبّي النموذج من جواله، والمسودة تنحفظ لو طلع'], system: ['يتعرف عليه بجواله، ويوصلك تنبيه أول ما يرسل'],
      where: 'دليل التشغيل ← الخطوة 2 ← «طبّق بياناته»', done: 'انطبقت بياناته', risk: 'فرع موقعه ما انقرأ؟ النموذج يطلب منه رابط قوقل ماب، أو تحددينه على الخريطة.' },
    { k: 'build', t: 'برمجة البوت', d: [1, 2], who: ['you'], c: 'you',
      what: 'تضبطين البوت على نشاطه من لوحة المنشأة. هذي «البرمجة»: بدون كود، كلها إعدادات.',
      you: ['الخدمات والأسعار والمدة', 'الأوقات والعطل ومدة الموعد', 'المدن أو الفروع على الخريطة', 'الأسئلة والأجوبة اللي تتكرر عنده', 'الأزرار الأولى واللي تحت كل جواب', 'الأسلوب، والدفع، والتذكير'],
      client: [], system: ['البوت يشتغل بالإعدادات فورًا في المحاكي'],
      where: 'لوحة المنشأة (من دليل التشغيل ← الخطوة 3)', done: 'الخدمات والأوقات والمكان جاهزة', risk: 'نسيتي شي؟ قائمة التحقق في الخطوة 3 تبين وش ناقص.' },
    { k: 'test', t: 'تجربته باسمه', d: [2, 3], who: ['client', 'you'], c: 'client',
      what: 'يكلّم البوت في المحاكي باسم نشاطه ويحجز، ويطلب تعديلات.',
      you: ['ترسلين له رابط المحاكي الخاص بنشاطه', 'تعدّلين اللي يطلبه (رد، سعر، زر) من لوحة المنشأة'],
      client: ['يجرّب كأنه عميل ويقول وش يبي يتغيّر'], system: ['تجارب المحاكي ما تحجز مواعيد حقيقية ولا توصل الموظفين'],
      where: 'دليل التشغيل ← الخطوة 4', done: 'حجز تجريبي وراضي عن الردود', risk: 'طلب تعديلات كثيرة؟ عادي، كلها إعدادات. التعديلات الكبيرة بعرض سعر.' },
    { k: 'connect', t: 'ربط الرقم', d: [3, 4], who: ['you', 'client'], c: 'you',
      what: 'اتصال 15 دقيقة: يدخل بحسابه في فيسبوك عند مزوّد الربط ويكتب رمز التحقق، وأنتِ تكمّلين الباقي.',
      you: ['قبل الاتصال: حساب المزوّد (Dualhook أو 360dialog) جاهز', 'في الاتصال: توجّهينه، وتلصقين معرّف الرقم والمفتاح في «ربط الرقم»', 'تلصقين رابط الويبهوك ورمز التحقق عند المزوّد', 'ترسلين «السلام عليكم» للرقم من جوالك'],
      client: ['يدخل فيسبوك', 'يكتب الرمز اللي يوصل جواله', 'يضيفك مسؤول في حساب ميتا للأعمال حقه (عشان التوثيق يكون عليك)'], system: ['يفحص المفتاح، وأول رسالة حقيقية تثبت إن الاستقبال شغّال'],
      where: 'لوحتي ← المنشأة ← ربط الرقم', done: 'المفتاح شغّال + وصلت أول رسالة حقيقية', risk: 'ما وصلت الرسالة؟ غالبًا الويبهوك ما انحفظ عند المزوّد، أو ما اشتركتي في «messages».' },
    { k: 'templates', t: 'القوالب', d: [3, 4], who: ['you', 'meta'], c: 'meta',
      what: 'رسائل جاهزة توافق عليها ميتا، تخلي التذكير والفاتورة وتنبيهات المالك والموظف توصل في أي وقت.',
      you: ['بعد الربط مباشرة: «ارفع القوالب» (18 قالب)'], client: [], system: ['حالتها تتحدث لحالها كل 15 دقيقة لين تنعتمد'],
      where: 'المنشأة ← القوالب والتوثيق', done: 'التسعة العربية معتمدة', risk: 'قالب انرفض؟ يبان أحمر، وتعدّلين نصه وترفعينه باسم جديد.' },
    { k: 'meta', t: 'توثيق ميتا', d: [3, 14], par: true, who: ['you', 'meta'], c: 'meta',
      what: 'يعتمد اسم نشاطه الظاهر ويرفع حدود الإرسال. البوت يشتغل قبله.',
      you: ['بعد ما يضيفك مسؤول (في اتصال الربط): ترفعين طلب التوثيق بسجله من حساب ميتا للأعمال حقه', 'تحدّثين حالته في «القوالب والتوثيق» لين يعتمد'], client: ['يعطيك صورة السجل التجاري'], system: [],
      where: 'المنشأة ← القوالب والتوثيق', done: 'موثّق', risk: 'انرفض؟ غالبًا الاسم ما يطابق السجل حرفيًا. صححيه وأعيدي.' },
    { k: 'payment', t: 'ميسر (لباقة الدفع)', d: [1, 4], par: true, who: ['you', 'moyasar'], c: 'moyasar',
      what: 'حساب ميسر باسم منشأته عشان المبالغ تدخل حسابه مباشرة.',
      you: ['تفتحين الحساب بأوراقه (السجل، الهوية، الآيبان)', 'بعد التفعيل تلصقين المفتاحين في إعدادات لوحته'], client: ['يعطيك الأوراق، ويوافق على التحقق اللي يوصله'], system: ['يتأكد من المفتاح بدون أي عملية دفع'],
      where: 'لوحة المنشأة ← الإعدادات ← الدفع الإلكتروني', done: 'ميسر مربوط بمفتاح حقيقي', risk: 'لسا ما تفعّل؟ البوت يأكد الحجوزات بدون دفع مقدم لين يتفعّل.' },
    { k: 'live', t: 'تشغيل حقيقي', d: [4, 5], who: ['you', 'client', 'system'], c: 'system',
      what: 'يشتغل على الرقم الحقيقي. تتأكدين بطلب حقيقي من جوال أحدهم.',
      you: ['تطفين وضع الفحص', 'تتأكدين إن الرد الآلي وتنبيهات المالك شغّالة', 'تطلبين منه يحجز من جوال ثاني'], client: ['يحجز من جوال ثاني ويشوف الطلب يوصل'], system: ['يرد ويحجز ويذكّر، ويبلّغ المالك والموظف'],
      where: 'دليل التشغيل ← الخطوة 9', done: 'أول طلب حقيقي', risk: 'الرسالة ما وصلت؟ لوحته تقول السبب: الرقم ما تربط، أو القالب ما انعتمد.' },
    { k: 'handover', t: 'التسليم', d: [5, 7], who: ['you', 'client'], c: 'you',
      what: 'يستلم لوحته وروابط موظفينه، وتبدأ الفوترة الشهرية.',
      you: ['ترسلين رابط لوحته (تنفتح بدون كلمة مرور)', 'تشرحين له الطلبات والمحادثات وزر الإيقاف', 'تستلمين الدفعة الثانية وتغيّرين الحالة إلى «شغّالة»'], client: ['يفتح لوحته من الجوال والكمبيوتر', 'يرسل لكل موظف رابطه'], system: ['التجديد الشهري يظهر في لوحتك قبل موعده'],
      where: 'دليل التشغيل ← الخطوة 10', done: 'الحالة «شغّالة»', risk: '' },
    { k: 'care', t: 'المتابعة', d: [7, 14], who: ['you', 'system'], c: 'system',
      what: 'أول أسبوعين: تشوفين وش ما فهمه البوت وتضيفينه. وبعدها شهريًا.',
      you: ['تقرين المحادثات المحوّلة وتضيفين أسئلتها', 'تعدّلين الردود اللي يطلبها', 'آخر الشهر: التقرير والتجديد'], client: ['يرد على اللي تحوّل له بس'], system: ['يرد ويحجز لحاله 24 ساعة'],
      where: 'لوحة المنشأة ← المحادثات، ولوحتي ← الاشتراكات', done: 'مستمر', risk: '' },
  ];
  const MAIN = ['contract', 'docs', 'build', 'test', 'connect', 'templates', 'live', 'handover'];

  // ───── البيانات الحقيقية لوضع «منشأة» (نفس شروط دليل التشغيل) ─────
  let D = null;
  async function load() {
    const [biz, set, ch, stats, docs, pays, steps] = await Promise.all([
      q1(sb.from('businesses').select('*').order('created_at', { ascending: false })),
      q1(sb.from('settings').select('business_id,pay_provider,place_mode,notify_owner')),
      q1(sb.from('channels').select('business_id,status,dry_run,meta_verification,templates')),
      q1(sb.rpc('ihj_admin_stats')),
      q1(sb.from('client_docs').select('business_id,agreed_at,intake_applied_at')),
      q1(sb.from('sub_payments').select('business_id,kind,amount')),
      q1(sb.from('setup_steps').select('*')),
    ]);
    const by = (rows) => Object.fromEntries(rows.map((x) => [x.business_id, x]));
    D = { biz, set: by(set), ch: by(ch), st: by(stats), docs: by(docs), pays, steps };
  }
  const AR = ['ihj_reminder', 'ihj_on_the_way', 'ihj_arrived', 'ihj_invoice', 'ihj_paid', 'ihj_update', 'ihj_new_order', 'ihj_staff_order', 'ihj_handoff'];
  function statusOf(b) {
    const s = D.set[b.id] || {}, c = D.ch[b.id] || {}, st = D.st[b.id] || {}, d = D.docs[b.id] || {};
    const paid = D.pays.filter((p) => p.business_id === b.id && p.kind === 'setup').reduce((a, p) => a + Number(p.amount), 0);
    const man = (k) => D.steps.some((x) => x.business_id === b.id && x.step === k && x.done_at);
    const ar = (c.templates || []).filter((t) => t.language === 'ar' && t.status === 'APPROVED' && AR.includes(t.name)).length;
    const auto = {
      lead: true,
      contract: !!d.agreed_at && paid > 0,
      docs: !!d.intake_applied_at,
      build: st.services > 0 && st.hours > 0 && ((s.place_mode || 'visit') === 'online' || st.cities > 0),
      test: st.sim_orders > 0,
      connect: c.status === 'connected' && !!st.last_real_in,
      templates: ar >= AR.length,
      meta: c.meta_verification === 'verified',
      payment: b.plan !== 'bot_pay' || s.pay_provider === 'moyasar',
      live: c.status === 'connected' && !c.dry_run && b.bot_enabled && st.orders_total > 0,
      handover: b.status === 'live',
      care: b.status === 'live',
    };
    const done = {}; for (const k of Object.keys(auto)) done[k] = auto[k] || man(k);
    const now = MAIN.find((k) => !done[k]) || 'care';
    return { done, now, ch: c, st, s };
  }

  // ───── الواجهة ─────
  const params = new URLSearchParams(location.search);
  let mode = params.get('b') ? 'biz' : 'all', bizId = params.get('b') || '', day = 0, timer = null;
  try { await load(); } catch (e) { console.error(e); }
  const real = D ? D.biz.filter((b) => !b.is_demo) : [], demos = D ? D.biz.filter((b) => b.is_demo) : [];
  $('root').innerHTML = `<div class="wrapw">
    <div class="hd1"><a class="btn ghost sm" href="admin.html">${icon('home')}لوحتي</a><h1>سير العمل</h1><span class="sp"></span>
      <select id="who" style="max-width:300px"><option value="">المسار كامل</option>${real.length ? `<optgroup label="المنشآت">${real.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</optgroup>` : ''}${demos.length ? `<optgroup label="تجريبية">${demos.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</optgroup>` : ''}</select></div>
    <p class="lede">من أول تواصل لين النشاط يشتغل لحاله: وش يصير، مين يسويه، ومتى. الأيام تقريبية، والتوثيق وميسر يمشون بالتوازي.</p>
    <div id="nowBox"></div>
    <div class="gwrap"><div class="gantt" id="gantt"></div></div>
    <section class="sim card"><div class="ctrl"><button class="btn sm" type="button" id="play">${icon('send')}شغّل</button><span class="daybig" id="dayT"></span><input type="range" id="dayR" min="0" max="14" value="0" aria-label="اليوم"></div>
      <div class="stat" id="stat"></div>
      <div class="trio"><div class="tcol"><h3><span class="who w-you">أنتِ</span></h3><div id="cYou"></div></div><div class="tcol"><h3><span class="who w-client">العميل</span></h3><div id="cClient"></div></div><div class="tcol"><h3><span class="who w-system">يصير لحاله</span></h3><div id="cSys"></div></div></div></section>
    <h2 style="font-size:20px">الخطوات بالتفصيل</h2>
    <div class="steps" id="steps"></div>
    <h2 style="font-size:20px" id="programming">وش نبرمج في البوت ومتى</h2>
    <p class="lede">البرمجة كلها إعدادات من لوحة المنشأة، بدون كود. تصير ثلاث مرات: بعد ما توصل بياناته (اليوم 1 إلى 2)، بعد ملاحظاته على التجربة (اليوم 2 إلى 3)، وبعد التشغيل كل ما ظهر سؤال جديد.</p>
    <div class="prog" id="prog"></div>
  </div>`;

  const label = (k) => (WHO[k] || [k])[0];
  function biz() { return D && bizId ? D.biz.find((b) => b.id === bizId) : null; }
  function paintGantt() {
    const b = biz(), S = b ? statusOf(b) : null;
    let html = '<div class="dh"></div>' + Array.from({ length: 15 }, (_, i) => `<div class="dh ${i === day ? 'on' : ''}">${i === 0 ? 'اليوم 0' : i}</div>`).join('');
    P.forEach((p, idx) => {
      if (b && p.k === 'payment' && b.plan !== 'bot_pay') return;
      const cls = [p.par ? 'par' : '', S && S.done[p.k] ? 'done' : '', S && S.now === p.k ? 'now' : ''].join(' ');
      html += `<div class="lb" style="grid-row:${idx + 2}"><i style="background:${COL[p.c]}"></i>${esc(p.t)}</div>`;
      html += `<div class="bar ${cls}" data-k="${p.k}" style="grid-row:${idx + 2};grid-column:${p.d[0] + 2} / ${p.d[1] + 3};background-color:${COL[p.c]}">${p.who.map(label).join(' + ')}</div>`;
    });
    $('gantt').innerHTML = html + '<span class="cur" id="cur"></span>';
    $('gantt').querySelectorAll('[data-k]').forEach((x) => x.onclick = () => { const el = document.getElementById('st-' + x.dataset.k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    placeCur();
  }
  function placeCur() {
    const g = $('gantt'), cells = g.querySelectorAll('.dh'); const c = cells[day + 1]; const cur = $('cur');
    if (!c || !cur) return;
    const gr = g.getBoundingClientRect(), cr = c.getBoundingClientRect();
    cur.style.insetInlineStart = (gr.right - cr.right + cr.width / 2) + 'px';
  }
  function statusAt(d) {
    const s = (t, cls) => `<span class="${cls || ''}">${t}</span>`;
    return [
      d < 2 ? s('البوت: لسا يتبرمج') : d < 4 ? s('البوت: في المحاكي', 'wait') : d < 5 ? s('البوت: على الرقم بوضع الفحص', 'wait') : s('البوت: يرد على العملاء ✓', 'ok'),
      d < 3 ? s('الرقم: غير مربوط') : d < 4 ? s('الرقم: يتربط اليوم', 'wait') : s('الرقم: مربوط ويستقبل ✓', 'ok'),
      d < 4 ? s('القوالب: بعد الربط') : d < 5 ? s('القوالب: عند ميتا', 'wait') : s('القوالب: معتمدة ✓', 'ok'),
      d < 4 ? s('التوثيق: يبدأ بعد الربط') : d < 14 ? s('التوثيق: عند ميتا', 'wait') : s('التوثيق: موثّق ✓', 'ok'),
      d < 1 ? s('ميسر: بعد الأوراق') : d < 4 ? s('ميسر: يتفعّل', 'wait') : s('ميسر: مربوط ✓', 'ok'),
    ].join('');
  }
  function paintDay() {
    $('dayT').textContent = 'اليوم ' + day;
    $('dayR').value = day;
    $('stat').innerHTML = statusAt(day);
    const act = P.filter((p) => p.d[0] <= day && day <= p.d[1]);
    const list = (key) => { const items = act.flatMap((p) => (p[key] || []).map((t) => `<li>${esc(t)} <span class="tiny">· ${esc(p.t)}</span></li>`)); return items.length ? `<ul>${items.join('')}</ul>` : '<div class="none">ما عليه شي هالحين</div>'; };
    $('cYou').innerHTML = list('you'); $('cClient').innerHTML = list('client'); $('cSys').innerHTML = list('system');
    $('gantt').querySelectorAll('.dh').forEach((x, i) => x.classList.toggle('on', i - 1 === day));
    placeCur();
  }
  function paintSteps() {
    const b = biz(), S = b ? statusOf(b) : null;
    $('steps').innerHTML = P.filter((p) => !(b && p.k === 'payment' && b.plan !== 'bot_pay')).map((p) => {
      const cls = S ? (S.done[p.k] ? 'done' : S.now === p.k ? 'now' : '') : '';
      const when = p.d[0] === p.d[1] ? `اليوم ${p.d[0]}` : `اليوم ${p.d[0]} إلى ${p.d[1]}`;
      const box = (title, arr) => `<div><b>${title}</b>${arr.length ? arr.map((t) => '• ' + esc(t)).join('<br>') : '<span class="tiny">ما عليه شي</span>'}</div>`;
      return `<section class="st ${cls}" id="st-${p.k}"><div class="sthd"><b>${esc(p.t)}</b>${p.who.map((w) => `<span class="who ${WHO[w][1]}">${WHO[w][0]}</span>`).join('')}${p.par ? '<span class="who" style="background:var(--soft2)">بالتوازي</span>' : ''}<span class="when">${when}</span></div>
        <p>${esc(p.what)}</p>
        <div class="g3">${box('أنتِ', p.you)}${box('العميل', p.client)}${box('يصير لحاله', p.system)}</div>
        <div class="meta"><span>وين: <b>${esc(p.where)}</b></span><span>تخلص لما: <b>${esc(p.done)}</b></span></div>
        ${p.risk ? `<div class="risk">${esc(p.risk)}</div>` : ''}
        ${b && S && S.now === p.k ? `<div class="act"><a class="btn sm" href="admin.html#onboard/${b.id}">${icon('guide')}افتحي الخطوة في دليل التشغيل</a></div>` : ''}</section>`;
    }).join('');
  }
  function paintNow() {
    const b = biz();
    if (!b) { $('nowBox').innerHTML = ''; return; }
    const S = statusOf(b), p = P.find((x) => x.k === S.now) || P[P.length - 1];
    const par = ['meta', 'payment'].filter((k) => !(k === 'payment' && b.plan !== 'bot_pay') && !S.done[k]).map((k) => P.find((x) => x.k === k).t);
    $('nowBox').innerHTML = `<div class="now-bar"><span class="tiny">${esc(b.name)} · وين وصلنا</span><b>${S.now === 'care' ? 'شغّالة، والمتابعة مستمرة' : 'الحين: ' + esc(p.t)}</b>
      <span>${esc(p.what)}</span>${par.length ? `<span class="tiny">بالتوازي لسا: ${par.map(esc).join('، ')}</span>` : ''}
      <div class="act" style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm" href="admin.html#onboard/${b.id}">${icon('guide')}دليل التشغيل</a><a class="btn sm ghost" href="biz.html?b=${b.id}" target="_blank" rel="noopener">${icon('store')}لوحة المنشأة</a></div></div>`;
    const idx = P.findIndex((x) => x.k === S.now);
    day = idx >= 0 ? P[idx].d[0] : 14;
  }
  function paintProg() {
    const b = biz();
    const T = (tab, title, what, when) => `<div><span class="tab">${tab}</span><b>${title}</b><span>${what}</span><span class="tiny">متى: ${when}</span>${b ? `<a class="btn sm ghost" style="justify-self:start" href="biz.html?b=${b.id}#${tab === 'الخدمات والمدن' ? 'catalog' : tab === 'الأوقات والعطل' ? 'hours' : tab === 'نصوص الرد' ? 'texts' : tab === 'الموظفون' ? 'staff' : 'settings'}" target="_blank" rel="noopener">افتح</a>` : ''}</div>`;
    $('prog').innerHTML = [
      T('الخدمات والمدن', 'الخدمات والأسعار والمدة', 'كل خدمة باسمها (24 حرف) وسعرها، أو بدون سعر لو يتحدد بعد المعاينة. والمدة تحدد طول الموعد.', 'بعد بياناته، وكل ما تغيّر سعر'),
      T('الخدمات والمدن', 'المدن أو الفروع', 'عند العميل: المدن ونطاق كل وحدة على الخريطة. في المحل: كل فرع بموقعه بالضبط.', 'بعد بياناته'),
      T('الأوقات والعطل', 'الأوقات والعطل', 'دوام كل يوم، مدة الموعد، كم يوم قدام يحجز، وأقل وقت قبل الموعد. والعطل والإجازات.', 'بعد بياناته، وقبل أي إجازة'),
      T('نصوص الرد', 'الأزرار', 'أول ما يكلّمه العميل وش يطلع له (أكثر من 3 تصير قائمة)، واللي يطلع تحت كل جواب.', 'بعد بياناته، وبعد ملاحظاته على التجربة'),
      T('نصوص الرد', 'الأسئلة والأجوبة', 'الأسئلة اللي تتكرر عنده وأجوبتها، وكلمات يتعرف منها. أي سؤال تضيفينه يقدر يصير زر.', 'من ملاحظات النموذج، وبعد التشغيل من المحادثات المحوّلة'),
      T('نصوص الرد', 'الردود', 'الترحيب وطلب الموقع والتذكير والتحويل… كل رد يتعدّل بكلامه، بالعربي والإنجليزي.', 'بعد ملاحظاته على التجربة'),
      T('الإعدادات', 'طريقة الشغل والأسلوب', 'وين الخدمة، الدفع قبل أو بعد أو في المحل، مبلغ الحجز، والأسلوب ودّي أو رسمي أو مختصر.', 'بعد بياناته'),
      T('الموظفون', 'الموظفون', 'كل موظف بجواله ومدنه، والطلبات تتوزع عليهم. ولو بدون موظفين: كم عميل بنفس الوقت.', 'بعد بياناته، وكل ما تغيّر فريقه'),
      T('الإعدادات', 'التذكير والتنبيهات', 'التذكير قبل الموعد، رجوع البوت للعميل المحوّل بعد كم ساعة، وتنبيهات المالك والموظف.', 'قبل التشغيل الحقيقي'),
    ].join('');
  }
  function paintAll() { paintNow(); paintGantt(); paintDay(); paintSteps(); paintProg(); }
  $('who').value = bizId;
  $('who').onchange = (e) => { bizId = e.target.value; const u = new URL(location.href); if (bizId) u.searchParams.set('b', bizId); else u.searchParams.delete('b'); history.replaceState(null, '', u); if (!bizId) day = 0; paintAll(); };
  $('dayR').oninput = (e) => { day = +e.target.value; paintDay(); };
  $('play').onclick = () => {
    if (timer) { clearInterval(timer); timer = null; $('play').innerHTML = icon('send') + 'شغّل'; return; }
    if (day >= 14) day = 0;
    $('play').innerHTML = icon('x') + 'وقّف';
    timer = setInterval(() => { day++; paintDay(); if (day >= 14) { clearInterval(timer); timer = null; $('play').innerHTML = icon('send') + 'شغّل'; } }, 1300);
  };
  addEventListener('resize', placeCur);
  paintAll();
  window.__flow = { setDay: (d) => { day = d; paintDay(); }, pick: (id) => { $('who').value = id; $('who').onchange({ target: $('who') }); }, get day() { return day; } };
})();
</script>
</body>
</html>
