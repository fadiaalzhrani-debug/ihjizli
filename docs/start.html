<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>بيانات نشاطك · احجزلي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%234338CA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* نموذج بيانات النشاط كخطوات قصيرة (سؤال واحد بالشاشة): النشاط ← المكان ← الخدمات ← الدوام ← الدفع ← الموظفون ← الإرسال.
   يشتغل بمفتاح المنشأة (?k=) أو عام (يتعرف على العميل بجوال المالك). المسودة تنحفظ في الجهاز لحالها. */
body{padding:16px 16px 40px}
.doc{max-width:640px;margin:0 auto;display:grid;gap:12px}
.top{display:grid;gap:8px}
.top h1{font-size:22px}
.prog{display:flex;gap:4px} .prog i{flex:1;height:5px;border-radius:9px;background:var(--line)} .prog i.on{background:var(--accent)}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .step{animation:none} }
.step h2{font-size:20px}
.step .h{color:var(--muted);font-size:14px;margin-top:-6px;line-height:1.7}
.cards{display:grid;gap:8px}
.cards label{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;gap:2px;cursor:pointer}
.cards label b{font-family:var(--display);font-size:15.5px} .cards label span{font-size:13px;color:var(--muted)}
.cards label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.cards input{position:absolute;opacity:0;pointer-events:none}
.chipz{display:flex;flex-wrap:wrap;gap:6px}
.chipz label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--card)}
.chipz label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chipz input{display:none}
.region{display:grid;gap:6px} .region b{font-size:12.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr 96px 36px;gap:8px;align-items:center}
.line2{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center}
.line2 .mp{grid-column:1}
.days{display:grid;gap:6px}
.dayr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dayr.off{opacity:.55}
.dayr .t{display:flex;gap:6px;align-items:center;font-size:13.5px} .dayr input[type=time]{width:auto;padding:5px 7px;font-size:14px}
.nav{display:flex;gap:8px;align-items:center;margin-top:4px}
.nav .btn{flex:1}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
input.bad,textarea.bad{border-color:var(--bad);outline:3px solid color-mix(in srgb,var(--bad) 25%,transparent)}
.logo{display:flex;gap:12px;align-items:center}
.logo .pv{width:64px;height:64px;border-radius:16px;background:var(--soft2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;flex:none}
.logo .pv img{width:100%;height:100%;object-fit:contain;background:#fff}
details.more{border:1px dashed var(--line);border-radius:12px;padding:0 12px}
details.more summary{cursor:pointer;font-size:14px;padding:10px 0;font-weight:600;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none} details.more summary::after{content:"+"} details.more[open] summary::after{content:"−"}
details.more .g2{padding-bottom:12px}
.sum{display:grid;gap:6px;font-size:14.5px} .sum div{display:flex;gap:8px;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0} .sum b{font-family:var(--display)} .sum button{background:none;border:0;color:var(--accent);font:inherit;font-size:13.5px;cursor:pointer;padding:0}
.okbox{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card));border-radius:16px;padding:18px;display:grid;gap:6px}
.hp{position:absolute;inset-inline-start:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;border:0;padding:0}
.step{position:relative}
.saved{font-size:12.5px;color:var(--muted);text-align:center}
.import-cta.done{border-style:dashed}
.import-cta .okl{color:var(--accent);font-weight:700;font-size:13.5px}
.fr{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--accent);margin-top:-4px}
.fr button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.linkb{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;justify-self:start;display:inline-flex;gap:6px;align-items:center}
.linkb svg{width:16px;height:16px}
</style>
</head>
<body>
<main class="doc" id="doc"><div class="card" style="display:grid;place-items:center;padding:40px"><div class="spin"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script src="assets/reader.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon } = I;
  const k = new URLSearchParams(location.search).get('k') || '';
  const post = async (path, body) => { const r = await fetch(I.FN + '/api/client/' + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ k, ...body }) }); const j = await r.json().catch(() => ({})); if (!j.ok) throw Object.assign(new Error(j.error || 'err'), { code: j.error }); return j; };
  let d = { business: { name: '' }, current: {}, intake: null };
  // القراءة الذكية مفعّلة؟ (زر «عبّيها عني» يطلع بس لو مفعّلة)
  let aiOn = false; const aiP = post('ai', {}).then((r) => { aiOn = !!r.ready; }).catch(() => {});
  if (k) { try { d = await post('info', {}); } catch (e) { $('doc').innerHTML = '<div class="card" style="text-align:center;padding:30px"><h2>الرابط غير صالح</h2><p class="muted">اطلب رابط النموذج من احجزلي</p></div>'; return; } }
  const b = d.business, cur = d.current || {}, prev = d.intake || {};
  // المدن بالمناطق (الأقرب لبعض مع بعض)
  const REG = [
    ['الشرقية', [['الدمام', 26.4207, 50.0888, 20], ['الخبر', 26.2794, 50.2083, 18], ['الظهران', 26.2886, 50.114, 9], ['القطيف', 26.5196, 50.0115, 12], ['الجبيل', 27.0174, 49.6225, 20], ['الأحساء', 25.3833, 49.5867, 30], ['حفر الباطن', 28.4328, 45.9708, 20]]],
    ['الوسطى', [['الرياض', 24.7136, 46.6753, 40], ['الخرج', 24.1556, 47.312, 20], ['بريدة', 26.326, 43.975, 20], ['عنيزة', 26.0842, 43.9937, 15], ['حائل', 27.5114, 41.7208, 20]]],
    ['الغربية', [['جدة', 21.4858, 39.1925, 35], ['مكة المكرمة', 21.3891, 39.8579, 25], ['المدينة المنورة', 24.5247, 39.5692, 25], ['الطائف', 21.2703, 40.4158, 25], ['ينبع', 24.0895, 38.0618, 20]]],
    ['الشمال والجنوب', [['تبوك', 28.3835, 36.5662, 20], ['أبها', 18.2164, 42.5053, 20], ['خميس مشيط', 18.3, 42.7333, 20], ['نجران', 17.4924, 44.1277, 20], ['جازان', 16.8892, 42.5511, 20]]],
  ];
  const P = REG.flatMap((r) => r[1]);
  const WD = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const HP = [['std', 'كل يوم 9 الصبح إلى 9 الليل', (i) => ({ on: true, open: '09:00', close: '21:00' })], ['stdf', 'كل يوم 9 إلى 9، والجمعة من 4 العصر', (i) => ({ on: true, open: i === 5 ? '16:00' : '09:00', close: '21:00' })], ['work', 'الأحد إلى الخميس 8 إلى 5', (i) => ({ on: i <= 4, open: '08:00', close: '17:00' })], ['eve', 'كل يوم 4 العصر إلى 12 الليل', (i) => ({ on: true, open: '16:00', close: '00:00' })], ['custom', 'أحدد كل يوم بنفسي', null]];
  const val = (a, bb) => (a !== undefined && a !== null && a !== '') ? a : bb;
  const DKEY = 'ihj_start_' + (k || 'public');
  let draft = null; try { draft = JSON.parse(localStorage.getItem(DKEY) || 'null'); } catch (e) { /* */ }
  const src = (draft && draft.st) ? draft.st : null;
  const st = src || {
    name: val(prev.name, b.name || ''), name_en: val(prev.name_en, b.name_en || ''), activity: val(prev.activity, b.activity || ''), wa: val(prev.wa_number, b.wa_number ? I.phone(b.wa_number) : ''),
    owner: val(prev.owner_name, b.owner_name || ''), ownerp: val(prev.owner_phone, b.owner_phone ? I.phone(b.owner_phone) : ''), cr: val(prev.cr_number, b.cr_number || ''), vat: val(prev.vat_number, b.vat_number || ''), addr: val(prev.address, b.address || ''),
    place: val(prev.place_mode, cur.place_mode || ''), pay: val(prev.pay_timing, cur.pay_timing || ''), moy: prev.has_moyasar || '', notes: prev.notes || '',
    services: (prev.services && prev.services.length ? prev.services : (cur.services || [])).map((s) => ({ name: s.name, price: s.price ?? '', from: !!s.price_from, min: s.duration_min || null })),
    faq: Array.isArray(prev.faq) ? prev.faq : [], imported: '',
    cities: (prev.cities && prev.cities.length ? prev.cities : (cur.cities || [])).map((c) => ({ ...c })),
    hoursPreset: '', hours: (prev.hours && prev.hours.length ? prev.hours : (cur.hours || [])).map((h) => ({ weekday: +h.weekday, open: String(h.open).slice(0, 5), close: String(h.close).slice(0, 5) })),
    staff: (prev.staff && prev.staff.length ? prev.staff : (cur.staff || [])).map((s) => ({ name: s.name, phone: s.phone ? I.phone(s.phone) : '', cities: s.cities || [] })),
    logo: '', logo_url: prev.logo_url || b.logo_url || '',
  };
  if (!st.services.length) st.services.push({ name: '', price: '' });
  if (st.hours.length && !st.hoursPreset) st.hoursPreset = 'custom';
  let step = (draft && Number.isInteger(draft.step)) ? Math.min(draft.step, 6) : 0;
  if (!Array.isArray(st.faq)) st.faq = [];
  await aiP;
  const save = () => { try { localStorage.setItem(DKEY, JSON.stringify({ st: { ...st, logo: '' }, step, t: Date.now() })); } catch (e) { /* */ } };
  const STEPS = ['biz', 'place', 'services', 'hours', 'pay', 'staff', 'send'];
  document.title = k ? `بيانات ${b.name} · احجزلي` : 'بيانات نشاطك · احجزلي';
  $('doc').innerHTML = `<div class="top"><h1 id="ttl"></h1><div class="prog" id="prog"></div></div><div id="body"></div><div class="saved" id="savedNote"></div>`;

  function hoursFor() {
    const p = HP.find((x) => x[0] === st.hoursPreset);
    if (p && p[2]) return WD.map((_, i) => ({ weekday: i, ...p[2](i) })).filter((h) => h.on).map((h) => ({ weekday: h.weekday, open: h.open, close: h.close }));
    return st.hours;
  }
  const cityNames = () => st.cities.map((c) => c.name).filter(Boolean);
  function paint() {
    save();
    const key = STEPS[step];
    $('prog').innerHTML = STEPS.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
    const titles = { biz: k ? 'بيانات ' + esc(b.name) : 'بيانات نشاطك', place: 'وين الخدمة؟', services: 'الخدمات والأسعار', hours: 'أوقات العمل', pay: 'الدفع', staff: 'الموظفون', send: 'راجع وأرسل' };
    $('ttl').textContent = titles[key];
    let body = '';
    if (key === 'biz') body = `${aiOn ? importCard() : ''}<h2>عرّفنا على نشاطك</h2><div class="h">دقيقتين، وكل شي تقدر ترجع تعدّله.</div>
      <label class="f"><span>اسم النشاط (مثل ما يظهر لعملائك)</span><input id="name" maxlength="80" value="${esc(st.name)}" autocomplete="organization"></label>
      <label class="f"><span>وش نشاطك؟</span><input id="activity" maxlength="60" value="${esc(st.activity)}" list="acts" placeholder="صالون، صيانة، عيادة، مغسلة…"><datalist id="acts"><option>صالون أو تجميل</option><option>صيانة منزلية</option><option>عيادة أو مركز</option><option>مغسلة سيارات</option><option>تنظيف</option><option>استشارات أو تدريب</option><option>مطعم أو كافيه</option><option>تأجير</option></datalist></label>
      <div class="g2"><label class="f"><span>اسم المالك</span><input id="owner" maxlength="60" value="${esc(st.owner)}" autocomplete="name"></label><label class="f"><span>جوال المالك</span><input id="ownerp" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx" value="${esc(st.ownerp)}" autocomplete="tel"></label></div>
      <label class="f"><span>رقم واتساب النشاط (لو غير جوال المالك)</span><input id="wa" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx" value="${esc(st.wa)}"></label>
      <div class="logo"><span class="pv" id="pv">${st.logo_url ? `<img src="${esc(st.logo_url)}" alt="">` : 'الشعار'}</span><div class="stack s"><label class="btn ghost sm">${icon('plus')}ارفع الشعار<input type="file" id="logoF" accept="image/*" hidden></label><span class="tiny">اختياري، ولو ما عندك نأخذه من صورة حسابك</span></div></div>
      <details class="more"><summary>تفاصيل الفاتورة (اختياري)</summary><div class="g2"><label class="f"><span>السجل التجاري</span><input id="cr" dir="ltr" maxlength="20" value="${esc(st.cr)}"></label><label class="f"><span>الرقم الضريبي</span><input id="vat" dir="ltr" maxlength="20" value="${esc(st.vat)}"></label><label class="f" style="grid-column:1/-1"><span>العنوان في الفاتورة</span><input id="addr" maxlength="120" value="${esc(st.addr)}"></label><label class="f" style="grid-column:1/-1"><span>الاسم بالإنجليزي</span><input id="name_en" maxlength="80" dir="ltr" value="${esc(st.name_en)}"></label></div></details>`;
    else if (key === 'place') body = `<h2>وين تقدّم خدمتك؟</h2>
      <div class="cards">${[['visit', 'عند العميل', 'تروح لموقعه (صيانة، مغسلة متنقلة، تنظيف)'], ['shop', 'في محلك', 'العميل يجيك (صالون، عيادة، مطعم)'], ['online', 'أونلاين', 'بدون زيارة (استشارات، تدريب)']].map(([v, l, s]) => `<label><input type="radio" name="place" value="${v}" ${st.place === v ? 'checked' : ''}><b>${l}</b><span>${s}</span></label>`).join('')}</div>
      <div id="placeBox"></div>`;
    else if (key === 'services') body = `<h2>وش خدماتك؟</h2><div class="h">اكتب الأساسية بس، والباقي نضيفه بعدين. اترك السعر فاضي لو يتحدد بعد المعاينة.</div>${aiOn ? `<button class="linkb" type="button" data-imp>${icon('file')}عندك صورة لقائمة الأسعار؟ نعبّيها عنك</button>` : ''}<div class="stack s" id="svcs"></div><button class="btn ghost sm" type="button" id="addSvc" style="justify-self:start">${icon('plus')}خدمة ثانية</button>`;
    else if (key === 'hours') body = `<h2>متى تستقبلون؟</h2>
      <div class="cards">${HP.map(([v, l]) => `<label><input type="radio" name="hp" value="${v}" ${st.hoursPreset === v ? 'checked' : ''}><b>${l}</b></label>`).join('')}</div>
      <div class="days" id="days" ${st.hoursPreset === 'custom' ? '' : 'hidden'}></div>`;
    else if (key === 'pay') body = `<h2>متى يدفع العميل؟</h2>
      <div class="cards">${[['after', 'بعد الخدمة', 'توصله فاتورة ورابط دفع بعد ما تخلص'], ['before', 'قبل الحجز', 'يدفع برابط والموعد يتأكد بعد الدفع'], ['none', 'في المحل', 'كاش أو شبكة، بدون دفع بالواتساب']].map(([v, l, s]) => `<label><input type="radio" name="pay" value="${v}" ${st.pay === v ? 'checked' : ''}><b>${l}</b><span>${s}</span></label>`).join('')}</div>
      <div id="moyBox" ${st.pay && st.pay !== 'none' ? '' : 'hidden'}><label class="f"><span>عندك حساب في بوابة الدفع (ميسر)؟</span><select id="moy"><option value="">اختر</option><option value="yes" ${st.moy === 'yes' ? 'selected' : ''}>نعم</option><option value="no" ${st.moy === 'no' ? 'selected' : ''}>لا، افتحوه لي</option><option value="later" ${st.moy === 'later' ? 'selected' : ''}>بعدين</option></select></label></div>`;
    else if (key === 'staff') body = `<h2>مين ينفّذ الطلبات؟</h2><div class="h">${st.place === 'visit' ? 'كل موظف يوصله طلبه بالواتساب، ويكون له رابط بسيط. تقدر تتركها فاضية لو أنت اللي تنفّذ.' : 'اختياري: لو عندك موظفين يستلمون الطلبات. وإلا اتركها.'}</div><div class="stack s" id="staff"></div><button class="btn ghost sm" type="button" id="addStf" style="justify-self:start">${icon('plus')}موظف</button>
      <label class="f"><span>أي شي ثاني تبينا نعرفه؟ (اختياري)</span><textarea id="notes" rows="3" maxlength="1000" placeholder="أسئلة يسألونها عملاؤك كثير وأجوبتها، أو أي ملاحظة">${esc(st.notes)}</textarea></label>`;
    else body = `<h2>كل شي تمام؟</h2><div class="sum">${summary()}</div><input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="sendBox"><button class="btn lg block" id="go" type="button">${icon('send')}أرسل البيانات</button></div>`;
    $('body').innerHTML = `<section class="step">${body}<div class="err" id="err" hidden></div><div class="nav">${step ? `<button class="btn ghost" type="button" id="back">رجوع</button>` : ''}${key === 'send' ? '' : `<button class="btn" type="button" id="next">التالي</button>`}</div></section>`;
    bind(key);
    window.scrollTo({ top: 0 });
    $('savedNote').textContent = 'مسودتك محفوظة في جهازك، تقدر ترجع تكمّل في أي وقت';
  }
  // «عبّيها عني»: صورة قائمة الأسعار أو رابط الموقع ← نعبّي الاسم والخدمات والأوقات والمكان، وهو يراجعها خطوة خطوة
  function importCard() {
    return st.imported ? `<div class="import-cta done"><div class="grow"><span class="okl">✓ عبّينا من القائمة: ${esc(st.imported)}</span><span class="tiny">راجعها خطوة خطوة، وعدّل أي شي.</span></div><button class="btn ghost sm" type="button" data-imp>${icon('file')}صورة ثانية</button></div>`
      : `<div class="import-cta"><div class="grow"><b>عندك قائمة أسعار أو موقع؟</b><span class="tiny">صوّرها أو حط رابط موقعك، ونعبّي أغلب النموذج عنك.</span></div><button class="btn" type="button" data-imp>${icon('file')}عبّيها عني</button></div>`;
  }
  const nkey = (s) => String(s || '').replace(/[\s\u0640]+/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
  async function importNow() {
    const key = STEPS[step]; read[key]();
    const r = await I.reader({ send: (p) => post('extract', p), intro: 'صورة قائمة أسعارك أو المنيو، أو رابط موقعك، أو الأسعار لو عندك كرسالة. نقرأها ونعبّي النموذج، وأنت تراجعه.' });
    if (!r || !r.data) return;
    const x = r.data;
    if (x.name && !st.name.trim()) st.name = x.name;
    if (x.name_en && !st.name_en) st.name_en = x.name_en;
    if (x.activity && !st.activity.trim()) st.activity = x.activity;
    if (x.place_mode && !st.place) st.place = x.place_mode;
    if (x.services.length) {
      const list = st.services.filter((s) => String(s.name).trim());
      for (const s of x.services) { const row = { name: s.name, price: s.price ?? '', from: !!s.price_from, min: s.duration_min || null }; const i = list.findIndex((y) => nkey(y.name) === nkey(s.name)); if (i >= 0) list[i] = row; else list.push(row); }
      st.services = list;
    }
    if (x.hours.length) { st.hoursPreset = 'custom'; st.hours = x.hours.map((h) => ({ weekday: h.weekday, open: h.open, close: h.close })); }
    if (st.place === 'visit') for (const n of x.cities) { const p = I.cityPreset(n); if (p && !st.cities.some((c) => c.name === p.name)) st.cities.push(p); }
    if (st.place === 'shop' && x.branches.length) { const list = st.cities.filter((c) => String(c.name || '').trim()); for (const b of x.branches) if (!list.some((c) => nkey(c.name) === nkey(b.name))) list.push({ name: b.name, maps: b.maps || '' }); st.cities = list; }
    if (x.faq.length) st.faq = x.faq;
    if (x.notes && !String(st.notes).includes(x.notes)) st.notes = [st.notes, x.notes].filter(Boolean).join('\n').slice(0, 1000);
    const wa = x.phones.find((p) => okPhone(p)); if (wa && !st.wa && wa !== st.ownerp) st.wa = wa;
    st.imported = I.extractSummary(x) || 'بياناتك';
    I.closeAll(); paint();
    I.toast('عبّينا ' + st.imported + ' ✓ راجعها خطوة خطوة');
  }
  function summary() {
    const row = (l, v, i) => `<div><span>${l}</span><span style="text-align:end"><b>${esc(v || 'غير محدد')}</b> <button type="button" data-go="${i}">عدّل</button></span></div>`;
    const place = { visit: 'عند العميل', shop: 'في محلك', online: 'أونلاين' }[st.place];
    const pay = { after: 'بعد الخدمة', before: 'قبل الحجز', none: 'في المحل' }[st.pay];
    const hp = HP.find((x) => x[0] === st.hoursPreset);
    return row('النشاط', `${st.name}${st.activity ? ' · ' + st.activity : ''}`, 0) + row('المكان', place + (st.place === 'visit' && cityNames().length ? ' · ' + cityNames().join('، ') : st.place === 'shop' ? ' · ' + (cityNames().join('، ') || 'فرع واحد') : ''), 1)
      + row('الخدمات', st.services.filter((s) => s.name.trim()).map((s) => s.name + (s.price !== '' ? ' ' + (s.from ? 'من ' : '') + s.price : '')).join('، '), 2) + row('الدوام', hp ? (hp[0] === 'custom' ? st.hours.length + ' أيام' : hp[1]) : '', 3) + row('الدفع', pay, 4) + row('الموظفون', st.staff.filter((s) => s.name.trim()).map((s) => s.name).join('، ') || 'أنت', 5);
  }
  const read = {
    biz() { for (const id of ['name', 'activity', 'owner', 'ownerp', 'wa', 'cr', 'vat', 'addr', 'name_en']) if ($(id)) st[id] = $(id).value.trim(); },
    place() { st.place = (document.querySelector('input[name=place]:checked') || {}).value || st.place; },
    hours() { st.hoursPreset = (document.querySelector('input[name=hp]:checked') || {}).value || st.hoursPreset; },
    pay() { st.pay = (document.querySelector('input[name=pay]:checked') || {}).value || st.pay; if ($('moy')) st.moy = $('moy').value; },
    staff() { if ($('notes')) st.notes = $('notes').value.trim(); },
    services() {}, send() {},
  };
  const okPhone = (p) => /^(\+?966|0)?5\d{8}$/.test(String(p).replace(/\D/g, '').replace(/^00/, '+'));
  function validate(key) {
    const bad = (id, msg) => { const el = $(id); if (el) { el.classList.add('bad'); el.focus(); el.scrollIntoView({ block: 'center' }); } return msg; };
    if (key === 'biz') { if (st.name.length < 2) return bad('name', 'اكتب اسم النشاط'); if (!k && !okPhone(st.ownerp)) return bad('ownerp', 'اكتب جوال المالك (اللي تواصلنا منه)'); if (st.ownerp && !okPhone(st.ownerp)) return bad('ownerp', 'اكتب جوال صحيح'); }
    if (key === 'place') { if (!st.place) return 'اختر وين تقدّم خدمتك'; if (st.place === 'shop' && !st.cities.some((c) => String(c.name || '').trim())) return 'اكتب اسم فرع واحد على الأقل'; }
    if (key === 'services' && !st.services.some((s) => String(s.name).trim())) return bad('sv0', 'اكتب خدمة وحدة على الأقل');
    if (key === 'hours') { if (!st.hoursPreset) return 'اختر أوقات العمل'; if (st.hoursPreset === 'custom' && !st.hours.length) return 'فعّل يوم واحد على الأقل'; }
    if (key === 'pay' && !st.pay) return 'اختر متى يدفع العميل';
    return '';
  }
  function bind(key) {
    document.querySelectorAll('[data-go]').forEach((x) => x.onclick = () => { step = +x.dataset.go; paint(); });
    document.querySelectorAll('[data-imp]').forEach((x) => x.onclick = importNow);
    if ($('back')) $('back').onclick = () => { read[key](); step--; paint(); };
    if ($('next')) $('next').onclick = () => { read[key](); const e = validate(key); if (e) { $('err').textContent = e; $('err').hidden = false; return; } step++; paint(); };
    $('body').querySelectorAll('input,textarea,select').forEach((x) => x.addEventListener('input', () => { x.classList.remove('bad'); $('err').hidden = true; }));
    if (key === 'biz' && $('logoF')) $('logoF').onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const img = new Image();
      img.onload = () => { const s = Math.min(1, 512 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s) || 256; c.height = Math.round(img.height * s) || 256; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); st.logo = c.toDataURL('image/png'); st.logo_url = ''; $('pv').innerHTML = `<img src="${st.logo}" alt="">`; };
      img.src = URL.createObjectURL(file);
    };
    if (key === 'place') { paintPlace(); document.querySelectorAll('input[name=place]').forEach((x) => x.onchange = () => { st.place = x.value; st.cities = []; paintPlace(); }); }
    if (key === 'services') { paintSvcs(); $('addSvc').onclick = () => { st.services.push({ name: '', price: '' }); paintSvcs(); const last = $('svcs').querySelector('.line:last-child input'); if (last) last.focus(); }; }
    if (key === 'hours') { paintDays(); document.querySelectorAll('input[name=hp]').forEach((x) => x.onchange = () => { st.hoursPreset = x.value; $('days').hidden = x.value !== 'custom'; if (x.value === 'custom' && !st.hours.length) st.hours = WD.map((_, i) => ({ weekday: i, open: '09:00', close: '21:00' })).filter((h) => h.weekday !== 5); paintDays(); }); }
    if (key === 'pay') document.querySelectorAll('input[name=pay]').forEach((x) => x.onchange = () => { st.pay = x.value; $('moyBox').hidden = x.value === 'none'; });
    if (key === 'staff') { paintStaff(); $('addStf').onclick = () => { st.staff.push({ name: '', phone: '', cities: cityNames() }); paintStaff(); }; }
    if (key === 'send') $('go').onclick = send;
  }
  function paintPlace() {
    const box = $('placeBox'); if (!box) return;
    if (!st.place) { box.innerHTML = ''; return; }
    if (st.place === 'online') { box.innerHTML = '<p class="tiny">ما يحتاج مكان. رابط الجلسة يوصل العميل قبل موعده.</p>'; return; }
    if (st.place === 'visit') {
      const chosen = cityNames();
      box.innerHTML = `<div class="h" style="margin-top:4px">المدن اللي تغطيها:</div>${REG.map(([r, cs]) => `<div class="region"><b>${r}</b><div class="chipz">${cs.map((c) => `<label><input type="checkbox" data-city="${c[0]}" ${chosen.includes(c[0]) ? 'checked' : ''}>${c[0]}</label>`).join('')}</div></div>`).join('')}`;
      box.querySelectorAll('[data-city]').forEach((x) => x.onchange = () => { const p = P.find((c) => c[0] === x.dataset.city); if (x.checked) st.cities.push({ name: p[0], lat: p[1], lng: p[2], radius_km: p[3] }); else st.cities = st.cities.filter((c) => c.name !== p[0]); save(); });
      return;
    }
    if (!st.cities.length) st.cities.push({ name: '', maps: '' });
    box.innerHTML = `<div class="h" style="margin-top:4px">فروعك: الاسم ورابط موقعه من قوقل ماب (شارك ← نسخ الرابط).</div><div class="stack s">${st.cities.map((c, i) => `<div class="line2"><input data-bi="${i}" data-k="name" placeholder="${st.cities.length > 1 ? 'مثل: فرع العليا' : 'اسم الفرع أو الحي'}" maxlength="40" value="${esc(c.name || '')}"><button class="ib" type="button" data-rb="${i}" ${st.cities.length > 1 ? '' : 'hidden'}>${icon('x')}</button><input class="mp" data-bi="${i}" data-k="maps" dir="ltr" placeholder="https://maps.app.goo.gl/…" value="${esc(c.maps || (c.lat ? `https://maps.google.com/?q=${c.lat},${c.lng}` : ''))}"></div>`).join('')}</div><button class="btn ghost sm" type="button" id="addBr" style="justify-self:start;margin-top:8px">${icon('plus')}فرع ثاني</button>`;
    box.querySelectorAll('[data-bi]').forEach((x) => x.oninput = () => { const c = st.cities[+x.dataset.bi]; c[x.dataset.k] = x.value; if (x.dataset.k === 'maps') { delete c.lat; delete c.lng; } save(); });
    box.querySelectorAll('[data-rb]').forEach((x) => x.onclick = () => { st.cities.splice(+x.dataset.rb, 1); paintPlace(); });
    $('addBr').onclick = () => { st.cities.push({ name: '', maps: '' }); paintPlace(); };
  }
  function paintSvcs() {
    $('svcs').innerHTML = st.services.map((s, i) => `<div class="line"><input id="sv${i}" data-si="${i}" data-k="name" placeholder="اسم الخدمة" maxlength="24" value="${esc(s.name)}"><input data-si="${i}" data-k="price" type="number" min="0" inputmode="decimal" placeholder="السعر" value="${esc(s.price)}"><button class="ib" type="button" data-rs="${i}" ${st.services.length > 1 ? '' : 'hidden'}>${icon('x')}</button>${s.from && s.price !== '' ? `<span class="fr">السعر يبدأ من ${esc(s.price)} <button type="button" data-nf="${i}">خله ثابت</button></span>` : ''}</div>`).join('');
    $('svcs').querySelectorAll('[data-nf]').forEach((x) => x.onclick = () => { st.services[+x.dataset.nf].from = false; paintSvcs(); });
    $('svcs').querySelectorAll('[data-si]').forEach((x) => x.oninput = () => { st.services[+x.dataset.si][x.dataset.k] = x.value; save(); });
    $('svcs').querySelectorAll('[data-rs]').forEach((x) => x.onclick = () => { st.services.splice(+x.dataset.rs, 1); paintSvcs(); });
  }
  function paintDays() {
    const el = $('days'); if (!el) return;
    el.innerHTML = WD.map((n, i) => { const h = st.hours.find((x) => x.weekday === i); return `<div class="dayr ${h ? '' : 'off'}"><label class="sw"><input type="checkbox" data-d="${i}" ${h ? 'checked' : ''}><i></i><span>${n}</span></label><span class="t"><input type="time" data-o="${i}" value="${h ? h.open : '09:00'}" ${h ? '' : 'disabled'}><span>إلى</span><input type="time" data-c="${i}" value="${h ? h.close : '21:00'}" ${h ? '' : 'disabled'}></span></div>`; }).join('');
    el.querySelectorAll('[data-d]').forEach((x) => x.onchange = () => { const i = +x.dataset.d; if (x.checked) st.hours.push({ weekday: i, open: '09:00', close: '21:00' }); else st.hours = st.hours.filter((h) => h.weekday !== i); st.hours.sort((a, b2) => a.weekday - b2.weekday); paintDays(); });
    el.querySelectorAll('[data-o]').forEach((x) => x.onchange = () => { const h = st.hours.find((y) => y.weekday === +x.dataset.o); if (h) h.open = x.value; save(); });
    el.querySelectorAll('[data-c]').forEach((x) => x.onchange = () => { const h = st.hours.find((y) => y.weekday === +x.dataset.c); if (h) h.close = x.value; save(); });
  }
  function paintStaff() {
    const names = cityNames();
    $('staff').innerHTML = st.staff.map((s, i) => `<div class="card flat stack s"><div class="line2"><input data-ti="${i}" data-k="name" placeholder="اسم الموظف" maxlength="40" value="${esc(s.name)}"><button class="ib" type="button" data-rt="${i}">${icon('x')}</button><input class="mp" data-ti="${i}" data-k="phone" dir="ltr" inputmode="tel" placeholder="جواله 05xxxxxxxx" value="${esc(s.phone || '')}"></div>${names.length > 1 ? `<div class="chipz">${names.map((n) => `<label><input type="checkbox" data-sc="${i}" value="${esc(n)}" ${(s.cities || []).includes(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div>` : ''}</div>`).join('') || '<p class="tiny">ما فيه موظفين، الطلبات توصلك أنت.</p>';
    $('staff').querySelectorAll('[data-ti]').forEach((x) => x.oninput = () => { st.staff[+x.dataset.ti][x.dataset.k] = x.value; save(); });
    $('staff').querySelectorAll('[data-rt]').forEach((x) => x.onclick = () => { st.staff.splice(+x.dataset.rt, 1); paintStaff(); });
    $('staff').querySelectorAll('[data-sc]').forEach((x) => x.onchange = () => { const s = st.staff[+x.dataset.sc]; s.cities = x.checked ? [...new Set([...(s.cities || []), x.value])] : (s.cities || []).filter((c) => c !== x.value); save(); });
  }
  async function send(e) {
    const data = {
      name: st.name, name_en: st.name_en, activity: st.activity, wa_number: st.wa || st.ownerp, owner_name: st.owner, owner_phone: st.ownerp, cr_number: st.cr, vat_number: st.vat, address: st.addr,
      place_mode: st.place, pay_timing: st.pay, has_moyasar: st.pay === 'none' ? '' : st.moy, notes: st.notes,
      services: st.services.filter((s) => String(s.name).trim()).map((s) => ({ name: s.name.trim(), price: s.price, price_from: !!s.from && s.price !== '', duration_min: s.min || null })), faq: st.faq,
      cities: st.place === 'online' ? [] : st.cities.filter((c) => String(c.name || '').trim()),
      hours: hoursFor(), staff: st.staff.filter((s) => String(s.name).trim()),
      logo: st.logo || undefined, logo_url: st.logo ? undefined : st.logo_url,
    };
    e.target.disabled = true; $('err').hidden = true;
    try {
      const r = k ? await post('intake', { data }) : await post('intake-new', { data, website: $('hp').value });
      if (r.bad_locations && r.bad_locations.length) { $('err').textContent = `ما قدرنا نقرأ موقع «${r.bad_locations.join('، ')}». ارجع للمكان والصق رابط الموقع من قوقل ماب (شارك ← نسخ الرابط).`; $('err').hidden = false; e.target.disabled = false; return; }
      try { localStorage.removeItem(DKEY); } catch (x) { /* */ }
      $('sendBox').innerHTML = '<div class="okbox"><h3>وصلتنا بياناتك ✅</h3><span>نجهّز الرد الآلي باسمك ونرسل لك تجربة تعدّل عليها. لو تبي تغيّر شي، ارجع للخطوة وأرسل مرة ثانية.</span></div>';
      $('savedNote').textContent = '';
    } catch (x) { $('err').textContent = x.code === 'too_big' ? 'الشعار كبير، اختر صورة أصغر' : x.code === 'phone' ? 'اكتب جوال المالك' : 'ما انرسلت، جرّب مرة ثانية'; $('err').hidden = false; e.target.disabled = false; }
  }
  paint();
  window.__start = { st, get step() { return step; }, go: (i) => { step = i; paint(); } };
})();
</script>
</body>
</html>
