<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الفاتورة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%230B7A55'/%3E%3Cpath d='M11 11h10M11 16h10M11 21h6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* صفحة الفاتورة والدفع للعميل (من زر «ادفع الحين» أو رمز QR في الفاتورة) */
body{min-height:100vh;display:grid;place-items:start center;padding:24px 16px 40px;background:var(--bg)}
.pay{width:min(460px,100%);display:grid;gap:14px}
.head{display:flex;gap:12px;align-items:center}
.head .lg{width:52px;height:52px;border-radius:14px;background:var(--brand,#0B7A55);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px;overflow:hidden;flex:none}
.head .lg img{width:100%;height:100%;object-fit:cover;background:#fff}
.head b{font-family:var(--display);font-size:19px;display:block}
.inv{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.inv .top{background:var(--brand,#0B7A55);color:#fff;padding:18px 20px;display:grid;gap:2px;position:static;border:0;min-height:0;backdrop-filter:none}
.inv .top span{opacity:.85;font-size:13.5px} .inv .top strong{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1.2}
.inv .body{padding:16px 20px;display:grid;gap:8px}
.li{display:flex;gap:10px;font-size:14.5px} .li span:first-child{flex:1} .li .q{color:var(--muted)}
.tot{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:4px}
.tot .li b{font-family:var(--display);font-size:17px}
.methods{display:grid;gap:8px}
.mth{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.mth.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.mth .lgo{min-width:54px;padding:0 7px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;font-family:Arial,sans-serif;flex:none}
.mth input{margin-inline-start:auto}
.paid{display:grid;justify-items:center;gap:8px;text-align:center;padding:26px 16px}
.paid .ok{width:74px;height:74px;border-radius:50%;background:color-mix(in srgb,var(--accent) 15%,var(--card));color:var(--accent);display:grid;place-items:center}
.paid .ok svg{width:40px;height:40px}
.demo{font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="pay" id="root"><div class="card" style="display:grid;place-items:center;padding:40px"><div class="spin"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, icon, money } = I;
  const q = new URLSearchParams(location.search);
  const T = q.get('t') || '';
  const root = $('root');
  const err = (t, m) => { root.innerHTML = `<div class="card" style="text-align:center;display:grid;gap:8px;padding:30px"><h2>${esc(t)}</h2><p class="muted">${esc(m)}</p></div>`; };
  if (q.get('e') || !/^[0-9a-f]{32}$/.test(T)) return err('الرابط غير صالح', 'تأكد من الرابط اللي وصلك على الواتساب');
  async function info() {
    const r = await fetch(I.FN + '/pay/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: T }) });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.error || 'err');
    return j;
  }
  let d;
  try { d = await info(); } catch (e) { return err('الفاتورة غير موجودة', 'تأكد من الرابط اللي وصلك على الواتساب'); }
  const b = d.business || {}, inv = d.invoice;
  document.documentElement.style.setProperty('--brand', b.brand_color || '#0B7A55');
  document.title = `فاتورة ${inv.number} · ${b.name}`;
  const head = `<div class="head"><span class="lg">${b.logo_url ? `<img src="${esc(b.logo_url)}" alt="">` : esc((b.name || '؟').slice(0, 1))}</span><div><b>${esc(b.name)}</b><span class="tiny">فاتورة رقم ${inv.number} · طلب رقم ${inv.order}</span></div></div>`;
  const lines = `<div class="body">${(inv.items || []).map((it) => `<div class="li"><span>${esc(it.name)}</span><span class="q">${it.qty} ×</span><span class="num">${money(it.price)}</span></div>`).join('')}
    <div class="tot">${Number(inv.vat) > 0 ? `<div class="li"><span>قبل الضريبة</span><span class="num">${money(inv.subtotal)}</span></div><div class="li"><span>الضريبة ${Number(inv.vat_percent)}%</span><span class="num">${money(inv.vat)}</span></div>` : ''}<div class="li"><b>الإجمالي</b><b class="num">${money(inv.total)} ر.س</b></div></div></div>`;
  const pdf = inv.pdf_url ? `<a class="btn ghost block" href="${esc(inv.pdf_url)}" target="_blank" rel="noopener">${icon('file')}الفاتورة PDF</a>` : '';
  if (inv.status === 'paid') {
    root.innerHTML = `${head}<div class="inv"><div class="paid"><span class="ok">${icon('check')}</span><h2>تم الدفع</h2><p class="muted">${esc(inv.paid_method || '')} · ${money(inv.total)} ر.س</p><p class="small">شكرًا لك 🌷</p></div>${lines}</div>${pdf}`;
    return;
  }
  if (inv.status === 'void') return inv.expired ? err('انتهت مهلة الدفع', 'الموعد رجع متاح، وتقدر تحجز من جديد من الواتساب') : inv.order_cancelled ? err('الطلب ملغي', 'تقدر تحجز من جديد من الواتساب') : err('الفاتورة ملغية', 'وصلتك فاتورة أحدث على الواتساب');
  if (inv.provider === 'moyasar' && inv.pay_url) {
    root.innerHTML = `${head}<div class="inv"><div class="top"><span>المبلغ المطلوب</span><strong>${money(inv.total)} ر.س</strong></div>${lines}</div><a class="btn lg block" href="${esc(inv.pay_url)}">${icon('money')}ادفع الحين</a><p class="demo">مدى · أبل باي · البطاقة</p>${pdf}`;
    return;
  }
  if (inv.provider === 'demo') {
    const M = [['mada', 'مدى', '<span class="lgo" style="background:#1D3D7E;color:#fff">mada</span>'], ['applepay', 'أبل باي', '<span class="lgo" style="background:#000;color:#fff">Apple Pay</span>'], ['card', 'بطاقة ائتمانية', '<span class="lgo" style="background:#F3F4F6;color:#1A1F71;border:1px solid var(--line)">VISA</span>']];
    root.innerHTML = `${head}<div class="inv"><div class="top"><span>المبلغ المطلوب</span><strong>${money(inv.total)} ر.س</strong></div>${lines}</div>
      <div class="methods">${M.map(([k, l, lg], i) => `<label class="mth ${i === 0 ? 'on' : ''}">${lg}<span>${l}</span><input type="radio" name="m" value="${k}" ${i === 0 ? 'checked' : ''}></label>`).join('')}</div>
      <button class="btn lg block" id="payBtn">${icon('check')}ادفع ${money(inv.total)} ر.س</button><p class="demo">صفحة دفع تجريبية، ما فيها خصم فلوس حقيقي</p>${pdf}`;
    root.querySelectorAll('.mth').forEach((l) => l.onclick = () => root.querySelectorAll('.mth').forEach((x) => x.classList.toggle('on', x === l)));
    $('payBtn').onclick = async (e) => {
      e.target.disabled = true; e.target.innerHTML = '<span class="spin" style="width:20px;height:20px;border-width:2px"></span>';
      const m = (root.querySelector('input[name=m]:checked') || {}).value || 'mada';
      try {
        const r = await fetch(I.FN + '/pay/demo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: T, method: m }) });
        const j = await r.json(); if (!j.ok) throw new Error(j.error);
        location.replace(location.pathname + '?t=' + T + '&paid=1');
      } catch (x) { e.target.disabled = false; e.target.textContent = 'جرّب مرة ثانية'; }
    };
    return;
  }
  root.innerHTML = `${head}<div class="inv"><div class="top"><span>الإجمالي</span><strong>${money(inv.total)} ر.س</strong></div>${lines}</div>${pdf}`;
})();
</script>
</body>
</html>
