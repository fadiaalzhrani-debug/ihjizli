<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الدفعة الأولى · المناوب</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z' fill='%234338CA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/ihj.css">
<style>
/* الدفعة الأولى: المبلغ، وخانة صح «أوافق على الاتفاقية» (والاتفاقية داخلها)، وبعد الموافقة تطلع بيانات التحويل وزر «حوّلت».
   بمفتاح المنشأة (?k=) أو عام لأي عميل يختار باقته. الموافقة تتسجل بالاسم والجوال والوقت. */
body{padding:22px 16px 60px}
.doc{max-width:620px;margin:0 auto;display:grid;gap:14px}
.paper{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:grid;gap:14px;box-shadow:var(--shadow);position:relative}
.paper h1{font-size:25px;margin:0}
.who{font-size:15px;color:var(--muted)} .who b{color:var(--fg);font-family:var(--display)}
.amount{display:grid;gap:4px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:16px;padding:16px 18px}
.amount .lbl{font-size:13.5px;font-weight:700;color:var(--accent)}
.amount .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1}
.amount .big small{font-size:17px;color:var(--muted);font-weight:700}
.amount .tiny{line-height:1.7}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk label{position:relative;display:grid;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card)}
.pk label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk b{font-family:var(--display);font-size:15px} .pk span{font-size:13px;color:var(--muted)}
.agree{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:8px;transition:border-color .15s,background .15s}
.agree.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--card))}
.agree .tick{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15.5px;cursor:pointer}
.agree .tick input{width:22px;height:22px;flex:none;margin:0}
.agree details summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:700;list-style:none}
.agree details summary::-webkit-details-marker{display:none}
.agree details[open] summary{margin-bottom:8px}
ol.terms{margin:0;padding-inline-start:22px;display:grid;gap:8px;line-height:1.8;font-size:14px}
ol.terms b{font-family:var(--display)}
.done-line{font-size:13px;color:var(--muted)}
.bank{display:grid}
.bank .r{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:10px 0}
.bank .r:last-child{border-bottom:0}
.bank .r span{color:var(--muted);font-size:13px;min-width:92px}
.bank .r b{flex:1;font-family:var(--display);font-size:16px;word-break:break-all}
.bank .r b.ltr{direction:ltr;text-align:end;letter-spacing:.5px}
.okbox{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card));border-radius:16px;padding:16px 18px;display:grid;gap:6px}
.okbox h3{margin:0}
.msg{font-size:13.5px;font-weight:600;color:var(--bad)}
.hp{position:absolute;inset-inline-start:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;border:0;padding:0}
@media (max-width:600px){ .pk{grid-template-columns:1fr} .paper{padding:18px} .amount .big{font-size:34px} }
</style>
</head>
<body>
<main class="doc" id="doc"><div class="card" style="display:grid;place-items:center;padding:40px"><div class="spin"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/ihj.js"></script>
<script>
(async function () {
  const I = window.IHJ, { $, esc, money, icon } = I;
  const k = new URLSearchParams(location.search).get('k') || '';
  const post = async (path, body) => { const r = await fetch(I.FN + '/api/client/' + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ k, ...body }) }); const j = await r.json().catch(() => ({})); if (!j.ok) throw Object.assign(new Error(j.error || 'err'), { code: j.error }); return j; };
  const PLAN = { bot: 'أتمتة الحجز', bot_pay: 'أتمتة الحجز + الدفع' };
  const terms = (plan, app) => `<ol class="terms">
    <li><b>الخدمة:</b> أتمتة طلبات الواتساب على رقم العميل حسب الباقة: الرد على الرسائل، الحجز والتعديل والإلغاء، التذكير، تنبيه العميل والموظف${plan === 'bot_pay' ? '، الفاتورة ورابط الدفع وتأكيد الدفع' : ''}، مع لوحة الطلبات ولوحة الموظفين.</li>
    <li><b>الدفع:</b> التأسيس على دفعتين: النص عند الموافقة على هذه الاتفاقية، والنص الثاني عند التسليم. الاشتراك الشهري يبدأ من يوم التشغيل ويُدفع مقدمًا كل شهر. الأسعار قبل الضريبة.</li>
    <li><b>التجهيز:</b> خلال 7 أيام عمل من اكتمال المتطلبات: السجل التجاري، رقم الواتساب، الشعار والخدمات والأوقات${plan === 'bot_pay' ? '، وحساب بوابة الدفع' : ''}. توثيق النشاط عند ميتا ومدته يرجعان لميتا.</li>
    <li><b>رسوم أطراف أخرى:</b> على العميل: رسوم رسائل ميتا، ومزوّد الربط (نحو 45 ريال شهريًا)${plan === 'bot_pay' ? '، ونسبة بوابة الدفع' : ''}${app ? '، وحسابات متاجر التطبيقات' : ''}.</li>
    <li><b>البيانات:</b> بيانات العميل وعملاؤه ملكه، ويستلم نسخة منها متى ما طلب.</li>
    <li><b>التعديلات:</b> تعديل النصوص والأسئلة والخدمات والأوقات ضمن الاشتراك الشهري، والإضافات الكبيرة بعرض سعر منفصل.</li>
    <li><b>الإيقاف:</b> يقدر العميل يوقف الاشتراك بإشعار قبل شهر. دفعة التأسيس ما تُسترد بعد بداية التجهيز. ولو تأخر الاشتراك الشهري أكثر من 10 أيام تتوقف الخدمة لين يُسدد.</li>
  </ol>`;
  const when = (t) => new Date(t).toLocaleString('ar-SA-u-ca-gregory-nu-latn', { dateStyle: 'medium', timeStyle: 'short' });
  const errMsg = (x) => ({ business: 'اكتب اسم النشاط', name: 'اكتب الاسم كامل', phone: 'اكتب جوال صحيح', busy: 'محاولات كثيرة، جرّب بعد شوي', not_agreed: 'علّم على الموافقة أول' }[x.code] || 'ما انحفظت، جرّب مرة ثانية');

  // الحالة: المنشأة (بمفتاحها) أو رابط عام يختار فيه الباقة
  const S = { plan: 'bot', app: false, biz: '', name: '', phone: '', agreed: null, pay: null, claimed: false, paid: false, ok: false, promo: null, promoMsg: '', card: false, due: null };
  let F = { bot: { setup_fee: 3500, monthly_fee: 350 }, bot_pay: { setup_fee: 5500, monthly_fee: 600 }, app: { setup_fee: 9000, monthly_fee: 150 } };
  let fixed = null; // رسوم المنشأة لو بمفتاح
  if (k) {
    let d;
    try { d = await post('info', {}); } catch (e) { $('doc').innerHTML = '<div class="card" style="text-align:center;padding:30px"><h2>الرابط غير صالح</h2><p class="muted">اطلب الرابط من المناوب</p></div>'; return; }
    const b = d.business, f = d.fees || {};
    fixed = { setup: Number(f.setup_fee || 0) + Number(f.app_setup_fee || 0), monthly: Number(f.monthly_fee || 0) + Number(f.app_monthly_fee || 0) };
    S.card = !!d.card; S.due = d.due || null;
    Object.assign(S, { plan: b.plan || 'bot', app: !!b.wants_app, biz: b.name, name: b.owner_name || '', phone: b.owner_phone ? I.phone(b.owner_phone) : '', agreed: d.agreed, pay: d.pay, claimed: !!d.paid_claim_at, paid: Number(d.setup_paid || 0) > 0 });
    document.title = `الدفعة الأولى · ${b.name}`;
  } else {
    try { F = (await post('terms', {})).fees || F; } catch (e) { /* الأسعار الافتراضية */ }
    const pre = new URLSearchParams(location.search);
    S.plan = pre.get('p') === 'bot_pay' ? 'bot_pay' : 'bot'; S.app = pre.get('app') === '1'; S.code = (pre.get('code') || '').trim().toUpperCase().slice(0, 24);
    // الرابط العام: لو رجع للصفحة يلقى موافقته وبيانات التحويل مثل ما تركها
    try { const m = JSON.parse(localStorage.getItem('ihj_firstpay') || 'null'); if (m && m.agreed && Date.now() - new Date(m.agreed.at).getTime() < 30 * 86400000) Object.assign(S, m); } catch (e) { /* */ }
  }
  const remember = () => { if (k) return; try { localStorage.setItem('ihj_firstpay', JSON.stringify({ plan: S.plan, app: S.app, biz: S.biz, name: S.name, phone: S.phone, agreed: S.agreed, pay: S.pay, claimed: S.claimed, promo: S.promo })); } catch (e) { /* */ } };
  // كود الخصم يحدد التأسيس والشهري بدل سعر الباقة
  const fees = () => fixed || (S.promo ? { setup: Number(S.promo.setup_fee) + (S.app ? F.app.setup_fee : 0), monthly: Number(S.promo.monthly_fee) + (S.app ? F.app.monthly_fee : 0) }
    : { setup: F[S.plan].setup_fee + (S.app ? F.app.setup_fee : 0), monthly: F[S.plan].monthly_fee + (S.app ? F.app.monthly_fee : 0) });
  async function applyCode(c) {
    c = String(c || '').trim().toUpperCase(); S.promoMsg = '';
    if (!c) { S.promo = null; return; }
    if (!/^[A-Z0-9]{2,24}$/.test(c)) { S.promo = null; S.promoMsg = 'الكود حروف إنجليزية وأرقام بس'; return; }
    try { const p = (await post('promo', { code: c })).promo || {}; if (p.ok) S.promo = p; else { S.promo = null; S.promoMsg = 'الكود غير صحيح أو انتهى'; } }
    catch (e) { S.promo = null; S.promoMsg = 'ما قدرنا نتأكد من الكود، جرّب مرة ثانية'; }
  }

  function paint() {
    const fe = fees(), half = Math.round(fe.setup / 2);
    $('doc').innerHTML = `
      <div class="paper">
        <a class="mark-brand" href="./"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="mk" fill="#6D28D9" d="M16 3C8.8 3 3 8.2 3 14.6c0 3.4 1.6 6.4 4.2 8.5L6 29l6.6-2.6c1.1.2 2.2.4 3.4.4 7.2 0 13-5.2 13-11.6S23.2 3 16 3z"/><path d="M10.5 15.2l3.6 3.6 7.4-7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>المناوب</a>
        <h1>الدفعة الأولى</h1>
        ${k ? `<div class="who"><b>${esc(S.biz)}</b> · ${PLAN[S.plan] || PLAN.bot}${S.app ? ' + تطبيق باسمكم' : ''}</div>`
          : `<div class="pk">${[['bot', F.bot], ['bot_pay', F.bot_pay]].map(([v, f]) => `<label><input type="radio" name="plan" value="${v}" ${S.plan === v ? 'checked' : ''} ${S.agreed ? 'disabled' : ''}><b>${PLAN[v]}</b><span>${money(f.setup_fee)} تأسيس + ${money(f.monthly_fee)} شهريًا</span></label>`).join('')}</div>
             <label class="check"><input type="checkbox" id="app" ${S.app ? 'checked' : ''} ${S.agreed ? 'disabled' : ''}>تطبيق باسمكم (${money(F.app.setup_fee)} + ${money(F.app.monthly_fee)} شهريًا)</label>
             ${S.agreed ? (S.promo ? `<div class="hint">كود الخصم ${esc(S.promo.code)}</div>` : '') : `<div class="g2 promo"><label class="f"><span>كود الخصم (لو عندك)</span><input id="pc" dir="ltr" maxlength="24" autocomplete="off" spellcheck="false" value="${esc(S.promo ? S.promo.code : (S.code || ''))}"></label><button class="btn ghost" id="pcGo" type="button">طبّق الكود</button></div>
             ${S.promo ? `<div class="hint" style="color:#047857">✓ الكود طبّق: ${money(S.promo.monthly_fee)} ريال شهريًا${Number(S.promo.setup_fee) ? ' + ' + money(S.promo.setup_fee) + ' تأسيس' : '، بدون تأسيس'}</div>` : (S.promoMsg ? `<div class="hint" style="color:#B42318">${esc(S.promoMsg)}</div>` : '')}`}`}
        ${half > 0 ? `<div class="amount"><span class="lbl">المطلوب الحين</span><div class="big">${money(half)} <small>ريال</small></div>
          <span class="tiny">نص التأسيس (${money(fe.setup)} ريال)، والنص الثاني عند التسليم. والاشتراك الشهري ${money(fe.monthly)} ريال يبدأ من يوم التشغيل.</span></div>`
          : `<div class="amount"><span class="lbl">الاشتراك الشهري</span><div class="big">${money(fe.monthly)} <small>ريال</small></div>
          <span class="tiny">بدون رسوم تأسيس، وما عليك دفعة الحين. الاشتراك يبدأ من يوم التشغيل.</span></div>`}
        ${S.agreed ? '' : `
          ${k ? '' : '<label class="f"><span>اسم النشاط</span><input id="bn" maxlength="80" autocomplete="organization" value="' + esc(S.biz) + '"></label>'}
          <div class="g2"><label class="f"><span>الاسم</span><input id="n" maxlength="60" autocomplete="name" value="${esc(S.name)}"></label><label class="f"><span>الجوال</span><input id="p" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx" autocomplete="tel" value="${esc(S.phone)}"></label></div>
          <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">`}
        <div class="agree ${S.agreed || S.ok ? 'on' : ''}" id="agreeBox">
          <label class="tick"><input type="checkbox" id="ok" ${S.agreed || S.ok ? 'checked' : ''} ${S.agreed ? 'disabled' : ''}>أوافق على اتفاقية خدمة المناوب</label>
          ${S.agreed ? `<span class="done-line">وافق ${esc(S.agreed.name || '')} · ${esc(when(S.agreed.at))}</span>` : ''}
          <details><summary>اقرأ الاتفاقية</summary>${terms(S.plan, S.app)}</details>
        </div>
        ${S.agreed ? '' : `<button class="btn lg block" id="go" type="button" ${S.ok ? '' : 'disabled'}>${icon('check')}أكمل للدفع</button><span class="msg" id="msg" role="status"></span>`}
      </div>
      ${S.agreed ? payPaper(half) : ''}`;
    bind();
  }
  // زر البطاقة: برابط المنشأة بس، ولما فيه مبلغ مستحق
  const cardOk = () => !!(k && S.card && S.due && !S.due.already && S.due.due > 0);
  const cardBtn = (label) => `<button class="btn lg block" id="card" type="button">${icon('check')}${label}</button><span class="tiny" style="text-align:center">مدى · أبل باي · بطاقة</span><span class="msg" id="msg3" role="status"></span>`;
  function payPaper(half) {
    if (!(half > 0)) {
      const month = S.due && S.due.kind === 'monthly' && S.due.already && fees().monthly > 0
        ? '<div class="okbox"><h3>استلمنا أول شهر ✅</h3><span>الاشتراك يبدأ من يوم التشغيل.</span></div>'
        : cardOk() ? cardBtn(`ادفع أول شهر بالبطاقة (${money(S.due.due)} ريال)`) + '<span class="tiny" style="text-align:center">اختياري، والاشتراك يبدأ من يوم التشغيل</span>' : '';
      return `<div class="paper"><div class="okbox"><h3>تم ✅</h3><span>نبدأ التجهيز، ويوصلك رابط البيانات بالواتساب.</span></div>${month}</div>`;
    }
    if (S.paid) return `<div class="paper"><div class="okbox"><h3>استلمنا الدفعة الأولى ✅</h3><span>نشتغل الحين على تجهيز الرد الآلي باسمكم.</span></div></div>`;
    const done = S.claimed ? `<div class="okbox"><h3>وصلنا خبر التحويل ✅</h3><span>نأكد التحويل ونبدأ التجهيز، ويوصلك رابط البيانات بالواتساب.</span></div>` : '';
    const card = cardOk() && !S.claimed ? cardBtn(`ادفع ${money(S.due.due)} ريال بالبطاقة`) : '';
    if (!S.pay) return `<div class="paper" id="payBox">${card}<h2 style="font-size:19px;margin:0">${card ? 'أو التحويل' : 'التحويل'}</h2><p class="muted" style="margin:0">بيانات التحويل توصلك بالواتساب من فريق المناوب.</p>${done}</div>`;
    const row = (l, v, cp, ltr) => `<div class="r"><span>${l}</span><b class="${ltr ? 'ltr' : ''}">${esc(v)}</b>${cp ? `<button class="btn sm ghost" type="button" data-cp="${esc(cp)}">${icon('copy')}نسخ</button>` : ''}</div>`;
    return `<div class="paper" id="payBox">${card}<h2 style="font-size:19px;margin:0">${card ? 'أو حوّل على الحساب' : 'بيانات التحويل'}</h2>
      <div class="bank">${row('المبلغ', money(half) + ' ريال', String(half))}${S.pay.bank ? row('البنك', S.pay.bank) : ''}${S.pay.holder ? row('اسم الحساب', S.pay.holder) : ''}${row('الآيبان', S.pay.iban.replace(/(.{4})/g, '$1 ').trim(), S.pay.iban, true)}</div>
      ${S.pay.note ? `<div class="hint">${esc(S.pay.note)}</div>` : ''}
      ${done || `<button class="btn lg block" id="sent" type="button">${icon('check')}حوّلت</button><span class="msg" id="msg2" role="status"></span>`}</div>`;
  }
  function bind() {
    document.querySelectorAll('[data-cp]').forEach((x) => x.onclick = () => I.copy(x.dataset.cp));
    if ($('card')) $('card').onclick = async (e) => {
      e.target.disabled = true; $('msg3').textContent = '';
      try {
        const r = await post('sub-pay', {});
        if (r.url) { location.href = r.url; return; }
        if (r.already) { S.due = Object.assign({}, S.due, { already: true, due: 0 }); paint(); return; }
        $('msg3').textContent = 'ما قدرنا نفتح الدفع، جرّب مرة ثانية';
      } catch (x) { $('msg3').textContent = x.code === 'no_card' ? 'الدفع بالبطاقة موقف الحين، حوّل على الحساب' : 'ما قدرنا نفتح الدفع، جرّب مرة ثانية'; }
      e.target.disabled = false;
    };
    const keep = () => { if ($('bn')) S.biz = $('bn').value; if ($('n')) S.name = $('n').value; if ($('p')) S.phone = $('p').value; };
    document.querySelectorAll('input[name=plan]').forEach((x) => x.onchange = () => { keep(); S.plan = x.value; paint(); });
    if ($('app')) $('app').onchange = (e) => { keep(); S.app = e.target.checked; paint(); };
    if ($('pcGo')) $('pcGo').onclick = async (e) => { keep(); e.target.disabled = true; await applyCode($('pc').value); paint(); };
    if ($('pc')) $('pc').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('pcGo').click(); } };
    if (!S.agreed) {
      $('ok').onchange = (e) => { S.ok = e.target.checked; $('agreeBox').classList.toggle('on', S.ok); $('go').disabled = !S.ok; $('msg').textContent = ''; };
      $('go').onclick = async (e) => {
        keep(); $('msg').textContent = '';
        if (!S.ok) { $('msg').textContent = 'علّم على «أوافق على اتفاقية خدمة المناوب»'; return; }
        e.target.disabled = true;
        try {
          const r = k ? await post('agree', { name: S.name, phone: S.phone, accept: true })
            : await post('agree-new', { business_name: S.biz, name: S.name, phone: S.phone, package: S.plan, wants_app: S.app, promo: S.promo ? S.promo.code : '', accept: true, website: $('hp') ? $('hp').value : '' });
          S.agreed = { name: S.name, at: new Date().toISOString() }; S.pay = r.pay || null;
          remember(); paint();
          const pb = $('payBox'); if (pb) pb.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (x) { $('msg').textContent = errMsg(x); e.target.disabled = false; }
      };
    }
    if ($('sent')) $('sent').onclick = async (e) => {
      e.target.disabled = true;
      try { if (k) await post('paid', {}); else await post('paid-new', { phone: S.phone }); S.claimed = true; remember(); paint(); }
      catch (x) { $('msg2').textContent = errMsg(x); e.target.disabled = false; }
    };
  }
