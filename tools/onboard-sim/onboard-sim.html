<title>محاكي اشتراك المناوب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* التخطيط: صفحة اشتراك بخطوات، سؤال واحد بكل شاشة؛ على الكمبيوتر قائمة الخطوات يمين والسؤال يسار، وعلى الجوال شريط تقدّم بس. الموقع فاتح دايم مثل almunawib.com */
:root{
  --bg:#F6FAF8; --ink:#102F27; --muted:#5E766C; --line:#DCEAE2; --soft:#E9F7EF; --card:#FFFFFF;
  --accent:#008C62; --accent-2:#007D56; --accent-ink:#FFFFFF; --dark:#0F231D; --dark-ink:#E6F4EE; --mint:#7FE0B5; --err:#B4380C;
  --display:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.3px}
.mark{width:32px;height:34px;display:grid;place-items:center;background:linear-gradient(145deg,#05AA71,#00764F);color:#fff;border-radius:11px 11px 11px 4px}
.mark .ico{width:19px;height:19px;stroke-width:2.2}
.site{direction:ltr;font-weight:700;color:var(--accent);font-size:14px}
.prog{max-width:1040px;margin:0 auto 22px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .35s ease}

.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:40px}
.steps{position:sticky;top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:grid;gap:4px}
.steps h2{margin:0 4px 8px;font-family:var(--display);font-size:18px;font-weight:800}
.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li button{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;border:0;background:transparent;text-align:right;padding:8px 6px;border-radius:12px}
.steps li button:disabled{cursor:default}
.steps li button:not(:disabled):hover{background:var(--soft)}
.steps .st{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.steps .st .ico{width:14px;height:14px;stroke-width:3;display:none}
.steps li.ok .st{background:var(--accent);border-color:var(--accent);color:#fff}
.steps li.ok .st .ico{display:block}.steps li.ok .st span{display:none}
.steps li.now .st{border-color:var(--accent);color:var(--accent)}
.steps b{display:block;font-size:14.5px;font-weight:600;line-height:1.5}
.steps li:not(.ok):not(.now) b{color:var(--muted)}
.steps small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:34px 34px 28px;min-height:420px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(16,47,39,.06)}
.card.anim{animation:in .28s ease both}
@keyframes in{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.card h1{margin:6px 0 20px;font-family:var(--display);font-size:clamp(26px,4.2vw,34px);line-height:1.35;font-weight:800;letter-spacing:-.3px;text-wrap:balance}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:15px 16px;font-size:18px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent);background:#fff}
textarea.inp{min-height:150px;resize:vertical;line-height:1.7}
.inp.ltr{direction:ltr;text-align:right;letter-spacing:.5px}
.err{min-height:24px;margin-top:8px;color:var(--err);font-size:14.5px;font-weight:600}

.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:11px;padding:8px 22px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,47,39,.12)}
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:18px;padding:30px 16px;background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s;color:var(--muted);font-weight:600}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.drop .ico{width:34px;height:34px;color:var(--accent)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{position:relative;width:104px;height:104px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;text-align:center;font-size:12px;padding:6px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:5px;inset-inline-start:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,35,29,.75);color:#fff;display:grid;place-items:center}
.thumb .x .ico{width:14px;height:14px;stroke-width:2.6}
.thumb .pdf{display:grid;gap:4px;justify-items:center;color:var(--muted);overflow-wrap:anywhere}
.thumb .pdf .ico{color:#C2410C;width:28px;height:28px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:grid;gap:8px;align-content:start;text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:18px;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:#A9D8C3}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.opt .t{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.opt b{font-size:17px;font-weight:700;line-height:1.45}
.opt span{font-size:14px;color:var(--muted);line-height:1.6}
.opt em{font-style:normal;font-weight:700;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}

.acts{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);min-height:50px}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn .ico{width:20px;height:20px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.link{border:0;background:transparent;color:var(--muted);font-weight:600;padding:10px 4px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--ink)}
.link .ico{width:18px;height:18px}

.sum{display:grid;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sum .r{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.sum .r:first-child{border-top:0}
.sum .r b{font-size:14px;color:var(--muted);font-weight:600}
.sum .r span{font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.sum .r .edit{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:6px}
.plan{margin-top:16px;background:var(--dark);color:var(--dark-ink);border-radius:20px;padding:18px 20px;display:grid;gap:12px}
.plan .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.plan .h b{font-family:var(--display);font-size:20px;font-weight:800;color:#fff}
.plan .h small{color:var(--mint);font-weight:700}
.plan .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plan .nums div{background:#183A30;border-radius:14px;padding:10px 12px;display:grid}
.plan .nums small{color:#A9CBBE;font-size:13px}
.plan .nums b{font-family:var(--display);font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.agree{margin-top:16px;display:flex;gap:12px;align-items:center;font-weight:600;cursor:pointer}
.agree input{width:22px;height:22px;accent-color:#008C62;flex:none}

.done{align-items:center;text-align:center;justify-content:center;gap:6px}
.done .ok{width:76px;height:76px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 6px}
.done .ok .ico{width:40px;height:40px;stroke-width:2.6}
.done h1{margin-bottom:6px}
.done ol{list-style:none;margin:14px auto 6px;padding:0;display:grid;gap:10px;text-align:right;max-width:440px;width:100%;counter-reset:s}
.done li{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 14px;counter-increment:s;font-weight:600}
.done li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.done .when{color:var(--accent);font-weight:700;margin-top:6px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .steps{display:none}
  .card{padding:24px 20px 20px;border-radius:20px;min-height:0}
  .opts{grid-template-columns:minmax(0,1fr)}
  .sum .r{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
  .sum .r b{grid-column:1/-1}
  .plan .nums{grid-template-columns:minmax(0,1fr)}
  .acts .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){.card.anim{animation:none}.prog i{transition:none}.spin{animation-duration:2s}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9 4.5 4h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/><path d="M5 13v8h14v-8"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
</svg>

<header class="top">
  <span class="brand"><span class="mark"><svg class="ico"><use href="#i-mark"/></svg></span>المناوب</span>
  <span class="site">almunawib.com</span>
</header>
<div class="prog" role="progressbar" aria-label="التقدّم" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" id="prog"><i id="progBar"></i></div>
<main class="wrap">
  <nav class="steps" aria-label="الخطوات">
    <h2>اشترك في المناوب</h2>
    <ol id="stepList"></ol>
  </nav>
  <section class="card" id="stage" aria-live="polite"></section>
</main>
<input type="file" id="file" accept="image/*,application/pdf" multiple hidden>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), fileIn = $('file');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id) => `<svg class="ico"><use href="#${id}"/></svg>`;
  const money = (n) => n.toLocaleString('en-US');

  // الأشياء المطلوبة فعلًا
  const STEPS = [
    { id: 'biz', label: 'اسم النشاط', q: 'وش اسم نشاطك؟' },
    { id: 'wa', label: 'رقم الواتساب', q: 'رقم الواتساب اللي يراسلك عليه عملاؤك' },
    { id: 'menu', label: 'الخدمات والأسعار', q: 'خدماتك وأسعارك' },
    { id: 'hours', label: 'الدوام', q: 'أوقات دوامك ويوم إجازتك' },
    { id: 'city', label: 'الموقع', q: 'وين موقعك؟' },
    { id: 'pay', label: 'الدفع', q: 'كيف يدفع عميلك؟' },
    { id: 'logo', label: 'الشعار', q: 'شعار نشاطك' },
    { id: 'sum', label: 'الملخص والدفعة الأولى', q: 'ملخص اشتراكك' },
  ];
  const PLANS = { yes: { name: 'الحجز + الدفع', setup: 5500, monthly: 600 }, no: { name: 'أتمتة الحجز', setup: 3500, monthly: 350 } };

  let A, cur, editing, fileTarget, paying;

  function phone(v) {
    const d = String(v).replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, '');
    const m = d.match(/^(?:00966|966|0)?(5\d{8})$/);
    return m ? '0' + m[1].slice(0, 2) + ' ' + m[1].slice(2, 5) + ' ' + m[1].slice(5) : null;
  }
  const filled = {
    biz: () => !!A.biz, wa: () => !!A.wa, menu: () => A.menuMode === 'photo' ? A.menuFiles.length > 0 : (A.menuText || '').trim().length >= 4,
    hours: () => !!A.hours, city: () => !!A.city, pay: () => !!A.pay, logo: () => !!A.logo, sum: () => !!A.paid,
  };
  const value = {
    biz: () => A.biz, wa: () => A.wa ? "⁦" + A.wa + "⁩" : "",
    menu: () => A.menuMode === 'photo' ? (A.menuFiles.length ? (A.menuFiles.length === 1 ? 'صورة وحدة' : A.menuFiles.length + ' صور') : '') : (A.menuText || '').trim().split('\n').slice(0, 2).join('، '),
    hours: () => A.hours, city: () => A.city, pay: () => A.pay ? (A.pay === 'yes' ? 'رابط دفع من الواتساب' : 'يدفع عندك') : '',
    logo: () => A.logo ? (A.logo === 'none' ? 'بدون شعار' : 'صورة') : '', sum: () => A.paid ? 'تم' : '',
  };

  // ===== قائمة الخطوات وشريط التقدّم =====
  function side() {
    const done = STEPS.filter((s) => filled[s.id]()).length;
    $('progBar').style.width = (done / STEPS.length * 100) + '%';
    $('prog').setAttribute('aria-valuenow', done);
    const reach = reachable();
    $('stepList').innerHTML = STEPS.map((s, i) => {
      const ok = filled[s.id](), now = i === cur;
      const v = s.id !== 'sum' && ok ? `<small>${esc(value[s.id]())}</small>` : '';
      return `<li class="${ok ? 'ok' : ''}${now ? ' now' : ''}"><button type="button" data-go="${i}" ${i <= reach && !A.paid ? '' : 'disabled'}><span class="st">${icon('i-check')}<span>${i + 1}</span></span><span><b>${esc(s.label)}</b>${v}</span></button></li>`;
    }).join('');
    $('stepList').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { const i = +b.dataset.go; editing = reachable() === STEPS.length - 1 && i < STEPS.length - 1; go(i); });
  }
  // أبعد خطوة يقدر يوصلها: أول خطوة ناقصة
  function reachable() { const i = STEPS.findIndex((s) => s.id !== 'sum' && !filled[s.id]()); return i < 0 ? STEPS.length - 1 : i; }

  function go(i) {
    cur = i; render(); side();
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }
  function nextFrom(i) {
    if (editing) { editing = false; return go(STEPS.length - 1); }
    go(Math.min(i + 1, STEPS.length - 1));
  }

  // ===== الشاشات =====
  function shell(inner, opts = {}) {
    const s = STEPS[cur];
    const n = cur < STEPS.length - 1 ? `<span class="kick">${cur + 1} من 7</span>` : '';
    const back = cur > 0 && !editing ? `<button class="link" type="button" id="back">${icon('i-back')}رجوع</button>` : (editing ? `<button class="link" type="button" id="back">${icon('i-back')}إلغاء</button>` : '<span></span>');
    const nextBtn = opts.noNext ? '' : `<button class="btn" type="submit" id="next">${editing ? 'حفظ' : (opts.nextLabel || 'التالي')}${editing ? '' : icon('i-next')}</button>`;
    stage.className = 'card' + (reduce ? '' : ' anim');
    stage.innerHTML = `<form id="f" novalidate style="display:contents">${n}<h1>${esc(opts.title || s.q)}</h1>${inner}<div class="err" id="err" role="alert"></div><div class="acts">${back}${nextBtn}</div></form>`;
    const bk = $('back'); if (bk) bk.onclick = () => { if (editing) { editing = false; return go(STEPS.length - 1); } go(cur - 1); };
    void stage.offsetWidth;
  }
  const err = (t) => { $('err').textContent = t || ''; };

  function textStep(key, opt) {
    shell(`<input aria-label="${esc(STEPS[cur].label)}" class="inp${opt.ltr ? ' ltr' : ''}" id="v" ${opt.type ? `type="${opt.type}" inputmode="${opt.mode || 'text'}"` : ''} autocomplete="off" placeholder="${esc(opt.ph || '')}" value="${esc(opt.val || '')}">`);
    const inp = $('v'); inp.focus();
    inp.oninput = () => err();
    $('f').onsubmit = (e) => { e.preventDefault(); const v = inp.value.trim(); const r = opt.check(v); if (r) { err(r); inp.focus(); return; } opt.save(v); nextFrom(cur); };
  }

  const R = {
    biz() { textStep('biz', { ph: 'مثل: صالون الأناقة', val: A.biz, check: (v) => v.length >= 2 ? '' : 'اكتب اسم النشاط', save: (v) => A.biz = v }); },
    wa() { textStep('wa', { type: 'tel', mode: 'tel', ltr: true, ph: '05xxxxxxxx', val: A.wa, check: (v) => phone(v) ? '' : 'اكتب رقم جوال سعودي يبدأ بـ05', save: (v) => A.wa = phone(v) }); },
    hours() { textStep('hours', { ph: 'مثل: من 4 العصر لين 12 الليل، والجمعة إجازة', val: A.hours, check: (v) => v.length >= 3 ? '' : 'اكتب أوقات الدوام', save: (v) => A.hours = v }); },
    city() { textStep('city', { ph: 'الحي والمدينة، أو المدن اللي تخدمها', val: A.city, check: (v) => v.length >= 2 ? '' : 'اكتب الحي والمدينة', save: (v) => A.city = v }); },

    menu() {
      const photo = A.menuMode === 'photo';
      shell(`<div class="seg" role="group" aria-label="طريقة الإرسال"><button type="button" data-m="photo" aria-pressed="${photo}">صورة</button><button type="button" data-m="text" aria-pressed="${!photo}">كتابة</button></div>
        ${photo ? `<div class="drop" id="drop" role="button" tabindex="0">${icon('i-up')}<span>اختر صورة القائمة أو اسحبها هنا</span></div><div class="thumbs" id="thumbs"></div>`
          : `<textarea class="inp" id="v" placeholder="قص شعر 40&#10;لحية 25" aria-label="الخدمات والأسعار">${esc(A.menuText || '')}</textarea>`}`);
      stage.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { if (!photo) A.menuText = $('v').value; A.menuMode = b.dataset.m; R.menu(); side(); });
      if (photo) { bindDrop('menu'); thumbs(); } else { const t = $('v'); t.focus(); t.oninput = () => { A.menuText = t.value; err(); side(); }; }
      $('f').onsubmit = (e) => { e.preventDefault(); if (!photo) A.menuText = $('v').value; if (!filled.menu()) { err(photo ? 'أرسل صورة القائمة' : 'اكتب الخدمات وأسعارها'); return; } nextFrom(cur); };
    },

    pay() {
      const card = (k, ico, t, d) => { const p = PLANS[k]; return `<button type="button" class="opt" role="radio" aria-checked="${A.pay === k}" data-p="${k}"><span class="t">${icon(ico)}</span><b>${t}</b><span>${d}</span><em>${p.name} · ${money(p.setup)} تأسيس + ${money(p.monthly)} شهريًا</em></button>`; };
      shell(`<div class="opts" role="radiogroup" aria-label="الدفع">${card('yes', 'i-card', 'يدفع من الواتساب', 'رابط دفع مدى وأبل باي وبطاقة، والفلوس تدخل حسابك')}${card('no', 'i-store', 'يدفع عندك', 'كاش أو شبكة في المحل')}</div>`);
      stage.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { A.pay = b.dataset.p; stage.querySelectorAll('[data-p]').forEach((x) => x.setAttribute('aria-checked', x === b ? 'true' : 'false')); err(); side(); });
      $('f').onsubmit = (e) => { e.preventDefault(); if (!A.pay) { err('اختر طريقة الدفع'); return; } nextFrom(cur); };
    },

    logo() {
      const hasImg = A.logo && A.logo !== 'none';
      shell(`<div class="drop" id="drop" role="button" tabindex="0">${icon('i-up')}<span>اختر الشعار أو اسحبه هنا</span></div><div class="thumbs" id="thumbs"></div>`, { nextLabel: 'التالي' });
      const acts = stage.querySelector('.acts');
      if (!hasImg) { const no = document.createElement('button'); no.type = 'button'; no.className = 'btn ghost'; no.textContent = 'ما عندي شعار'; no.onclick = () => { A.logo = 'none'; nextFrom(cur); }; acts.insertBefore(no, $('next')); }
      bindDrop('logo'); thumbs();
      $('f').onsubmit = (e) => { e.preventDefault(); if (!A.logo) { err('أرسل الشعار، أو اختر «ما عندي شعار»'); return; } nextFrom(cur); };
    },

    sum() {
      if (A.paid) return R.done();
      const p = PLANS[A.pay];
      const rows = STEPS.slice(0, 7).map((s, i) => `<div class="r"><b>${esc(s.label)}</b><span>${esc(value[s.id]())}</span><button class="edit" type="button" data-e="${i}">تعديل</button></div>`).join('');
      shell(`<div class="sum">${rows}</div>
        <div class="plan"><div class="h"><b>${p.name}</b><small>جاهز خلال 7 أيام عمل</small></div>
          <div class="nums"><div><small>الدفعة الأولى الحين</small><b>${money(p.setup / 2)} ريال</b></div><div><small>الدفعة الثانية عند التسليم</small><b>${money(p.setup / 2)} ريال</b></div><div><small>شهريًا من يوم التشغيل</small><b>${money(p.monthly)} ريال</b></div></div></div>
        <label class="agree"><input type="checkbox" id="ok" ${A.agreed ? 'checked' : ''}>أوافق على اتفاقية خدمة المناوب</label>`, { noNext: true });
      const acts = stage.querySelector('.acts');
      const pay = document.createElement('button'); pay.type = 'submit'; pay.className = 'btn'; pay.id = 'next'; pay.disabled = !A.agreed;
      pay.innerHTML = `ادفع الدفعة الأولى · ${money(p.setup / 2)} ريال`;
      acts.appendChild(pay);
      $('ok').onchange = (e) => { A.agreed = e.target.checked; pay.disabled = !A.agreed; };
      stage.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => { editing = true; go(+b.dataset.e); });
      $('f').onsubmit = async (e) => {
        e.preventDefault(); if (!A.agreed || paying) return;
        paying = true; pay.disabled = true; pay.innerHTML = '<span class="spin"></span>جاري الدفع';
        await new Promise((r) => setTimeout(r, reduce ? 300 : 1300));
        paying = false; A.paid = true; side(); R.done();
      };
    },

    done() {
      const p = PLANS[A.pay];
      stage.className = 'card done' + (reduce ? '' : ' anim');
      stage.innerHTML = `<span class="ok">${icon('i-check')}</span><h1>وصلت دفعتك الأولى</h1>
        <p style="margin:0;color:var(--muted);font-weight:600">${money(p.setup / 2)} ريال · ${esc(p.name)}</p>
        <ol><li>نجهّز ردود ${esc(A.biz)} وأسعاره ومواعيده</li><li>نرسل لك رابط تجربة تشوف فيه ردودك كأنك عميل</li><li>نربط رقمك، تاخذ دقيقتين من جوالك</li><li>نسلّمك، وتدفع الدفعة الثانية</li></ol>
        <div class="when">جاهز خلال 7 أيام عمل</div>
        <div class="acts" style="justify-content:center"><button class="btn ghost" type="button" id="again">${icon('i-redo')}ابدأ من جديد</button></div>`;
      $('again').onclick = start;
    },
  };

  // ===== رفع الصور =====
  function bindDrop(target) {
    const d = $('drop');
    fileTarget = target;
    fileIn.multiple = target === 'menu';
    fileIn.accept = target === 'menu' ? 'image/*,application/pdf' : 'image/*';
    d.onclick = () => { fileTarget = target; fileIn.click(); };
    d.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.click(); } };
    d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = (e) => { e.preventDefault(); d.classList.remove('over'); addFiles([...e.dataTransfer.files], target); };
  }
  function addFiles(list, target) {
    const ok = list.filter((f) => /^image\//.test(f.type) || (target === 'menu' && f.type === 'application/pdf'));
    if (!ok.length) { err(target === 'logo' ? 'الشعار لازم يكون صورة' : 'أرسل صورة أو PDF'); return; }
    const items = ok.map((f) => ({ name: f.name, img: /^image\//.test(f.type), url: /^image\//.test(f.type) ? URL.createObjectURL(f) : null }));
    if (target === 'menu') A.menuFiles = A.menuFiles.concat(items).slice(0, 5);
    else A.logo = items[0];
    err(); thumbs(); side();
    if (target === 'logo') { const no = [...stage.querySelectorAll('.btn.ghost')].find((b) => b.textContent === 'ما عندي شعار'); if (no) no.remove(); }
  }
  function thumbs() {
    const box = $('thumbs'); if (!box) return;
    const list = STEPS[cur].id === 'menu' ? A.menuFiles : (A.logo && A.logo !== 'none' ? [A.logo] : []);
    box.innerHTML = list.map((f, i) => `<div class="thumb">${f.img ? `<img src="${f.url}" alt="${esc(f.name)}">` : `<span class="pdf">${icon('i-file')}${esc(f.name)}</span>`}<button class="x" type="button" data-x="${i}" aria-label="حذف">${icon('i-x')}</button></div>`).join('');
    box.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => {
      if (STEPS[cur].id === 'menu') A.menuFiles.splice(+b.dataset.x, 1); else { A.logo = null; return R.logo(), side(); }
      thumbs(); side();
    });
  }
  fileIn.onchange = () => { const fs = [...(fileIn.files || [])]; fileIn.value = ''; if (fs.length) addFiles(fs, fileTarget); };

  function render() { R[STEPS[cur].id](); }
  function start() { A = { menuMode: 'photo', menuFiles: [] }; editing = false; paying = false; go(0); }
  start();
})();
</script>
